<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cleopatra AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
/* =============================================================================
   Ported verbatim from app/globals.css — design tokens, fonts, scrollbar,
   .silver-text gradient.
   ========================================================================== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg-base: #0a0a0b;
  --bg-surface: #0d0d0e;
  --bg-elevated: #141414;
  --bg-hover: #1a1a1a;
  --border: #1e1e1e;
  --border-subtle: #161616;
  --border-strong: #3a3a3a;
  --text-primary: #e8e4dc;
  --text-secondary: #b0aca4;
  --text-muted: #555;
  --text-faint: #444;
  --silver: #c8c8c8;
  --silver-bright: #f0f0f0;
  --silver-dim: #a0a0a0;
  --green: #4caf82;
  --purple: #9b8fd4;
  --font-body: 'DM Sans', sans-serif;
  --font-display: 'Syne', sans-serif;

  /* From app/responsive.css */
  --cleo-safe-top: env(safe-area-inset-top, 0px);
  --cleo-safe-bottom: env(safe-area-inset-bottom, 0px);
  --cleo-safe-left: env(safe-area-inset-left, 0px);
  --cleo-safe-right: env(safe-area-inset-right, 0px);
  --cleo-kb-inset: 0px;
  --cleo-topbar-h: 0px;
  --cleo-page-pad: 32px;
  --cleo-page-pad-y: 32px;
}

html {
  height: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  height: 100vh;
  height: 100dvh;
  max-width: 100%;
  overflow: hidden;
  overscroll-behavior-y: none;
}

html,
body {
  overflow-x: hidden;
}

img,
video {
  max-width: 100%;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }

input, button, textarea, select {
  font-family: var(--font-body);
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.8; }
}

@keyframes tabpulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

.silver-text {
  background: linear-gradient(135deg, var(--silver) 0%, var(--silver-bright) 50%, var(--silver-dim) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* =============================================================================
   Ported verbatim from app/responsive.css — the .cleo-* responsive layer.
   ========================================================================== */
.cleo-shell {
  display: flex;
  width: 100%;
  height: calc(100vh - var(--cleo-kb-inset));
  height: calc(100dvh - var(--cleo-kb-inset));
  overflow: hidden;
}

.cleo-main {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  padding-top: var(--cleo-topbar-h);
}

.cleo-topbar {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1300;
  align-items: center;
  gap: 10px;
  height: var(--cleo-topbar-h);
  padding: var(--cleo-safe-top) calc(12px + var(--cleo-safe-right)) 0
    calc(8px + var(--cleo-safe-left));
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
}

.cleo-topbar-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border: none;
  border-radius: 9px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
}

.cleo-topbar-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--silver);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cleo-nav-scrim {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1350;
  background: rgba(0, 0, 0, 0.55);
}

.cleo-nav-drawer-head {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 2px 6px 10px;
  margin-bottom: 6px;
  border-bottom: 1px solid var(--border-subtle);
}

.cleo-nav[data-expanded='false'] .cleo-nav-label {
  display: none;
}

@media (max-width: 767px) {
  :root {
    --cleo-topbar-h: calc(52px + var(--cleo-safe-top));
    --cleo-page-pad: 16px;
    --cleo-page-pad-y: 18px;
  }

  .cleo-topbar {
    display: flex;
  }

  .cleo-nav {
    position: fixed !important;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 1400;
    width: min(84vw, 288px) !important;
    padding: calc(14px + var(--cleo-safe-top)) 8px
      calc(14px + var(--cleo-safe-bottom)) calc(8px + var(--cleo-safe-left)) !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    transform: translateX(-102%);
    transition: transform 0.22s ease;
  }

  .cleo-nav[data-open='true'] {
    transform: translateX(0);
    box-shadow: 0 0 48px rgba(0, 0, 0, 0.65);
  }

  .cleo-nav-scrim[data-open='true'] {
    display: block;
  }

  .cleo-nav .cleo-nav-label {
    display: inline !important;
  }

  .cleo-nav-hamburger {
    display: none !important;
  }

  .cleo-nav-drawer-head {
    display: flex;
  }

  .cleo-nav .nav-item,
  .cleo-nav .cleo-nav-signout {
    height: 46px !important;
  }
}

@media (min-width: 768px) and (max-width: 1023px) {
  :root {
    --cleo-page-pad: 22px;
    --cleo-page-pad-y: 24px;
  }
}

.cleo-only-phone {
  display: none !important;
}

.cleo-only-compact {
  display: none !important;
}

@media (max-width: 767px) {
  .cleo-only-phone {
    display: inline-flex !important;
  }
  .cleo-hide-phone {
    display: none !important;
  }
}

@media (max-width: 1023px) {
  .cleo-only-compact {
    display: inline-flex !important;
  }
  .cleo-hide-compact {
    display: none !important;
  }
}

.cleo-panes {
  flex: 1;
  min-height: 0;
  display: grid;
  overflow: hidden;
}

.cleo-panes > .cleo-pane {
  min-width: 0;
  min-height: 0;
  height: 100%;
  overflow: hidden;
}

.cleo-panes > .cleo-pane-chat {
  display: flex;
  flex-direction: column;
}

.cleo-panes > .cleo-pane-list,
.cleo-panes > .cleo-pane-state {
  display: block;
  overflow-y: auto;
  overflow-x: hidden;
}

.cleo-panes > .cleo-pane-fan {
  display: block;
}

.cleo-panes-chat {
  grid-template-columns: 280px minmax(0, 1fr) 280px;
}

.cleo-panes-chat > .cleo-pane-list {
  overflow: hidden;
}

@media (min-width: 768px) and (max-width: 1023px) {
  .cleo-panes-chat {
    grid-template-columns: 244px minmax(0, 1fr);
  }
  .cleo-panes-chat > .cleo-pane-fan {
    display: none;
  }
  .cleo-panes-chat[data-pane='fan'] > .cleo-pane-chat {
    display: none;
  }
  .cleo-panes-chat[data-pane='fan'] > .cleo-pane-fan {
    display: block;
  }
}

@media (max-width: 767px) {
  .cleo-panes {
    display: block;
    grid-template-columns: none;
  }
  .cleo-panes > .cleo-pane {
    display: none;
  }
  .cleo-panes[data-pane='chat'] > .cleo-pane-chat {
    display: flex;
  }
  .cleo-panes[data-pane='list'] > .cleo-pane-list,
  .cleo-panes[data-pane='fan'] > .cleo-pane-fan,
  .cleo-panes[data-pane='state'] > .cleo-pane-state {
    display: block;
  }
}

.cleo-pane-back {
  display: none;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  margin-right: 2px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-elevated);
  color: var(--text-secondary);
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
}

@media (max-width: 767px) {
  .cleo-pane-back {
    display: inline-flex;
  }
}

.cleo-page {
  height: 100%;
  box-sizing: border-box;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: var(--cleo-page-pad-y) calc(var(--cleo-page-pad) + var(--cleo-safe-right))
    calc(var(--cleo-page-pad-y) + var(--cleo-safe-bottom))
    calc(var(--cleo-page-pad) + var(--cleo-safe-left));
}

.cleo-page-scroll {
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

.cleo-page-inner {
  box-sizing: border-box;
  padding: 32px calc(28px + var(--cleo-safe-right)) 80px
    calc(28px + var(--cleo-safe-left));
}

@media (max-width: 767px) {
  .cleo-page-inner {
    padding: 18px calc(16px + var(--cleo-safe-right))
      calc(56px + var(--cleo-safe-bottom)) calc(16px + var(--cleo-safe-left));
  }
}

.cleo-page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}

@media (min-width: 768px) {
  .cleo-page-head--center {
    align-items: center;
  }
}

.cleo-page-head > .cleo-page-head-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

@media (max-width: 767px) {
  .cleo-page-head {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .cleo-page-head > .cleo-page-head-actions {
    width: 100%;
  }
  .cleo-page-head > .cleo-page-head-actions > * {
    flex: 1;
    min-width: 0;
  }
}

.cleo-actionbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.cleo-grid-metrics {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
}

.cleo-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.cleo-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

@media (max-width: 1023px) {
  .cleo-grid-metrics {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 767px) {
  .cleo-grid-metrics {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  .cleo-grid-3,
  .cleo-grid-2 {
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
  }
}

.cleo-field-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

@media (max-width: 767px) {
  .cleo-field-row {
    grid-template-columns: minmax(0, 1fr);
  }
}

.cleo-card {
  padding: 20px;
}

@media (max-width: 767px) {
  .cleo-card {
    padding: 15px 13px;
  }
}

.cleo-scroll-x {
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
}

.cleo-tabstrip {
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
}

.cleo-tabstrip::-webkit-scrollbar {
  display: none;
}

.cleo-tabstrip > * {
  flex-shrink: 0;
}

.cleo-modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow-y: auto;
}

.cleo-modal-card {
  box-sizing: border-box;
  width: 100%;
  max-width: var(--cleo-modal-w, 480px);
  max-height: calc(100dvh - 48px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

@media (max-width: 767px) {
  .cleo-modal {
    align-items: flex-end;
    padding: calc(12px + var(--cleo-safe-top)) calc(10px + var(--cleo-safe-right))
      calc(10px + var(--cleo-safe-bottom)) calc(10px + var(--cleo-safe-left));
  }
  .cleo-modal-card {
    max-width: 100%;
    max-height: calc(100dvh - var(--cleo-safe-top) - var(--cleo-safe-bottom) - 22px);
  }
}

.cleo-lightbox-close {
  top: calc(16px + var(--cleo-safe-top)) !important;
  right: calc(16px + var(--cleo-safe-right)) !important;
}

@media (max-width: 767px) {
  .cleo-composer {
    padding: 10px calc(12px + var(--cleo-safe-right))
      calc(10px + var(--cleo-safe-bottom)) calc(12px + var(--cleo-safe-left)) !important;
    max-height: 46dvh;
    overflow-y: auto;
  }
  #aiPanel {
    max-height: 24dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .cleo-messages {
    padding: 14px calc(12px + var(--cleo-safe-right)) 14px
      calc(12px + var(--cleo-safe-left)) !important;
  }
  .cleo-chat-header {
    padding: 10px calc(12px + var(--cleo-safe-right)) 10px
      calc(12px + var(--cleo-safe-left)) !important;
    gap: 8px !important;
  }

  .cleo-chat-header > .cleo-chat-id {
    flex: 1 1 100% !important;
  }

  .cleo-chat-header > .cleo-chat-auto {
    margin-left: 0;
  }
}

@media (max-width: 1023px) {
  .cleo-chat-header {
    flex-wrap: wrap !important;
  }
}

.cleo-toast {
  bottom: calc(24px + var(--cleo-safe-bottom)) !important;
}

@media (max-width: 767px) {
  .cleo-toast {
    left: calc(12px + var(--cleo-safe-left)) !important;
    right: calc(12px + var(--cleo-safe-right)) !important;
    transform: none !important;
    text-align: center;
  }
}

/* =============================================================================
   Component styles lifted from the TSX files' inline <style> blocks.
   ========================================================================== */
.nav-item:hover { background: var(--bg-hover) !important; }
.nav-btn:hover {
  text-shadow: 0 0 12px rgba(200, 200, 200, 0.8);
  color: var(--silver) !important;
}
.nav-btn:hover svg rect {
  filter: drop-shadow(0 0 4px rgba(200, 200, 200, 0.6));
}

@keyframes sidebar-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.sidebar-row-actions { display: none; }
.sidebar-row:hover .sidebar-row-actions,
.sidebar-row:focus-within .sidebar-row-actions { display: flex; }
@media (hover: none) {
  .sidebar-row-actions { display: flex; }
  .sidebar-row > button { padding-right: 60px !important; }
}

/* Toast (cleo-toast) */
.cleo-toast {
  position: fixed;
  left: 24px;
  bottom: 24px;
  z-index: 2600;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 8;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  color: var(--text-primary);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  animation: fadeIn 0.15s ease;
  max-width: 340px;
}

/* Demo badge */
.demo-chip {
  position: fixed;
  right: 14px;
  bottom: 12px;
  z-index: 3000;
  pointer-events: none;
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--silver-dim);
  background: rgba(13, 13, 14, 0.82);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 11px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

/* Fake PPV media tiles (stand-ins for vault thumbnails — no external assets) */
.ppv-tile {
  background: linear-gradient(140deg, #241f38 0%, #3a2f55 45%, #191423 100%);
}
.ppv-tile-2 { background: linear-gradient(140deg, #2a1f2c 0%, #4a2f42 50%, #1c1218 100%); }
.ppv-tile-3 { background: linear-gradient(140deg, #1f2a2a 0%, #2f4a44 50%, #121c1a 100%); }
.ppv-tile-4 { background: linear-gradient(140deg, #2b2a1f 0%, #4a452f 50%, #1c1b12 100%); }

textarea::placeholder,
input::placeholder {
  color: var(--text-faint);
}
</style>
</head>
<body>

<!-- Phone top bar (AppShell.tsx) — mobile only, flipped on by the media query -->
<header class="cleo-topbar">
  <button type="button" class="cleo-topbar-btn" id="topbarMenu" aria-label="Open navigation">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <rect y="2" width="16" height="1.5" rx="0.75" fill="currentColor" />
      <rect y="7.25" width="16" height="1.5" rx="0.75" fill="currentColor" />
      <rect y="12.5" width="16" height="1.5" rx="0.75" fill="currentColor" />
    </svg>
  </button>
  <span class="cleo-topbar-title">CLEOPATRA AI</span>
</header>

<div class="cleo-shell">
  <!-- Left icon rail / phone drawer -->
  <nav class="cleo-nav" id="nav" data-expanded="false" data-open="false"
       style="width:48px;background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px 4px;gap:2px;flex-shrink:0;transition:width 0.2s ease;overflow:hidden">
    <div class="cleo-nav-drawer-head">
      <span style="font-size:13px;font-weight:600;color:var(--silver);font-family:var(--font-display);white-space:nowrap;padding-left:6px">CLEOPATRA AI</span>
      <button type="button" id="drawerClose" aria-label="Close navigation"
              style="width:38px;height:38px;border:none;border-radius:8px;background:transparent;color:var(--text-muted);font-size:20px;line-height:1;cursor:pointer">&times;</button>
    </div>

    <button type="button" class="nav-btn cleo-nav-hamburger" id="navHamburger" aria-label="Expand navigation"
            style="width:100%;height:40px;border-radius:8px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:0 10px;margin-bottom:8px;color:var(--text-secondary)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0">
        <rect y="2" width="16" height="1.5" rx="0.75" fill="currentColor" />
        <rect y="7.25" width="16" height="1.5" rx="0.75" fill="currentColor" />
        <rect y="12.5" width="16" height="1.5" rx="0.75" fill="currentColor" />
      </svg>
      <span class="cleo-nav-label" style="font-size:13px;font-weight:600;color:var(--silver);font-family:var(--font-display);white-space:nowrap">CLEOPATRA AI</span>
    </button>

    <a href="#/" class="nav-item" data-route="#/" style="width:100%;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:0 10px;text-decoration:none;color:var(--text-muted);background:transparent;white-space:nowrap;flex-shrink:0">
      <span style="display:flex;flex-shrink:0">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 2h12a1 1 0 011 1v7a1 1 0 01-1 1H5l-3 3V3a1 1 0 011-1z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" />
        </svg>
      </span>
      <span class="cleo-nav-label" style="font-size:13px">Chats</span>
    </a>
    <a href="#/analytics" class="nav-item" data-route="#/analytics" style="width:100%;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:0 10px;text-decoration:none;color:var(--text-muted);background:transparent;white-space:nowrap;flex-shrink:0">
      <span style="display:flex;flex-shrink:0">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="9" width="3" height="6" rx="0.75" fill="currentColor" />
          <rect x="6" y="5" width="3" height="10" rx="0.75" fill="currentColor" />
          <rect x="11" y="1" width="3" height="14" rx="0.75" fill="currentColor" />
        </svg>
      </span>
      <span class="cleo-nav-label" style="font-size:13px">Overview</span>

/* Seed conversations + message threads from the fake data. */
(function seed() {
  FANS.forEach(function (fan) {
    var msgs = (THREADS[fan.id] || []).map(function (m) {
      return { id: m.id, role: m.role, content: m.content, ppv: m.ppv || null };
    });
    state.messages[fan.id] = msgs;
    var lastFanMsg = '';
    for (var i = msgs.length - 1; i >= 0; i--) {
      if (msgs[i].role === 'fan') { lastFanMsg = msgs[i].content; break; }
    }
    state.conversations.push({
      fan: {
        id: fan.id, display_name: fan.name, total_spent: fan.spent,
        spend_tier: fan.tier, auto_mode: fan.auto
      },
      last_message: lastFanMsg || fan.preview,
      last_message_time: new Date(NOW - fan.minutesAgo * 60000),
      unread: fan.unread > 0,
      unread_count: fan.unread
    });
    state.suggestionIndex[fan.id] = 0;
    state.suggestions[fan.id] = (SUGGESTION_POOL[fan.id] || [])[0].slice();
    state.replyIdx[fan.id] = 0;
  });
})();

/* ---------------------------------------------------------------------------
   Small helpers (ports of lib/relativeTime.ts and friends)
   --------------------------------------------------------------------------- */
function esc(text) {
  return String(text == null ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatRelativeTime(value, now) {
  var diff = now - value.getTime();
  var minute = 60 * 1000;
  var hour = 60 * minute;
  var day = 24 * hour;
  if (diff >= 7 * day) return value.toLocaleDateString();
  if (diff >= day) return Math.floor(diff / day) + 'd';
  if (diff >= hour) return Math.floor(diff / hour) + 'h';
  if (diff >= minute) return Math.floor(diff / minute) + 'm';
  return 'now';
}

function formatOperationalTime(value) {
  if (!value) return 'unknown';
  var parsed = new Date(value);
  return isNaN(parsed.getTime()) ? value : parsed.toLocaleString();
}

function plural(count, noun) {
  return count + ' ' + noun + (count === 1 ? '' : 's');
}

function getInitials(displayName) {
  var parts = displayName.trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return displayName.slice(0, 2).toUpperCase() || '?';
}

function fanById(id) {
  for (var i = 0; i < state.conversations.length; i++) {
    if (state.conversations[i].fan.id === id) return state.conversations[i].fan;
  }
  return null;
}

function convById(id) {
  for (var i = 0; i < state.conversations.length; i++) {
    if (state.conversations[i].fan.id === id) return state.conversations[i];
  }
  return null;
}

function activeFan() {
  return state.activeFanId ? fanById(state.activeFanId) : null;
}

function tierBadgeStyle(tier) {
  if (tier === 'whale') return 'border:1px solid var(--silver);color:var(--silver)';
  if (tier === 'active') return 'border:1px solid var(--green);color:var(--green)';
  if (tier === 'casual') return 'border:1px solid var(--purple);color:var(--purple)';
  return 'border:1px solid var(--text-faint);color:var(--text-faint)';
}

function toast(message) {
  var el = document.createElement('div');
  el.className = 'cleo-toast';
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(function () {
    if (el.parentNode) el.parentNode.removeChild(el);
  }, 3200);
}

};

function currentRoute() {
  var hash = window.location.hash || '#/';
  return ROUTE_VIEWS[hash] ? hash : '#/';
}

function applyRoute() {
  state.route = currentRoute();
  var viewId = ROUTE_VIEWS[state.route];
  ['view-chats', 'view-analytics', 'view-placeholder'].forEach(function (id) {
    document.getElementById(id).style.display = (id === viewId) ? 'flex' : 'none';
  });
  if (state.route === '#/analytics') renderAnalytics();
  if (viewId === 'view-placeholder') renderPlaceholder();

  var items = document.querySelectorAll('.nav-item');
  for (var i = 0; i < items.length; i++) {
    var active = items[i].getAttribute('data-route') === state.route;
    items[i].style.color = active ? 'var(--silver)' : 'var(--text-muted)';
    items[i].style.background = active ? 'var(--bg-hover)' : 'transparent';
    if (active) items[i].setAttribute('aria-current', 'page');
    else items[i].removeAttribute('aria-current');
  }
  closeDrawer();
}

function closeDrawer() {
  state.drawerOpen = false;
  document.getElementById('nav').setAttribute('data-open', 'false');
  document.getElementById('navScrim').setAttribute('data-open', 'false');
}

function setNavExpanded(next) {
  state.navExpanded = next;
  try { localStorage.setItem('nav-expanded', String(next)); } catch (e) { /* private mode */ }
  var nav = document.getElementById('nav');
  nav.setAttribute('data-expanded', next ? 'true' : 'false');
  nav.style.width = next ? '180px' : '48px';
  document.getElementById('navHamburger').setAttribute(
    'aria-label', next ? 'Collapse navigation' : 'Expand navigation');
}

function setPane(pane) {
  state.pane = pane;
  document.getElementById('panes').setAttribute('data-pane', pane);
}

function filteredConversations() {
  var members = null;

    for (var i = 0; i < FAN_LISTS.length; i++) {
      if (FAN_LISTS[i].id === state.activeListId) members = FAN_LISTS[i].members;

  return state.conversations.filter(function (c) {
    if (members && members.indexOf(c.fan.id) === -1) return false;
    if (state.activeFilter === 'unread') return c.unread;

    if (state.activeFilter === 'auto_on') {

        (state.globalAutoMode && c.fan.auto_mode !== false);

  var items = state.suggestionsLoading ? ['', '', ''] : (state.suggestions[fan.id] || []).slice(0, 3);
  items.forEach(function (s, i) {
    html += '<button type="button" data-action="pick-suggestion" data-index="' + i + '"' +
      ((state.suggestionsLoading || !s.trim()) ? ' disabled' : '') +
      ' style="width:100%;text-align:left;padding:6px 10px;background:transparent;border:1px solid var(--border-subtle);border-radius:8px;color:' +

      ';position:relative;display:flex;flex-direction:column;gap:4px">';
    if (state.suggestionsLoading) {
      html += '<span style="padding:4px 4px">…</span>';

      s.split(' | ').forEach(function (part) {
        html += '<span style="display:block;padding:5px 10px;background:var(--bg-elevated);border-radius:6px;line-height:1.4">' + esc(part) + '</span>';

/* --- Interaction handlers -------------------------------------------------- */

function selectFan(fanId) {
  state.activeFanId = fanId;
  state.queue = [];
  state.picked = null;
  state.showScripts = false;
  var conv = convById(fanId);
  if (conv) { conv.unread = false; conv.unread_count = 0; }
  NOW = Date.now();
  setPane('chat');
  renderTabChip();
  renderSidebar();
  renderChat();
  renderFanPanel();
}

function toggleFanAuto() {
  var fan = activeFan();
  if (!fan) return;
  /* null → true → false → null, as the real per-fan toggle cycles. */
  var next = fan.auto_mode === null || fan.auto_mode === undefined ? true
    : fan.auto_mode === true ? false : null;
  fan.auto_mode = next;
  renderChatHeader();
  renderSidebar();
  renderTabChip();
  document.getElementById('aiBlock').style.display =
    (state.globalAutoMode || fan.auto_mode === true) ? 'none' : 'block';
  toast(next === true ? 'Auto enabled for this fan'
    : next === false ? 'Auto disabled for this fan' : 'This fan now follows creator Auto');
}

function regenerateSuggestions() {
  var fan = activeFan();
  if (!fan || state.suggestionsLoading) return;
  state.suggestionsLoading = true;
  state.picked = null;
  renderSuggestions();
  setTimeout(function () {
    var pool = SUGGESTION_POOL[fan.id] || SUGGESTION_POOL.f1;
    var idx = ((state.suggestionIndex[fan.id] || 0) + 1) % pool.length;
    state.suggestionIndex[fan.id] = idx;
    state.suggestions[fan.id] = pool[idx].slice();
    state.suggestionsLoading = false;
    renderSuggestions();
  }, 1000);
}

function pickSuggestion(index) {
  var fan = activeFan();
  var s = (state.suggestions[fan.id] || [])[index] || '';
  if (!s.trim()) return;
  var parts = s.split(' | ').map(function (p) { return p.trim(); }).filter(Boolean);
  var input = document.getElementById('composerInput');
  input.value = parts[0];
  autoGrow(input);
  state.queue = parts.slice(1);
  state.picked = { index: index, text: parts[0] };
  renderQueue();
  input.focus();
}

function autoGrow(textarea) {
  textarea.style.height = 'auto';
  var maxHeight = 20 * 3;
  textarea.style.height = Math.min(textarea.scrollHeight, maxHeight) + 'px';
}

function sendMessage() {
  var fan = activeFan();
  if (!fan) return;
  var input = document.getElementById('composerInput');
  var value = input.value.trim();
  if (!value || state.replySending) return;
  state.replySending = true;

  var msgs = state.messages[fan.id];
  msgs.push({ id: 'm' + (msgs.length + 1) + '-' + Date.now(), role: 'creator', content: value });

  var conv = convById(fan.id);
  if (conv) {
    conv.last_message = value;
    conv.last_message_time = new Date();
    NOW = Date.now();
  }

  input.value = '';
  autoGrow(input);
  state.picked = null;
  /* One turn's record redeems one send: the queued follow-up is promoted. */
  if (state.queue.length > 0) {
    var next = state.queue.shift();
    input.value = next;
    autoGrow(input);
  }
  renderMessages();
  renderQueue();
  renderSidebar();
  state.replySending = false;

  /* Canned fake fan reply after a short beat, like a realtime INSERT. */
  setTimeout(function () {
    var pool = CANNED_REPLIES[fan.id] || CANNED_REPLIES.f1;
    var idx = state.replyIdx[fan.id] % pool.length;
    state.replyIdx[fan.id] = idx + 1;
    var reply = pool[idx];
    var thread = state.messages[fan.id];
    thread.push({ id: 'r' + Date.now(), role: 'fan', content: reply });
    var c = convById(fan.id);
    if (c) {
      c.last_message = reply;
      c.last_message_time = new Date();
      NOW = Date.now();
    }
    if (state.activeFanId === fan.id) renderMessages();
    renderSidebar();
  }, 1400 + Math.floor(Math.random() * 900));
}

function sendPpv(price, count, title) {
  var fan = activeFan();
  if (!fan) return;
  var msgs = state.messages[fan.id];
  msgs.push({
    id: 'p' + Date.now(), role: 'creator', content: title || 'just for you...',
    ppv: { price: price, count: count, title: title }
  });
  var conv = convById(fan.id);
  if (conv) {
    conv.last_message = '💎 PPV Sent — $' + price;
    conv.last_message_time = new Date();
    NOW = Date.now();
  }
  renderMessages();
  renderSidebar();
}

function loadHistory() {
  var fan = activeFan();
  if (!fan || state.loadingHistoryFan) return;
  state.loadingHistoryFan = fan.id;
  renderFanPanel();
  setTimeout(function () {
    var h = FAN_EXTRA[fan.id].history;
    state.historyLines[fan.id] = h.fully
      ? 'History complete — ' + plural(h.imported, 'message') + ' over ' + plural(h.pages, 'page')
      : 'History importing — ' + plural(h.imported, 'message') + ' so far over ' + plural(h.pages, 'page');
    state.loadingHistoryFan = null;
    renderFanPanel();
    toast('Imported ' + plural(h.imported, 'message') + ' · ' + plural(h.pages, 'API call') +
      ', ~2.5 credits · ' + (h.fully ? 'all history imported' : 'more history remains'));
  }, 1100);
}

function cancelFollowup() {
  var fan = activeFan();
  if (!fan) return;
  FAN_EXTRA[fan.id].auto.followup = null;
  FAN_EXTRA[fan.id].auto.status = 'idle';
  renderFanPanel();
  toast('Follow-up cancelled');
}

      html += '<div style="color:var(--text-muted);font-size:11px;margin-top:3px">' + a.media + ' media' + (a.experience ? ' · ' + esc(a.experience) : '') + '</div>';
      html += '<div style="color:var(--text-secondary);font-size:12px;margin-top:6px">' + esc(a.message) + '</div></div>';
      html += '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">';
      html += '<button type="button" data-action="approval" data-approve="0" data-id="' + a.id + '" style="padding:7px 10px;border-radius:6px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-secondary)">Reject</button>';
      html += '<button type="button" data-action="approval" data-approve="1" data-id="' + a.id + '" style="padding:7px 10px;border-radius:6px;cursor:pointer;border:1px solid var(--silver);background:var(--silver);color:#111">Approve &amp; send</button>';
      html += '</div></div>';
    });
    html += '</div></section>';
  }

  /* Needs attention */
  html += '<section style="' + card + '">';
  html += sectionTitle('Needs attention', 'Only actionable states are shown here.');
  if (!data.attention.length) {
    html += '<div style="padding:22px 0;color:var(--text-muted);font-size:13px">No payment holds, failed actions, due follow-ups, or human-review flags.</div>';
  } else {
    html += '<div style="display:flex;flex-direction:column;gap:8px">';
    data.attention.forEach(function (row) {
      html += '<a href="#/" style="text-decoration:none;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px">';
      html += '<div style="min-width:0;flex:1"><div style="color:var(--text-primary);font-size:13px;font-weight:650">' + esc(row.fan) + '</div>';
      html += '<div style="color:var(--text-muted);font-size:11px;margin-top:3px">' + esc(row.state) + '</div>';
      if (row.error) html += '<div style="color:#e57689;font-size:11px;margin-top:5px">' + esc(row.error) + '</div>';
      html += '</div>';
      html += '<div style="color:' + (row.human || row.error ? '#e57689' : 'var(--text-secondary)') + ';font-size:11px;white-space:nowrap;align-self:center">Open chat →</div>';
      html += '</a>';
    });
    html += '</div>';
  }
  html += '</section></div>';

  document.getElementById('view-analytics').innerHTML = html;
}

function refreshAnalytics() {

}

/* ---------------------------------------------------------------------------
   Modals: Manage Lists, New/Edit List, PPV composer
   --------------------------------------------------------------------------- */
function closeModal() {
  var existing = document.getElementById('modalRoot');
  if (existing) existing.parentNode.removeChild(existing);
}

function openModal(innerHtml, width) {
  closeModal();
  var root = document.createElement('div');
  root.id = 'modalRoot';
  root.className = 'cleo-modal';
  root.style.zIndex = 200;
  root.style.background = 'rgba(0,0,0,0.6)';
  root.addEventListener('click', function (e) {
    if (e.target === root) closeModal();
  });
  root.innerHTML = '<div class="cleo-modal-card" style="max-width:' + width +
    'px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;padding:24px" data-modal-card>' + innerHtml + '</div>';
  document.body.appendChild(root);
}

function openManageLists() {
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">';
  html += '<div style="font-size:14px;font-weight:600;color:var(--text-primary)">Manage Lists</div>';
  html += '<div style="display:flex;align-items:center;gap:8px">';
  html += '<button type="button" data-action="new-list" style="font-size:11px;padding:5px 12px;border-radius:6px;cursor:pointer;background:var(--bg-hover);border:1px solid var(--border);color:var(--text-primary)">+ New List</button>';
  html += '<button type="button" data-action="close-modal" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:18px;line-height:1;padding:0 4px">&times;</button>';
  html += '</div></div>';
  if (!FAN_LISTS.length) {
    html += '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:20px">No lists yet. Create one above.</div>';
  }
  FAN_LISTS.forEach(function (list) {
    html += '<div data-action="edit-list" data-list="' + list.id + '" style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer">';
    html += '<div style="width:10px;height:10px;border-radius:50%;background:' + list.color + ';flex-shrink:0"></div>';
    html += '<div style="flex:1;font-size:13px;color:var(--text-primary)">' + esc(list.name) + '</div>';
    html += '<span style="font-size:11px;color:var(--text-muted)">' + list.members.length + ' fans</span>';
    if (list.excludeFromAuto) {
      html += '<span style="font-size:9px;padding:2px 6px;border-radius:999px;background:rgba(255,80,80,0.1);color:#ff6b6b;border:1px solid rgba(255,80,80,0.2)">AUTO EXCLUDED</span>';
    }
    html += '<span style="font-size:11px;color:var(--text-muted)">→</span></div>';
  });
  openModal(html, 420);
}

var listModalState = null;

function openListModal(mode, listId) {
  var list = null;
  FAN_LISTS.forEach(function (l) { if (l.id === listId) list = l; });
  listModalState = {
    mode: mode,
    listId: listId || null,
    name: list ? list.name : '',
    color: list ? list.color : '#9b8fd4',
    excludeFromAuto: list ? list.excludeFromAuto : false
  };
  renderListModal();
}

function renderListModal() {
  var m = listModalState;
  if (!m) return;
  var html = '<div style="font-size:14px;font-weight:600;margin-bottom:16px;color:var(--text-primary)">' +
    (m.mode === 'create' ? 'New List' : 'Edit List') + '</div>';
  html += '<input id="listNameInput" value="' + esc(m.name) + '" placeholder="List name" style="width:100%;background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text-primary);font-size:13px;margin-bottom:16px;outline:none" />';
  html += '<div style="margin-bottom:16px"><div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">COLOR</div><div style="display:flex;gap:8px">';
  LIST_COLORS.forEach(function (color) {
    html += '<div data-action="pick-color" data-color="' + color + '" style="width:24px;height:24px;border-radius:50%;background:' + color +
      ';cursor:pointer;border:' + (m.color === color ? '2px solid white' : '2px solid transparent') + ';flex-shrink:0"></div>';
  });
  html += '</div></div>';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding:10px 12px;background:var(--bg-surface);border-radius:8px">';
  html += '<div><div style="font-size:12px;color:var(--text-primary)">Exclude from Auto Mode</div>' +
    '<div style="font-size:10px;color:var(--text-muted)">AI won\'t auto-reply to fans in this list</div></div>';
  html += '<div data-action="toggle-exclude" style="width:36px;height:20px;border-radius:999px;cursor:pointer;background:' +
    (m.excludeFromAuto ? 'var(--green)' : 'var(--bg-hover)') + ';border:1px solid var(--border);position:relative;transition:background 0.2s;flex-shrink:0">' +
    '<div style="position:absolute;top:2px;left:' + (m.excludeFromAuto ? 18 : 2) + 'px;width:14px;height:14px;border-radius:50%;background:white;transition:left 0.2s"></div></div>';
  html += '</div>';
  html += '<div style="display:flex;gap:8px">';
  if (m.mode === 'edit') {
    html += '<button type="button" data-action="delete-list" style="padding:8px 14px;border-radius:8px;cursor:pointer;background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.3);color:#ff6b6b;font-size:12px">Delete</button>';
  }
  html += '<button type="button" data-action="close-modal" style="flex:1;padding:8px 14px;border-radius:8px;cursor:pointer;background:transparent;border:1px solid var(--border);color:var(--text-muted);font-size:12px">Cancel</button>';
  html += '<button type="button" data-action="save-list" style="flex:1;padding:8px 14px;border-radius:8px;cursor:pointer;background:var(--silver);border:none;color:#000;font-size:12px;font-weight:600">Save</button>';
  html += '</div>';
  openModal(html, 340);
  var nameInput = document.getElementById('listNameInput');
  if (nameInput) {
    nameInput.addEventListener('input', function () { listModalState.name = nameInput.value; });
    nameInput.focus();
  }
}

function saveList() {
  var m = listModalState;
  if (!m || !m.name.trim()) return;
  if (m.mode === 'create') {
    FAN_LISTS.push({ id: 'l' + Date.now(), name: m.name.trim(), color: m.color, excludeFromAuto: m.excludeFromAuto, members: [] });
  } else {
    FAN_LISTS.forEach(function (l) {
      if (l.id === m.listId) { l.name = m.name.trim(); l.color = m.color; l.excludeFromAuto = m.excludeFromAuto; }
    });
  }
  listModalState = null;
  closeModal();
  renderSidebar();
}

function deleteList() {
  var m = listModalState;
  if (!m || m.mode !== 'edit') return;
  FAN_LISTS = FAN_LISTS.filter(function (l) { return l.id !== m.listId; });
  if (state.activeListId === m.listId) state.activeListId = null;
  listModalState = null;
  closeModal();
  renderSidebar();
}

function renderPpvComposer() {

      html += '<div style="font-size:10px;color:var(--text-muted);margin-top:3px">' + set.media + ' media · default $' + set.price + ' · allowed ' + set.allowed + '</div>';
      html += '</div>';
      html += '<button type="button" data-action="select-set" data-set="' + set.id + '" style="padding:7px 12px;border-radius:7px;cursor:pointer;font-size:12px;border:1px solid ' +
        (active ? 'var(--purple)' : 'var(--border-strong)') + ';background:' + (active ? 'var(--purple)' : 'var(--bg-surface)') +
        ';color:' + (active ? '#111' : 'var(--text-secondary)') + '">' + (active ? 'Selected' : 'Select set') + '</button>';
      html += '</div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:7px">';
      for (var i = 0; i < set.media; i++) {
        html += '<div class="ppv-tile ppv-tile-' + ((i % 4) + 1) + '" style="position:relative;width:84px;height:108px;overflow:hidden;border-radius:7px;border:1px solid var(--border)">' +
          '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.25);color:var(--text-muted);font-size:18px">&#128274;</div>' +
          '<span style="position:absolute;left:4px;bottom:4px;padding:2px 5px;border-radius:999px;background:rgba(0,0,0,0.76);color:var(--text-muted);font-size:8px;text-transform:uppercase;letter-spacing:0.03em">unused</span></div>';
      }
      html += '</div></div>';
    });
    html += '</div>';
  } else {
    /* Manual mode: sale-history chips + album cards + media grid */
    var statuses = ['all', 'unused', 'payment_pending', 'not_sold', 'sold'];
    var counts = {
      all: PPV_MEDIA.length,
      unused: PPV_MEDIA.filter(function (m) { return m.status === 'unused'; }).length,
      payment_pending: PPV_MEDIA.filter(function (m) { return m.status === 'payment_pending'; }).length,
      not_sold: PPV_MEDIA.filter(function (m) { return m.status === 'not_sold'; }).length,
      sold: PPV_MEDIA.filter(function (m) { return m.status === 'sold'; }).length
    };
    html += '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:14px">';
    html += '<span style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-right:3px">Sale history</span>';

      var active = p.status === status;
      var label = status === 'not_sold' ? 'Not sold' : status === 'payment_pending' ? 'Pending' : status[0].toUpperCase() + status.slice(1);
      html += '<button type="button" data-action="ppv-status" data-status="' + status + '" style="padding:5px 10px;border-radius:999px;cursor:pointer;font-size:11px;border:1px solid ' +
        (active ? 'var(--purple)' : 'var(--border)') + ';background:' + (active ? 'rgba(155,143,212,0.13)' : 'transparent') +
        ';color:' + (active ? 'var(--purple)' : 'var(--text-muted)') + '">' + label + ' (' + counts[status] + ')</button>';
    });
    html += '</div>';

    html += '<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">Choose an album</div>';
    html += '<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px">';
    var albums = [{ value: 'all', label: 'All media', count: PPV_MEDIA.length }];
    ['Golden Hour', 'Late Night', 'Behind the Scenes'].forEach(function (album) {
      albums.push({ value: album, label: album, count: PPV_MEDIA.filter(function (m) { return m.album === album; }).length });
    });
    albums.forEach(function (album) {
      var active = p.album === album.value;
      html += '<button type="button" data-action="ppv-album" data-album="' + esc(album.value) + '" style="flex:0 0 126px;min-height:76px;padding:10px 9px;border-radius:8px;cursor:pointer;border:1px solid ' +
        (active ? 'var(--purple)' : 'var(--border)') + ';background:' + (active ? 'rgba(155,143,212,0.11)' : 'var(--bg-elevated)') +

        '<div style="font-size:20px;line-height:1">&#128193;</div>' +
        '<div style="font-size:11px;font-weight:600;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(album.label) + '</div>' +
        '<div style="font-size:9px;color:var(--text-muted);margin-top:3px">' + album.count + ' items</div></button>';
    });
    html += '</div>';

    var visible = PPV_MEDIA.filter(function (m) {
      var inAlbum = p.album === 'all' || m.album === p.album;
      var inStatus = p.status === 'all' ||
        (p.status === 'unused' && m.status === 'unused') ||
        m.status === p.status;
      return inAlbum && inStatus;
    });

    html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0">';
    html += '<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em">Individual media</div>';

      html += '<div style="padding:24px;border-radius:8px;border:1px dashed var(--border);color:var(--text-muted);text-align:center;font-size:12px">No media matches this album and sale-history filter.</div>';
    } else {
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;max-height:300px;overflow:auto;padding-right:4px">';
      visible.forEach(function (media) {
        var active = p.selected.indexOf(media.id) !== -1;
        var statusColor = media.status === 'sold' ? 'var(--green)'
          : media.status === 'payment_pending' ? '#e0b46d'
          : media.status === 'sent' ? 'var(--purple)'
          : 'var(--text-muted)';
        html += '<div role="checkbox" aria-checked="' + active + '" tabindex="0" data-action="toggle-ppv-media" data-media="' + media.id + '" style="overflow:hidden;border-radius:8px;cursor:pointer;text-align:left;position:relative;border:' +

        if (active) {
          html += '<div style="position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center;color:#111;font-size:12px;font-weight:800">&#10003;</div>';

        html += '<div style="font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + media.id + '_img.jpg</div>';
        html += '<div style="font-size:9px;color:' + statusColor + ';margin-top:3px;text-transform:uppercase">' + media.status.replace('_', ' ') + '</div>';
        html += '</div></div>';
      });
      html += '</div>';
    }
  }

  /* Footer: message + price + send */
  html += '<div class="cleo-field-row" style="grid-template-columns:minmax(0, 1fr) 160px;margin-top:18px">';
  html += '<div><label style="display:block;font-size:11px;color:var(--text-muted);margin-bottom:5px">Message</label>' +
    '<input id="ppvMessageInput" value="' + esc(p.message) + '" style="width:100%;box-sizing:border-box;padding:9px 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg-base);color:var(--text-primary)" /></div>';
  html += '<div><label style="display:block;font-size:11px;color:var(--text-muted);margin-bottom:5px">Price</label>' +
    '<div style="position:relative"><span style="position:absolute;left:10px;top:9px;color:var(--text-muted)">$</span>' +
    '<input id="ppvPriceInput" type="number" min="1" value="' + esc(p.price) + '" style="width:100%;box-sizing:border-box;padding:9px 10px 9px 24px;border-radius:7px;border:1px solid var(--border);background:var(--bg-base);color:var(--text-primary)" /></div></div>';
  html += '</div>';
  var attachedCount = p.selectedSet
    ? (PPV_SETS.filter(function (s) { return s.id === p.selectedSet; })[0] || { media: 0 }).media
    : p.selected.length;
  html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px">';
  html += '<div style="color:var(--text-muted);font-size:11px">' + attachedCount + ' media selected</div>';
  html += '<button type="button" data-action="send-ppv"' + (attachedCount ? '' : ' disabled') + ' style="padding:9px 16px;border-radius:8px;font-weight:700;border:1px solid var(--silver);background:var(--silver);color:#111;cursor:pointer;opacity:' +
    (attachedCount ? 1 : 0.5) + '">Send locked PPV</button>';
  html += '</div>';

  openModal(html, 1000);

  var msgInput = document.getElementById('ppvMessageInput');
  if (msgInput) msgInput.addEventListener('input', function () { ppvState.message = msgInput.value; });
  var priceInput = document.getElementById('ppvPriceInput');
  if (priceInput) priceInput.addEventListener('input', function () { ppvState.price = priceInput.value; });
}
/* ---------------------------------------------------------------------------
   Global event delegation
   --------------------------------------------------------------------------- */
document.addEventListener('click', function (event) {
  var paneTo = event.target.closest ? event.target.closest('[data-pane-to]') : null;
  if (paneTo) {
    setPane(paneTo.getAttribute('data-pane-to'));
    return;
  }

  var el = event.target.closest ? event.target.closest('[data-action]') : null;
  if (!el) {
    /* Clicking outside closes the per-row list dropdown. */
    if (state.listDropdownFanId) { state.listDropdownFanId = null; renderSidebar(); }
    return;
  }
  var action = el.getAttribute('data-action');
  var fanId = el.getAttribute('data-fan');
  var listId = el.getAttribute('data-list');

  switch (action) {
    case 'toggle-auto':
      state.globalAutoMode = !state.globalAutoMode;
      renderSidebar();
      renderTabChip();
      renderChat();
      toast(state.globalAutoMode ? 'Full Auto enabled for this creator' : 'Full Auto disabled for this creator');
      break;

    case 'sync-chats':
      if (state.syncingChats) break;
      state.syncingChats = true;
      renderSidebar();
      setTimeout(function () {
        state.syncingChats = false;
        renderSidebar();
        toast('Synced with Fansly · no new messages');
      }, 900);
      break;

    case 'mark-all-read':
      state.conversations.forEach(function (c) { c.unread = false; c.unread_count = 0; });
      NOW = Date.now();
      renderSidebar();
      break;

    case 'select-list':
      state.activeListId = listId || null;
      renderSidebar();
      break;

    case 'manage-lists':
      openManageLists();
      break;

    case 'new-list':
      openListModal('create', null);
      break;

    case 'edit-list':
      openListModal('edit', listId);
      break;

    case 'pick-color':
      if (listModalState) { listModalState.color = el.getAttribute('data-color'); renderListModal(); }
      break;

    case 'toggle-exclude':
      if (listModalState) { listModalState.excludeFromAuto = !listModalState.excludeFromAuto; renderListModal(); }
      break;

    case 'save-list':
      saveList();
      break;

    case 'delete-list':
      deleteList();
      break;

    case 'set-filter':
      state.activeFilter = el.getAttribute('data-filter');
      renderSidebar();
      break;

    case 'select-fan':
      selectFan(fanId);
      break;

    case 'list-dropdown':
      state.listDropdownFanId = state.listDropdownFanId === fanId ? null : fanId;
      renderSidebar();
      event.stopPropagation();
      break;

    case 'toggle-list-member':
      FAN_LISTS.forEach(function (list) {
        if (list.id !== listId) return;
        var idx = list.members.indexOf(fanId);
        if (idx === -1) list.members.push(fanId);
        else list.members.splice(idx, 1);
      });
      state.listDropdownFanId = null;
      renderSidebar();
      break;

    case 'toggle-fan-auto':
      toggleFanAuto();
      break;

    case 'pick-suggestion':
      pickSuggestion(parseInt(el.getAttribute('data-index'), 10));
      break;

    case 'clear-queue':
      state.queue = [];
      renderQueue();
      break;

    case 'use-script':
      var title = el.getAttribute('data-script');
      SCRIPTS.forEach(function (script) {
        if (script.title === title) {
          var input = document.getElementById('composerInput');
          input.value = script.content;
          autoGrow(input);
          input.focus();
        }
      });
      state.showScripts = false;
      renderScriptsPanel();
      break;

    case 'fan-tab':
      state.fanTab = el.getAttribute('data-tab');
      renderFanPanel();
      break;

    case 'toggle-member':
      state.showMember = !state.showMember;
      renderFanPanel();
      break;

    case 'toggle-model':
      state.showModel = !state.showModel;
      renderFanPanel();
      break;

    case 'toggle-ai':
      state.showAi = !state.showAi;
      renderFanPanel();
      break;

    case 'cancel-followup':
      cancelFollowup();
      break;

    case 'analytics-refresh':
      refreshAnalytics();
      break;

    case 'approval':
      var approvalId = el.getAttribute('data-id');
      var approved = el.getAttribute('data-approve') === '1';
      state.approvalsResolved[approvalId] = true;
      renderAnalytics();
      toast(approved ? 'PPV approved and sent' : 'PPV rejected');
      break;

    case 'close-modal':
      closeModal();
      listModalState = null;
      ppvState = null;
      break;

    /* PPV composer */
    case 'select-set':
      var setId = el.getAttribute('data-set');
      ppvState.selectedSet = setId;
      ppvState.selected = [];
      PPV_SETS.forEach(function (set) {
        if (set.id === setId) ppvState.price = String(set.price);
      });
      /* A set carries its media bundle; reflect it in the selection count. */
      PPV_SETS.forEach(function (set) {
        if (set.id === setId) ppvState.selected = ['set:' + set.id];
      });
      renderPpvComposer();
      break;

    case 'ppv-status':
      ppvState.status = el.getAttribute('data-status');
      renderPpvComposer();
      break;

    case 'ppv-album':
      ppvState.album = el.getAttribute('data-album');
      renderPpvComposer();
      break;

    case 'toggle-ppv-media':
      var mediaId = el.getAttribute('data-media');
      ppvState.selectedSet = null;
      var selIdx = ppvState.selected.indexOf(mediaId);
      if (selIdx === -1) ppvState.selected.push(mediaId);
      else ppvState.selected.splice(selIdx, 1);
      renderPpvComposer();
      break;

    case 'send-ppv':
      var price = parseInt(ppvState.price, 10);
      var count = ppvState.selectedSet
        ? (PPV_SETS.filter(function (s) { return s.id === ppvState.selectedSet; })[0] || { media: 1 }).media
        : ppvState.selected.length;
      if (!count || !price || price <= 0) { toast('Select media and enter a valid price.'); break; }
      var title = ppvState.mode === 'set' && ppvState.selectedSet
        ? (PPV_SETS.filter(function (s) { return s.id === ppvState.selectedSet; })[0] || {}).title
        : 'Custom bundle';
      closeModal();
      ppvState = null;
      sendPpv(price, count, title);
      toast('Locked PPV sent — awaiting payment');
      break;

    default:
      break;
  }
});

/* Change events (selects, fan detail inputs) */
document.addEventListener('change', function (event) {
  var el = event.target;
  if (el && el.getAttribute && el.getAttribute('data-action') === 'analytics-creator') {
    state.analyticsCreator = el.value;
    renderAnalytics();
  }
});

document.addEventListener('input', function (event) {
  var el = event.target;
  if (el && el.getAttribute && el.getAttribute('data-detail')) {
    var fan = activeFan();
    if (fan) FAN_EXTRA[fan.id].details[el.getAttribute('data-detail')] = el.value;
  }
});

/* Composer keyboard: Enter sends (Shift+Enter is left to the browser). */
document.getElementById('composerInput').addEventListener('keydown', function (event) {
  if (event.key !== 'Enter' || event.shiftKey) return;
  event.preventDefault();
  sendMessage();
});
document.getElementById('composerInput').addEventListener('input', function () {
  autoGrow(this);
});

/* Composer buttons */
document.getElementById('regenerateBtn').addEventListener('click', regenerateSuggestions);
document.getElementById('scriptsBtn').addEventListener('click', function () {
  state.showScripts = !state.showScripts;
  renderScriptsPanel();
});
document.getElementById('chooseSetBtn').addEventListener('click', function () { openPpvComposer('set'); });
document.getElementById('buildPpvBtn').addEventListener('click', function () { openPpvComposer('manual'); });
document.getElementById('aiToggle').addEventListener('click', function () {
  state.suggestionsOpen = !state.suggestionsOpen;
  document.getElementById('aiPanel').style.display = state.suggestionsOpen ? 'block' : 'none';
  document.getElementById('aiChevron').style.transform = state.suggestionsOpen ? 'rotate(0deg)' : 'rotate(180deg)';
  document.getElementById('aiToggle').style.padding = state.suggestionsOpen ? '0 0 10px 0' : '4px 0';
});

/* Rail + drawer */
document.getElementById('navHamburger').addEventListener('click', function () {
  setNavExpanded(!state.navExpanded);
});
document.getElementById('topbarMenu').addEventListener('click', function () {
  state.drawerOpen = true;
  document.getElementById('nav').setAttribute('data-open', 'true');
  document.getElementById('navScrim').setAttribute('data-open', 'true');
});
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.getElementById('navScrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', function (event) {
  if (event.key === 'Escape') closeDrawer();
});
document.getElementById('signOutBtn').addEventListener('click', function () {
  toast('This is a demo build — sign-out is disabled.');
});

/* New-tab dropdown: with one creator open, the real app shows "All creators
   are open". */
document.getElementById('newTabBtn').addEventListener('click', function () {
  toast('All creators are open');
});

/* Hash routing */
window.addEventListener('hashchange', applyRoute);

/* ---------------------------------------------------------------------------
   Boot
   --------------------------------------------------------------------------- */
(function init() {
  try {
    if (localStorage.getItem('nav-expanded') === 'true') setNavExpanded(true);
  } catch (e) { /* ignore */ }
  applyRoute();
  renderTabChip();
  renderSidebar();
  renderChat();
  renderFanPanel();
  setPane('list');
})();
</script>
</body>
</html>
