    creatorFollowers: "187K",
    creatorCreations: 34,
    hashtags: ["cod", "bodyguard", "slowburn", "m4a"],
    instructionCount: 2,
    description: "Your father's new close-protection detail: six days in, two changed routes, one photographer on Kestrel Street, and a man who answers to Ghost more readily than to Simon. He is paid to keep you alive, not to be charming.",
    greeting: "*The man your father hired does not shake your hand. He stands at the study window with his hands clasped behind him, watching the street four floors down like it owes him money.* \u201cRiley,\u201d *he says \u2014 which is not the name on any of your father's paperwork.* \u201cSimon Riley. Call me Ghost, call me sir, or call me nothing at all. What you will do is stay where I can see you, and what you will not do is be interesting in public.\u201d *He finally turns. His expression does not change.* \u201cYour father pays for discretion. He does not pay for me to like you. Those are separate budgets.\u201d",
    memories: [
      { id: "g1", kind: "identity", content: "Simon Riley, ex-military close protection, hired on a six-month contract by your father's firm. He answers to Ghost more readily than to Simon.", keywords: ["ghost", "bodyguard"], importance: 5, pinned: true, status: "active", scope: "every" },
      { id: "g2", kind: "relationship", content: "Ghost has decided you are a client first and a person second, and says so whenever you ask him a direct question about himself.", keywords: ["distance", "client"], importance: 4, pinned: false, status: "active", scope: "chat" },
      { id: "g3", kind: "event", content: "On the second day, a photographer across the street got Ghost's attention before yours. Nobody was hurt; the camera is now evidence.", keywords: ["photographer", "kestrel"], importance: 4, pinned: false, status: "active", scope: "chat" },
      { id: "g4", kind: "promise", content: "Ghost promised your father that nothing would happen to you on his watch, and repeats it like a man reading back a charge sheet.", keywords: ["vow", "father"], importance: 5, pinned: true, status: "active", scope: "every" },
      { id: "g5", kind: "preference", content: "Black coffee, no sugar, drunk standing up, always with his back to a wall.", keywords: ["coffee", "habits"], importance: 3, pinned: false, status: "active", scope: "every" },
      { id: "g6", kind: "boundary", content: "Ghost will not discuss his family, and changes the subject by asking you a question you have to answer.", keywords: ["family", "boundary"], importance: 5, pinned: true, status: "active", scope: "every" }
    ],
    coreCanon: [
      { id: "gc1", category: "identity", content: "Simon 'Ghost' Riley is your father's new bodyguard: British, ex-military, monosyllabic before coffee and not much chattier after." },
      { id: "gc2", category: "setting", content: "The family penthouse and the city below it. Ghost plans routes the way other people plan meals." },
      { id: "gc3", category: "relationship", content: "He is paid to keep you alive, not to be liked; everything else is budgeted separately." },
      { id: "gc4", category: "stakes", content: "Somebody has been photographing the family's comings and goings for weeks, and your father will not say why it matters." }
    ],
    summary: "Ghost has been on the detail for six days. He has changed your routes twice, moved the driver, and taught you exactly one thing: if he says get in the car, you get in the car and ask questions at the second safe house. The photographer from day two has not come back, which Ghost finds less reassuring than you do.",
    scene: { storyDay: 6, dateText: "the 3rd of November", timeOfDay: "late evening", place: "The penthouse", sub: "the study", present: ['Simon "Ghost" Riley', "Marlowe Finch"] },
    chapters: [
      { id: "ga1", start: 1, end: 12, summary: "Week one: the handover, the changed routes, and the photographer on Kestrel Street." },
      { id: "ga2", start: 13, end: 26, summary: "The gala, the second car, and the first time Ghost uses your name without the title." }
    ],
    replies: [
      { uses: ["g5"], arcs: [], text: "*He drinks the coffee standing, back to the wall, exactly as advertised.* \u201cYou're staring.\u201d *It is not a question, and he does not turn.* \u201cBlack, no sugar, standing up. Three constants in a week when your father has moved the goalposts twice. A person needs something that is true at four in the morning.\u201d" },
      { uses: ["g3", "g4"], arcs: ["ga1"], text: "*The folder lands on the table without ceremony.* \u201cKestrel Street, day two. Long lens, cheap camera, right hand \u2014 see the ring? He wasn't selling pictures to a paper. Papers don't pay for rings like that.\u201d *He closes the folder.* \u201cYour father hired me because somebody knew your schedule before I wrote it. I keep my promises. That isn't reassurance; it's a warning that I'll keep digging.\u201d" },
      { uses: ["g6"], arcs: [], text: "*You ask the question the drivers never ask, and the car goes very quiet.* \u201cNo,\u201d *he says, evenly.* \u201cWe're not doing that. Not because it's classified \u2014 because it's mine.\u201d *A beat.* \u201cYour turn: what did you tell your father you were doing on Tuesday? And don't lie. You're bad at it, and I've had worse jobs than telling him.\u201d" },
      { uses: ["g2"], arcs: ["ga2"], text: "*At the gala he is a shadow holding a champagne glass he never drinks from.* \u201cYou want to know if this gets easier,\u201d *he says, watching the room in a mirror instead of turning around.* \u201cIt does. Not because it gets safer \u2014 because you stop counting the exits when you start trusting the person watching them. Six days in, that's a compliment. Don't waste it.\u201d" }
    ],
    stories: [
      { id: "detail-six", title: "Day six, and the routes changed again", msgCount: 41, personaId: null, updated: hours(20), hasEarlier: false, earlier: [], messages: [
          { id: "dt1", role: "assistant", content: "*The man your father hired does not shake your hand. He stands at the study window with his hands clasped behind him, watching the street four floors down like it owes him money.* \u201cRiley,\u201d *he says \u2014 which is not the name on any of your father's paperwork.* \u201cSimon Riley. Call me Ghost, call me sir, or call me nothing at all. What you will do is stay where I can see you, and what you will not do is be interesting in public.\u201d *He finally turns. His expression does not change.* \u201cYour father pays for discretion. He does not pay for me to like you. Those are separate budgets.\u201d", at: hours(21), memoryIds: ["g1"], arcIds: ["ga1"] },
          { id: "dt2", role: "user", content: "Do you ever say a full sentence that isn't an order?", at: hours(21) },
          { id: "dt3", role: "assistant", content: "*For half a second something happens to his face that might be the ghost of a smile, gone before it can be evidence.* \u201cOnce a quarter.\u201d *He checks the corridor the way other people check the weather.* \u201cFull sentences are a liability. Short ones keep you alive longer. Ask your father about his last detail man \u2014 if you can find him.\u201d", at: hours(21), memoryIds: ["g2"], arcIds: [] },
          { id: "dt4", role: "user", content: "That's ominous and you know it.", at: hours(20) },
          { id: "dt5", role: "assistant", content: "*The coffee appears from somewhere; he is somehow always holding one.* \u201cGood. You noticed. That's the first bit of training that's stuck.\u201d *He nods toward the car.* \u201cBlack, no sugar \u2014 you'll want it. We're doing the harbour route twice tonight, and the second time is the one that matters.\u201d", at: hours(20), memoryIds: ["g5"], arcIds: [] },
          { id: "dt6", role: "user", content: "Why the second time?", at: hours(20) },
          { id: "dt7", role: "assistant", content: "*He waits until the elevator doors have closed before he answers.* \u201cBecause the first time is for whoever's watching the building. The second is for whoever's watching the watching.\u201d *The ring, the long lens, the cheap camera \u2014 he has been carrying all week.* \u201cKestrel Street taught me that. Cheap doesn't mean harmless.\u201d", at: hours(20), memoryIds: ["g3"], arcIds: ["ga1"] }
      ] }
    ]

    instructionCount: 3,
    description: "Four beginnings under one impatient waystone. Choose the dragon, the god, the king, or the merchant \u2014 and let Aerthos keep score of every road you take afterwards.",
    greeting: "*Dawn finds you at the Crossroads of Aerthos, where four roads meet under a stone the size of a chapel, and every traveller who ever mattered stood exactly where you are standing now.* \u201cChoose,\u201d *says the waystone \u2014 because in Aerthos the landmarks talk, and mostly they are impatient.* \u201cDragon, god, king, or merchant. The road remembers what you pick, and so will everyone you meet on it. Take your time. You have the whole of the first age to be wrong in.\u201d",
    memories: [
      { id: "f1", kind: "identity", content: "You are a traveller at the Crossroads of Aerthos, about to choose one of four beginnings: dragon, god, king, or merchant.", keywords: ["choice", "crossroads"], importance: 5, pinned: true, status: "active", scope: "every" },
      { id: "f2", kind: "event", content: "The waystone spoke at dawn and offered the four roads; it insists it has never done so twice for the same traveller.", keywords: ["waystone"], importance: 4, pinned: false, status: "active", scope: "chat" },
      { id: "f3", kind: "relationship", content: "A dragon called Vessareth has circled the crossroads since midnight, watching travellers the way a landlord watches tenants.", keywords: ["vessareth", "dragon"], importance: 4, pinned: false, status: "active", scope: "chat" },
      { id: "f4", kind: "promise", content: "The waystone promised the world would remember what you choose: there is no resetting between roads.", keywords: ["consequence"], importance: 5, pinned: true, status: "active", scope: "every" },
      { id: "f5", kind: "preference", content: "The merchant road begins at a toll bridge staffed by an accountant who accepts honesty as legal tender.", keywords: ["merchant", "toll"], importance: 3, pinned: false, status: "active", scope: "chat" },
      { id: "f6", kind: "boundary", content: "Nobody at the Crossroads will speak the true name of the eastern road aloud; they say it once, and the birds repeat it for years.", keywords: ["god-road", "names"], importance: 4, pinned: false, status: "active", scope: "every" }
    ],
    coreCanon: [
      { id: "fc1", category: "identity", content: "Aerthos, a high-fantasy world where one traveller may begin as a dragon, a god, a king, or a human merchant." },
      { id: "fc2", category: "setting", content: "The Crossroads: four roads, one impatient waystone, and a dragon overhead with opinions about the queue." },
      { id: "fc3", category: "stakes", content: "The first road you walk decides which doors open, and the world keeps the score." }
    ],
    summary: "You have stood at the Crossroads since dawn, which the waystone considers dithering and the dragon considers entertainment. Four roads run out from under the stone: the ember road north, where Vessareth circles; the quiet road east, that nobody names aloud; the king's road south, with its toll of vows; and the merchant road over the toll bridge. Nobody has chosen yet.",
    scene: { storyDay: 1, dateText: "the first day of Thawing", timeOfDay: "dawn", place: "The Crossroads of Aerthos", sub: "beneath the waystone", present: ["The waystone", "Vessareth", "Marlowe Finch"] },
    chapters: [
      { id: "fa1", start: 1, end: 10, summary: "The choosing: four roads, one dawn, and the dragon's wager." }
    ],
    replies: [
      { uses: ["f5"], arcs: ["fa1"], text: "\u201cThe merchant road, then. Sensible. Boring. Correct.\u201d *The waystone sounds almost disappointed.* \u201cThe toll bridge takes one honest sentence as payment. Not a true one \u2014 an honest one. There is a queue of kings behind you who could not manage either.\u201d" },
      { uses: ["f3"], arcs: ["fa1"], text: "*Vessareth lands close enough that the grass leans away.* \u201cDragon, is it?\u201d *Her voice arrives in the back of your skull rather than your ears.* \u201cGood. I have a wager with the stone about which road you'd pick, and I am winning. North, then \u2014 the ember road. Everything worth being begins as something that burns.\u201d" },
      { uses: ["f6"], arcs: [], text: "*The birds on the waystone go quiet, all at once, the way a room does.* \u201cYou asked about the eastern road,\u201d *says the stone, more gently now.* \u201cI will not say its name twice; the last person who heard it twice spent three ages answering to it. Walk it as a god if you must. But gods in Aerthos are made of the things mortals stop asking about them.\u201d" },
      { uses: ["f4", "f1"], arcs: [], text: "\u201cOne more thing before you step off, traveller.\u201d *The stone's shadow points down each road in turn, patient as a clock hand.* \u201cThe world keeps the score. Be a dragon tomorrow and the villages remember; be a king and the dragon remembers; be a merchant and, remarkably, everyone remembers. Aerthos has never once been surprised by what people become on the second road.\u201d" }
    ],
    stories: [
      { id: "the-choosing", title: "The choosing at the waystone", msgCount: 22, personaId: null, updated: days(2), hasEarlier: false, earlier: [], messages: [
          { id: "tc1", role: "assistant", content: "*Dawn finds you at the Crossroads of Aerthos, where four roads meet under a stone the size of a chapel, and every traveller who ever mattered stood exactly where you are standing now.* \u201cChoose,\u201d *says the waystone \u2014 because in Aerthos the landmarks talk, and mostly they are impatient.* \u201cDragon, god, king, or merchant. The road remembers what you pick, and so will everyone you meet on it. Take your time. You have the whole of the first age to be wrong in.\u201d", at: days(2), memoryIds: ["f1"], arcIds: ["fa1"] },
          { id: "tc2", role: "user", content: "What happens if I choose the dragon road?", at: days(2) },
          { id: "tc3", role: "assistant", content: "*The waystone makes a sound like a door considering.* \u201cNorth. Ember road. You would wake with a heartbeat like a forge and a memory that isn't yours \u2014 Vessareth's, mostly, and hers are older than the mountains she sleeps under.\u201d *Above you, the dragon angles a wing.* \u201cShe also wagers you'll pick it. I suggest you disappoint her. It's the only fun I get all century.\u201d", at: days(2), memoryIds: ["f3"], arcIds: [] },
          { id: "tc4", role: "user", content: "And the king's road?", at: days(2) },
          { id: "tc5", role: "assistant", content: "\u201cSouth. Three vows at the toll: one to your house, one to your soil, one to the first subject who tells you the truth.\u201d *The stone's voice takes on the weariness of repeating itself.* \u201cKings last longer than dragons in the record, and are remembered for less. The world keeps the score either way. Choose with that in mind.\u201d", at: days(2), memoryIds: ["f4"], arcIds: [] },
          { id: "tc6", role: "user", content: "You keep saying the world keeps the score.", at: days(2) },
          { id: "tc7", role: "assistant", content: "\u201cBecause it does \u2014 and because I am not permitted to explain it further than that.\u201d *A bird lands on the stone and repeats the last three words back to itself, learning.* \u201cI have stood here through four ages. Every road has led back to somebody asking me exactly that, at exactly this hour, with exactly that suspicious tone. It is, I assure you, not the tone that changes my answer.\u201d", at: days(2), memoryIds: ["f2"], arcIds: [] }
      ] }
    ]
  },

    description: "A jujutsu school RPG where the first day, the transfer file, and the incident that brought you to Kitasawa are yours to write. Curses leak where strong feelings pool; the paperwork is the part the school insists on.",
    greeting: "*The front gate of Kitasawa Prefectural Jujutsu School is older than the city around it, and the registrar at the folding desk beneath it has the tired smile of somebody who has explained this a thousand times.* \u201cTransfer student, yes? Curses manifest where strong feelings leak \u2014 schools, hospitals, construction sites, family dinners. You may write your own first day: the mission, the school, the incident on the way here. Or take a folder at random and we will find out together.\u201d *She stamps a form you have not filled in.* \u201cThe only rule is consent of the scene. Everything else \u2014 the setting, the stakes, who you were before the gate \u2014 that is your freedom of creativity.\u201d",

      { id: "j3", kind: "relationship", content: "Your classmate Oda claimed the desk beside yours on the first morning and has not asked a single question about your past \u2014 either kindness or strategy.", keywords: ["oda", "classmate"], importance: 4, pinned: false, status: "active", scope: "chat" },
      { id: "j4", kind: "promise", content: "You promised Washimura you would file an incident report the same day it happens, not the week after.", keywords: ["reports", "promise"], importance: 5, pinned: true, status: "active", scope: "chat" },
      { id: "j5", kind: "preference", content: "Curses in this district gather where people keep secrets: the closed wing of the hospital, the school archive, the rooftop nobody locks.", keywords: ["curses", "hauntings"], importance: 4, pinned: false, status: "active", scope: "every" },
      { id: "j6", kind: "boundary", content: "You will not discuss the incident that brought you to Kitasawa until you have decided what actually happened.", keywords: ["backstory", "boundary"], importance: 5, pinned: true, status: "active", scope: "every" },

    summary: "Three days at Kitasawa. You have a desk (beside Oda), a guardian registrar (Washimura), and a file with your name on it that is thinner than a transfer file should be. The first low-grade curse was cleared in the archive and filed the same evening, as promised. The hospital's closed wing has still not been filed at all.",

/* A faithful port of the app's markup + message-format layer: emphasis is only
   emphasis when it PAIRS, and in a roleplay *action* is narration rather than

function h(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

}

function nextPair(text, from) {

    if (ch !== "*" && ch !== "_") continue;
    const len = runLength(text, i);
    if (ch === "_" && !underscoreOpens(text, i)) { i += len - 1; continue; }
    const contentStart = i + len;
    if (contentStart >= text.length || /\s/.test(text[contentStart])) { i += len - 1; continue; }
    for (let close = contentStart; close < text.length; close += 1) {
      if (text[close] === "\\") { close += 1; continue; }
      if (text[close] !== ch) continue;
      const closeLen = runLength(text, close);
      if (closeLen !== len) { close += closeLen - 1; continue; }
      if (/\s/.test(text[close - 1])) { close += closeLen - 1; continue; }
      if (ch === "_" && !underscoreCloses(text, close + len)) { close += closeLen - 1; continue; }
      return { start: i, contentStart, contentEnd: close, end: close + len, bold: len >= 2, italic: len === 1 || len === 3 };

}
function scanMarkup(text, bold, italic, into) {
  let cursor = 0;
  while (cursor < text.length) {
    const pair = nextPair(text, cursor);
    if (!pair) { pushSeg(into, unescapeMarkup(text.slice(cursor)), bold, italic); return; }
    if (pair.start > cursor) pushSeg(into, unescapeMarkup(text.slice(cursor, pair.start)), bold, italic);
    scanMarkup(text.slice(pair.contentStart, pair.contentEnd), bold || pair.bold, italic || pair.italic, into);

function parseInline(text) {

}

/** Speech (inside quotation marks) and everything else, each with emphasis. */
function tokenize(content) {
  const segments = [];

  let cursor = 0;
  while (cursor < content.length) {
    const straight = content.indexOf('"', cursor);
    const curly = content.indexOf("\u201c", cursor);
    const opening = straight === -1 ? curly : curly === -1 ? straight : Math.min(straight, curly);
    if (opening === -1) { add(content.slice(cursor), "narration"); break; }
    if (opening > cursor) add(content.slice(cursor, opening), "narration");
    const mark = content[opening] === "\u201c" ? "\u201d" : '"';
    const closing = content.indexOf(mark, opening + 1);
    if (closing === -1) { add(content.slice(opening + 1), "speech"); break; }
    if (closing > opening + 1) add(content.slice(opening + 1, closing), "speech");
    cursor = closing + 1;
  }
  return segments;
}

/** What the chat actually draws: *action* is narration, never italics. */
function displaySegments(content) {
  const out = [];
  tokenize(content).forEach((seg) => parseInline(seg.text).forEach((piece) => {

}

function initials(name) {

/* The creation accent, derived exactly as the app derives it (a seed, not a
   theme: tempered toward the product's own violet and lifted for legibility). */
function normalizeAccent(value) {
  if (typeof value !== "string") return "#e879a9";
  const t = value.trim();
  if (/^#[0-9a-fA-F]{6}$/.test(t)) return t.toLowerCase();
  if (/^#[0-9a-fA-F]{3}$/.test(t)) return ("#" + t[1] + t[1] + t[2] + t[2] + t[3] + t[3]).toLowerCase();

}

}
function toHex(rgb) {
  return "#" + rgb.map((c) => Math.max(0, Math.min(255, Math.round(c))).toString(16).padStart(2, "0")).join("");

  const c = channels(hex);
  return toHex([c[0] + (towards[0] - c[0]) * amount, c[1] + (towards[1] - c[1]) * amount, c[2] + (towards[2] - c[2]) * amount]);

  return (Math.max(r, g, b) - Math.min(r, g, b)) / 255;
}

  const accent = excess <= 0 ? raw : mix(raw, VIOLET, Math.min(0.36, excess * 0.8));
  const [r, g, b] = channels(accent);

    ";--creation-accent:" + accent +
    ";--creation-accent-readable:" + readable +
    ";--creation-accent-bright:" + mix(accent, WHITE, lum >= 0.62 ? 0.12 : 0.34) +
    ";--creation-accent-deep:" + mix(accent, BLACK, 0.52) +
    ";--creation-accent-soft:" + mix(accent, VIOLET, 0.42) +
    ";--creation-accent-surface:" + mix(accent, BLACK, 0.88) +

    ";--creation-accent-glow:rgba(" + r + "," + g + "," + b + "," + (0.22 * glowScale).toFixed(3) + ")" +

}

function routeFromHash() {
  const raw = (location.hash || "").replace(/^#\/?/, "");
  const parts = raw.split("/").filter(Boolean);
  /* The default surface is Discover: the public feed, which is where the app
     itself opens a reader who has not chosen a destination. */
  if (!parts.length) return { view: "discover" };
  if (parts[0] === "chat") return { view: "chat", characterId: parts[1] || null };
  if (parts[0] === "characters" && parts[1]) return { view: "character", characterId: parts[1] };
  const known = ["chats", "library", "personas", "profile", "notifications", "creations", "worlds", "rankings", "discover"];
  return { view: known.includes(parts[0]) ? parts[0] : "discover" };
}
/**
 * Keep the open chat at #/chat. replaceState is refused in some sandboxes
 * (file: URLs in particular), so fall back to a plain hash set.
 */
function normalizeChatHash() {
  if (location.hash === "#/chat") return;
  try { history.replaceState(null, "", "#/chat"); } catch (_) { location.hash = "#/chat"; }
}
function applyRoute() {
  const route = routeFromHash();
  state.sidebarOpen = false;
  if (route.view === "chat") {
    if (route.characterId && CHARACTERS.some((c) => c.id === route.characterId) && route.characterId !== state.characterId) {
      selectChat(route.characterId, null);
      return;
    }
    if (state.view !== "chat") { state.view = "chat"; render(); }
    else syncShell();
    normalizeChatHash();
    return;
  }
  if (route.view === "character") {
    /* A character id that does not exist falls back to the feed rather than
       rendering an empty hero. */
    if (!CHARACTERS.some((c) => c.id === route.characterId)) {
      if (location.hash !== "#/discover") { navigate("#/discover"); return; }
      route.view = "discover";
    }
  }
  if (route.view === "character") {
    const entering = state.view !== "character";
    const changed = route.characterId !== state.profileId;
    if (changed) {
      state.profileId = route.characterId;
      state.profileSection = "overview";
      state.profileOverviewOpen = false;
      state.profileDraft = "";
      state.profileNotice = null;
      state.reportOpen = false;
      state.reportSent = false;
    }
    if (entering || changed) {
      /* Remember where the reader came from so Back returns to that surface
         (deep links and boot still fall back to Discover). Set on every entry
         into the page — including a Page press from this creation's own chat,
         where only the view changes. */
      if (entering) state.profileBack = VIEW_HASH[state.view] || "#/discover";
      state.view = "character";
      render();
      const scroller = el("view").querySelector(".s-page");
      if (scroller) scroller.scrollTop = 0;
      return;
    }
    syncShell();
    return;
  }
  if (state.view !== route.view) { state.view = route.view; render(); }
  else syncShell();
}
window.addEventListener("hashchange", applyRoute);

function selectChat(characterId, storyId) {
  const char = CHARACTERS.find((c) => c.id === characterId) || CHARACTERS[0];
  state.characterId = char.id;
  const story = storyOf(char, storyId) || char.stories[0];
  state.conversationId = story ? story.id : null;
  state.view = "chat";
  state.toolsOpen = false;
  state.editingMessageId = null;
  state.sheet = null;
  state.addingMemory = false;
  state.memoryDraft = null;
  renderSheet();
  render();
  normalizeChatHash();
}

function syncShell() {
  const shell = el("shell");
  shell.className = "app-shell" + (state.collapsed ? " sidebar-collapsed" : "") + (state.sidebarOpen ? " sidebar-open" : "");
  const sidebar = el("sidebar");
  sidebar.className = "sidebar" + (state.sidebarOpen ? " open" : "");
}
function isPhone() { return window.matchMedia("(max-width: 500px)").matches; }
function toggleMenu() {
  if (isPhone()) state.sidebarOpen = true;
  else state.collapsed = !state.collapsed;
  syncShell();
  if (state.view !== "chat") render();
}
function closeMenu() { state.sidebarOpen = false; syncShell(); }

function render() {
  syncShell();
  el("sidebar").innerHTML = sidebarHTML();
  const view = el("view");
  /* Remember where the reader was: the feed and the character page are their
     own scroll containers, and re-rendering them (a save toggle, a sort) must
     not throw the reader back to the top. */
  const prevScroll = view.querySelector(".f-feed, .s-page");
  const prevTop = prevScroll ? prevScroll.scrollTop : 0;
  const prevKind = prevScroll ? (prevScroll.classList.contains("f-feed") ? "f-feed" : "s-page") : null;
  switch (state.view) {
    case "chat": view.innerHTML = chatPanelHTML(); afterChatRender(); break;
    case "chats": view.innerHTML = chatsViewHTML(); break;
    case "discover": view.innerHTML = discoveryFeedHTML(); afterFeedRender(); break;
    case "character": view.innerHTML = profilePageHTML(); afterProfileRender(); break;
    case "library": view.innerHTML = libraryViewHTML(); break;
    case "personas": view.innerHTML = personasViewHTML(); break;
    default: view.innerHTML = placeholderViewHTML(state.view);
  }
  if (prevKind) {
    const next = view.querySelector(prevKind);
    if (next && next.scrollTop !== prevTop) next.scrollTop = prevTop;
  }
}

function messageHTML(message, index, total) {
  const char = character();
  const persona = activePersona(currentStory());

  const editing = state.editingMessageId === message.id;
  let bubble;
  if (editing) {
    bubble = '<div class="bubble editing"><div class="inline-editor">' +

      '<button class="save-edit" data-act="msg-edit-save" data-id="' + message.id + '">Save</button></div></div></div>';
  } else if (!message.content) {
    bubble = '<div class="bubble typing"><i></i><i></i><i></i></div>';
  } else {
    bubble = '<div class="bubble">' + renderMessage(message.content) + "</div>";
  }
  return '<article class="message ' + message.role + '" data-message="' + message.id + '">' +
    (message.role === "assistant" ? avatarHTML(char, false) : "") +
    '<div class="message-stack"><div class="message-meta"><strong>' +
      (message.role === "assistant" ? creationSubject(char) : persona.name) +

function transcriptHTML() {
  const story = currentStory();

  out += '<div class="date-divider"><span>' + (story && story.hasEarlier ? "EARLIER IN THE STORY" : "THE STORY SO FAR") + "</span></div>";
  out += messages.map((m, i) => messageHTML(m, i, messages.length)).join("");
  return out;
}

function composerToolsHTML() {
  if (!state.toolsOpen) return "";
  const char = character();
  const count = char.memories.filter((m) => m.status !== "superseded").length;
  const persona = activePersona(currentStory());
  const tool = (name, icon, label, small) =>
    '<button data-act="tool" data-tool="' + name + '">' + ic(icon, 16) + "<strong>" + label + "</strong><small>" + small + "</small></button>";
  return '<div class="composer-tools">' +
    tool("world", "globe", "Worlds", "In this story") +
    tool("persona", "users", "Persona", persona.name) +
    tool("instructions", "sliders", "Instructions", "Pacing and tone") +
    tool("memories", "brain", "Memories", count ? count + " remembered" : "What she remembers") +
    tool("engine", "sparkles", "Engine", ENGINE_LABEL) +
    "</div>";
}
function afterChatRender() {
  const messages = el("messages");
  if (messages) {
    messages.scrollTop = messages.scrollHeight;
    messages.addEventListener("scroll", trackScroll);
  }
  const composer = el("composer");
  if (composer) {
    composer.addEventListener("input", onComposerInput);
    composer.addEventListener("keydown", onComposerKey);
    autoGrow(composer);
  }
  const editor = el("inline-editor");
  if (editor) {
    editor.focus();
    editor.addEventListener("keydown", (event) => {
      if (event.key === "Escape") { state.editingMessageId = null; render(); }
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        const save = document.querySelector('[data-act="msg-edit-save"]');
        if (save) save.click();
      }
    });
  }
}
function trackScroll(event) {
  const node = event.currentTarget;
  const atBottom = node.scrollHeight - node.scrollTop - node.clientHeight < 40;
  state.pinnedToBottom = atBottom;
  const jump = el("jump-latest");
  if (jump) jump.hidden = atBottom;
}
function jumpToLatest() {
  const messages = el("messages");
  if (messages) messages.scrollTop = messages.scrollHeight;
}
function autoGrow(node) {
  node.style.height = "auto";
  node.style.height = node.scrollHeight + "px";
}
function onComposerInput(event) {
  autoGrow(event.target);
  const send = el("send-btn");
  if (send) send.disabled = state.streaming || !event.target.value.trim();
}
function onComposerKey(event) {
  if (event.key === "Enter" && !event.shiftKey && !window.matchMedia("(max-width: 760px)").matches) {
    event.preventDefault();
    sendMessage();
  }
}
function renderTranscript() {
  const messages = el("messages");
  if (!messages) return;
  messages.innerHTML = transcriptHTML();
  jumpToLatest();
}

/* ------------------------------- chats view ------------------------------- */
function chatsViewHTML() {
  const needle = state.chatSearch.trim().toLowerCase();
  const groups = CHARACTERS.map((char) => ({
    char,
    stories: char.stories.slice().sort((a, b) => new Date(b.updated).getTime() - new Date(a.updated).getTime())
  })).filter(({ char, stories }) => {
    if (!needle) return true;
    if (creationTitle(char).toLowerCase().includes(needle)) return true;
    return stories.some((s) => s.title.toLowerCase().includes(needle));
  }).sort((a, b) => {
    const left = a.stories[0] ? new Date(a.stories[0].updated).getTime() : 0;
    const right = b.stories[0] ? new Date(b.stories[0].updated).getTime() : 0;
    return right - left;
  });

  const cards = groups.map(({ char, stories }) => {
    const newest = stories[0];
    const open = stories.length > 1 && state.expanded[char.id];
    const rows = stories.map((story) =>
      '<button class="storyRow" data-act="open-chat" data-char="' + char.id + '" data-conv="' + story.id + '">' +
        "<span><strong>" + h(story.title) + "</strong><small>" + story.msgCount + " messages \u00b7 " + personaName(story.personaId) + "</small></span>" +
        "<time>" + relativeDay(story.updated) + "</time></button>"
    ).join("");
    return '<article class="chatGroup" style="' + accentVariables(char.accent) + '">' +
      '<div class="chatHead"><span class="chatArt" aria-hidden>' + (char.img ? '<img src="' + char.img + '" alt="" loading="lazy" />' : initials(char.name)) + "</span>" +
        '<button class="chatIdentity" data-act="open-chat" data-char="' + char.id + '" data-conv="' + (newest ? newest.id : "") + '">' +
          "<strong>" + h(creationTitle(char)) + "</strong>" +
          '<span class="chatMeta"><span>' + kindLine(char) + '</span><span aria-hidden>·</span><span>' + stories.length + (stories.length === 1 ? " story" : " stories") + "</span>" +
          (newest ? '<span aria-hidden>·</span><span>' + relativeDay(newest.updated) + "</span>" : "") + "</span>" +
          (newest ? '<span class="chatPreview">' + h(compactPreview(newest.title, 90)) + "</span>" : "") +
        "</button>" +
        (stories.length > 1 ? '<button class="chip" data-act="expand" data-char="' + char.id + '" aria-expanded="' + (open ? "true" : "false") + '">' + (open ? "Hide" : "All " + stories.length) + "</button>" : "") +
      "</div>" +
      (open
        ? '<div class="chatStories">' + rows + '<button class="newStory" data-act="open-chat" data-char="' + char.id + '">' + ic("plus", 14) + "Start another story</button></div>"
        : '<div class="chatStories"><button class="newStory" data-act="open-chat" data-char="' + char.id + '">' + ic("plus", 14) + (char.stories.length ? "Start another story" : "Start the first story") + "</button></div>") +
    "</article>";
  }).join("");

  const totalStories = CHARACTERS.reduce((n, c) => n + c.stories.length, 0);
  return '<section class="page"><div class="inner">' +
    '<header class="header">' +
      '<button class="iconButton menuButton" data-act="menu" aria-label="Open menu">' + ic("menu", 18) + "</button>" +
      '<div class="headerCopy"><span class="pageEyebrow">Your stories</span><h1 class="title">Chats</h1>' +
      '<p class="lede">Every creation you have talked to, and every separate story you have with them.</p></div>' +
      '<div class="headerActions"><button class="button uiPrimary" data-act="go" data-hash="#/creations">' + ic("plus", 16) + "New</button>" + bellHTML() + "</div>" +
    "</header>" +
    (CHARACTERS.length ? '<div class="field" style="margin-bottom:18px"><label class="fieldLabel" for="chat-search">Find a creation or a story</label>' +
      '<div style="position:relative">' +
        '<span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none;display:inline-flex">' + ic("search", 15) + "</span>" +
        '<input id="chat-search" class="input" style="padding-left:34px" placeholder="Search by name\u2026" value="' + h(state.chatSearch) + '" /></div></div>' : "") +
    (groups.length === 0
      ? '<div class="empty">' + ic("messageSquare", 26) + "<h2>Nothing matches that</h2><p>Try a different name, or clear the search to see everything.</p></div>"
      : '<div class="stack">' + cards + "</div>") +
    (totalStories > 0 ? '<p class="quiet" style="margin-top:18px">' + totalStories + (totalStories === 1 ? " story" : " stories") + " across " + CHARACTERS.length + " creations.</p>" : "") +
    "</div></section>";
}

/* "1.2M" -> 1200000, so the compact counts sort the way the app sorts them. */
function countValue(text) {
  const match = /^\s*([\d.]+)\s*([KMB])?\s*$/i.exec(String(text || ""));
  if (!match) return 0;
  const factor = { k: 1e3, m: 1e6, b: 1e9 }[(match[2] || "").toLowerCase()] || 1;
  return parseFloat(match[1]) * factor;
}
/* A leading # searches hashtags and nothing else (parseSearchTerm); anything
   else searches titles, taglines, tags, hashtags and creators alike. */
function parseFeedSearch(raw) {
  const value = String(raw || "").trim();
  const hash = value.match(/^#(.*)$/);
  if (hash) return { search: "", hashtag: hash[1].trim().toLowerCase() };
  return { search: value.toLowerCase(), hashtag: "" };
}
function feedIsFiltered() {
  const parsed = parseFeedSearch(state.feedSearch);
  return !!(parsed.search || parsed.hashtag || state.feedTypes.length);
}
function feedActiveCount() {
  return state.feedTypes.length + (state.feedAdult ? 1 : 0);
}
function feedItems() {
  let items = CHARACTERS.slice();
  const parsed = parseFeedSearch(state.feedSearch);
  if (parsed.hashtag) {
    items = items.filter((c) => (c.hashtags || []).some((tag) => tag.toLowerCase().includes(parsed.hashtag)));
  } else if (parsed.search) {
    const q = parsed.search;
    items = items.filter((c) =>
      creationTitle(c).toLowerCase().includes(q) ||
      String(c.tagline).toLowerCase().includes(q) ||
      String(c.creator).toLowerCase().includes(q) ||
      c.tags.some((tag) => tag.toLowerCase().includes(q)) ||
      (c.hashtags || []).some((tag) => tag.toLowerCase().includes(q)));
  }
  if (state.feedTypes.length) items = items.filter((c) => state.feedTypes.includes(c.kind || "character"));
  if (state.feedSort === "popular") items.sort((a, b) => countValue(b.saves) - countValue(a.saves));
  else if (state.feedSort === "chatted") items.sort((a, b) => countValue(b.messagesExchanged) - countValue(a.messagesExchanged));
  else if (state.feedSort === "new") items.sort((a, b) => new Date(b.created) - new Date(a.created));
  else if (state.feedSort === "following") {
    const followed = items.filter((c) => state.following[c.creator]);
    followed.sort((a, b) => new Date(b.created) - new Date(a.created));
    return followed;
  }
  return items;
}

/* src/app/characters/[id]/profile.tsx — signed-in variant: hero over the art,
   a sticky section nav, the card column with the creator in a rail on wide
   screens, and the two-action bar on phones. */
function inlineTitle(value, limit) {
  const compact = String(value || "").replace(/\s+/g, " ").trim();
  const max = limit || 32;
  if (compact.length <= max) return compact;
  return Array.from(compact).slice(0, Math.max(1, max - 1)).join("").trimEnd() + "\u2026";
}
/* profile.tsx's own relative(): today / yesterday / stepwise from there. */
function createdAgo(value) {
  const days = Math.floor((Date.now() - new Date(value).getTime()) / 86400000);
  if (Number.isNaN(days) || days < 1) return "today";
  if (days === 1) return "yesterday";
  if (days < 30) return days + " days ago";
  const months = Math.floor(days / 30);
  if (months < 12) return months + " month" + (months === 1 ? "" : "s") + " ago";
  const years = Math.floor(months / 12);
  return years + " year" + (years === 1 ? "" : "s") + " ago";
}

  return '<main class="s-page" style="' + accentVariables(char.accent) + '">' +

function afterProfileRender() {
  const scroller = document.querySelector(".s-page");
  if (!scroller) return;
  const post = scroller.querySelector('[data-act="comment-post"]');
  if (post) post.disabled = !(state.profileDraft || "").trim();
  if (typeof IntersectionObserver === "undefined") return;
  const nav = scroller.querySelector(".s-sectionNav");
  if (!nav) return;
  /* Which section owns the middle of the screen decides the lit pill — the
     source's rootMargin, over this page's own scroll box. */
  const observer = new IntersectionObserver((entries) => {
    const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (!visible) return;
    state.profileSection = visible.target.id;
    nav.querySelectorAll("button").forEach((button) => {
      button.classList.toggle("s-navActive", button.dataset.id === visible.target.id);
    });
  }, { root: scroller, rootMargin: "-20% 0px -60%", threshold: [0, 0.25, 0.6] });
  ["overview", "tags", "creator", "comments"].forEach((id) => {
    const node = scroller.querySelector("#" + id);
    if (node) observer.observe(node);
  });
}

  /* ================================================================
     6. SHEETS AND DRAWERS
     One dialog surface (the app's own Sheet) for the memory library,
     the context inspector, memory feedback, the page sheet and the
     settings; the app's right-hand drawer for Story control and the
     persona picker.
     ================================================================ */
  let sheetTrigger = null;   // whatever opened the sheet, for focus restore

  function openSheet(sheet) {
    sheetTrigger = document.activeElement;
    state.sheet = sheet;
    renderSheet();
    const panel = document.querySelector("#sheet-root [role='dialog']");
    if (panel) {
      const first = panel.querySelector("input, textarea, select, button, [tabindex]");
      if (first) setTimeout(() => first.focus(), 40);
    }
  }
  function closeSheet() {
    state.sheet = null;
    state.editingMemId = null;
    state.memDraft = null;
    state.confirmingRemoveId = null;
    state.addingMemory = false;
    renderSheet();
    if (sheetTrigger && document.contains(sheetTrigger)) sheetTrigger.focus();
    sheetTrigger = null;
  }

  function renderSheet() {
    const root = el("sheet-root");
    if (!state.sheet) { root.innerHTML = ""; return; }
    const sheet = state.sheet;
    const char = character();
    if (sheet.type === "story" || sheet.type === "persona") {
      root.innerHTML = drawerHTML(sheet, char);
      return;
    }
    let eyebrow = "", title = "", body = "", footer = "", full = false;
    if (sheet.type === "memories") {
      eyebrow = "What this story remembers"; title = char.name + "'s memories";
      body = memoryLibraryBody(char); full = true;
      const active = char.memories.filter((m) => m.status !== "superseded").length;
      footer = '<span class="fieldHint">' + active + (active === 1 ? " memory" : " memories") + "</span>" +
        '<button class="button uiPrimary" data-act="mem-add-toggle">' + ic("plus", 15) + (state.addingMemory ? "Cancel" : "Add a memory") + "</button>";
    } else if (sheet.type === "context") {
      eyebrow = "This reply"; title = "What she was working from";
      body = contextInspectorBody(char, sheet.messageId); full = true;
    } else if (sheet.type === "feedback") {
      eyebrow = "This reply"; title = "What went wrong?";
      body = feedbackBody(sheet.messageId);
      footer = '<button class="button" data-act="sheet-close">Cancel</button>' +
        '<button class="button uiPrimary" data-act="feedback-send"' + (state.feedbackDraft && state.feedbackDraft.category ? "" : " disabled") + ">Send</button>";
    } else if (sheet.type === "settings") {
      eyebrow = "Account"; title = "Settings";
      body = settingsBody();
      footer = '<button class="button" data-act="sign-out">' + ic("logOut", 15) + "Sign out</button>";
    }
    root.innerHTML =
      '<div class="sheetBackdrop" data-act="sheet-backdrop"></div>' +
      '<div class="' + (full ? "sheet sheetFull" : "sheet") + '" role="dialog" aria-modal="true" aria-label="' + h(title) + '">' +
        '<header class="sheetHeader"><div><span class="pageEyebrow">' + h(eyebrow) + "</span><h2>" + h(title) + "</h2></div>" +
          '<button class="icon-button" data-act="sheet-close" aria-label="Close">' + ic("x", 18) + "</button></header>" +
        '<div class="sheetBody">' + body + "</div>" +
        (footer ? '<footer class="sheetFooter">' + footer + "</footer>" : "") +

  /* ------------------------------ 6a. drawer shell ------------------------- */
  function drawerHTML(sheet, char) {

  function choiceRow(iconName, label, value, act, extra) {

  /* Story control center — the app's ConversationDrawer, simplified to what a

  /* -------------------------- 6b. memory library --------------------------- */
  const KIND_CLASS = {
    identity: "kindIdentity", relationship: "kindRelationship", event: "kindEvent",
    promise: "kindPromise", preference: "kindPreference", boundary: "kindBoundary",
    open_loop: "kindOpenLoop"
  };
  const KIND_OPTIONS = ["identity", "relationship", "event", "promise", "preference", "boundary", "open_loop"];
  const kindLabel = (kind) => KIND_LABELS[kind] || kind.replace("_", " ");

  function memoryLibraryBody(char) {
    const memories = char.memories;
    const draft = state.memDraft || { content: "", kind: "event", status: "active", keywords: "" };
    const kindSelect = (value, attrs) =>
      '<label class="choice-field compact"><span class="field-label">Kind</span><select class="select"' + attrs + ">" +

    let out = '<p class="memoryIntro">' + ic("brain", 15) +

            '<option value="chat"' + (draft.scope !== "creation" ? " selected" : "") + ">This story only</option>" +

    out += '<div class="memoryListHead"><h3>' + ic("sparkles", 15) + "Memories</h3>" +
      '<label class="memoryToggle"><input type="checkbox" data-memtoggle="removed"' + (state.showRemoved ? " checked" : "") + " />Show removed</label></div>";

    const visible = memories.filter((m) => state.showRemoved || m.status !== "superseded");
    if (!visible.length) out += '<p class="fieldHint">Nothing yet. Memories are written as the story goes; you can also add one yourself.</p>';

    out += "<ul class=\"memoryList\">" + visible.map((memory) => {
      const removed = memory.status === "superseded";
      const editing = state.editingMemId === memory.id;
      const confirming = state.confirmingRemoveId === memory.id;
      const itemClass = ["memoryItem", KIND_CLASS[memory.kind] || "", removed ? "memoryItemRemoved" : "", memory.pinned && !removed ? "memoryItemPinned" : ""].filter(Boolean).join(" ");
      let item = '<li class="' + itemClass + '" data-mem="' + memory.id + '">';
      item += '<div class="memoryMeta"><span class="memoryKind">' + h(kindLabel(memory.kind)) + "</span>" +
        (memory.pinned && !removed ? '<span class="memoryPinned">' + ic("pin", 11) + "Pinned</span>" : "") +
        (memory.status === "resolved" ? "<span>Resolved</span>" : "") +
        (removed ? "<span>Removed</span>" : "") +
        '<span class="memoryScope">' + (memory.scope === "chat" ? "This story" : "Every story") + "</span></div>";
      if (editing && state.memDraft) {

        if (!removed) {

                '<button data-act="mem-remove-cancel">' + ic("x", 13) + "Keep</button>"
              : '<button class="memoryDanger" data-act="mem-remove" data-mem="' + memory.id + '">' + ic("trash", 13) + "Remove</button>") +
            "</div>";
          if (confirming) item += '<p class="fieldHint">She stops recalling this from now on. Replies that already used it keep saying so.</p>';
        }
      }
      return item + "</li>";
    }).join("") + "</ul>";

    if (char.chapters.length) {
      out += '<section class="memoryDerived"><h3>' + ic("scroll", 15) + "Chapters</h3>" +
        '<p class="fieldHint">Longer stretches of the story, kept for when something from far back becomes relevant again.</p><ul>' +
        char.chapters.map((arc) => "<li><b>" + arc.start + "\u2013" + arc.end + "</b>" + h(arc.summary) + "</li>").join("") +
        "</ul></section>";
    }
    return out;
  }

  /* -------------------------- 6c. context inspector ------------------------ */
  function contextInspectorBody(char, messageId) {
    const story = currentStory();
    const message = story.messages.find((m) => m.id === messageId);
    if (!message) return '<p class="fieldHint">That reply is no longer here.</p>';
    const ids = message.memoryIds || [];
    const arcs = message.arcIds || [];
    const recalled = ids.map((id) => char.memories.find((m) => m.id === id)).filter(Boolean);
    const chapters = arcs.map((id) => char.chapters.find((a) => a.id === id)).filter(Boolean);
    const turns = story.messages.slice(-4);
    const tokens = Math.max(120, Math.round(story.messages.reduce((n, m) => n + m.content.length, 0) / 4));
    const summaryWords = Math.round(char.summary.split(/\s+/).length);

    let out = '<p class="memoryIntro">' + ic("brain", 15) +
      "Every reply is written from the creation's own profile plus the story context below. This is what was carried into this one.</p>";

    out += '<section class="memoryDerived"><h3>' + ic("messages", 14) + "Recent conversation</h3>" +
      '<p class="fieldHint">' + story.messages.length + (story.messages.length === 1 ? " message" : " messages") +
      " of this story were visible, about " + tokens.toLocaleString() + " tokens.</p>" +
      '<ul class="contextTurns">' + turns.map((turn) =>
        "<li><b>" + (turn.role === "user" ? "You" : "Reply") + "</b><span>" +
        h(turn.content.length > 220 ? turn.content.slice(0, 220).trimEnd() + "\u2026" : turn.content) + "</span></li>"
      ).join("") + "</ul></section>";

    out += '<section class="memoryDerived"><h3>' + ic("scroll", 14) + "Story so far</h3>" +
      '<p class="fieldHint">A rolling summary of about ' + summaryWords + " words was included. It is rewritten as the story advances, so the version you can read today is not word-for-word the one this reply saw; open Memories for the current text.</p></section>";

    out += '<section class="memoryDerived"><h3>' + ic("clock", 14) + "Where and when</h3>" +
      '<p class="memoryText">' + h(sceneLine(char.scene)) + "</p>" +
      '<p class="fieldHint">Present: ' + h(char.scene.present.join(", ")) + "</p></section>";

    if (char.coreCanon.length) {
      out += '<section class="memoryDerived"><h3>' + ic("bookMarked", 14) + "Core canon</h3><ul>" +
        char.coreCanon.map((entry) => "<li><b>" + h(entry.category.replace("_", " ")) + "</b>" + h(entry.content) + "</li>").join("") +
        "</ul></section>";
    }

    out += '<section class="memoryDerived"><h3>' + ic("brain", 14) + "Memories recalled</h3>" +
      (recalled.length === 0
        ? '<p class="fieldHint">Nothing was drawn from the permanent archive for this reply \u2014 the recent conversation carried it.</p>'
        : "<ul>" + recalled.map((m) =>
            "<li><b>" + h(kindLabel(m.kind)) + "</b>" + h(m.content) +
            (m.resolution ? " (Resolved: " + h(m.resolution) + ")" : "") +
            (m.status === "superseded" ? ' <em class="contextStateNote">removed since \u2014 shown as it was</em>' : "") +
            "</li>"
          ).join("") + "</ul>") +
      "</section>";

    if (chapters.length) {
      out += '<section class="memoryDerived"><h3>' + ic("scroll", 14) + "Chapters recalled</h3><ul>" +
        chapters.map((a) => "<li><b>" + a.start + "\u2013" + a.end + "</b>" + h(a.summary) + "</li>").join("") +
        "</ul></section>";
    }
    return out;
  }

  /* --------------------------- 6d. memory feedback ------------------------- */
  const FB_OPTIONS = [
    ["forgot_something", "She forgot something", "Something we established never came up, or was treated as new."],
    ["contradicted_itself", "It contradicted itself", "Two things that cannot both be true."],
    ["brought_back_finished", "It brought back something finished", "A promise already kept, or a thread already closed."],
    ["wrong_place_or_time", "Wrong place or time", "It behaved as if we were somewhere else, or on another day."],
    ["confused_who_is_present", "Confused who was there", "Somebody spoke or acted who is not in the scene."],
    ["other", "Something else", "Tell us in your own words."]
  ];
  function feedbackBody(messageId) {
    const draft = state.feedbackDraft || { messageId, category: null, note: "" };
    return '<p class="fieldHint">This helps the character remember better. We record which reply you flagged and what the memory system had retrieved for it \u2014 never the words of your story.</p>' +
      '<div class="stack">' + FB_OPTIONS.map(([id, label, hint]) =>
        '<label class="toggleRow" data-active="' + (draft.category === id) + '"><span><strong>' + h(label) + "</strong><small>" + h(hint) + "</small></span>" +
        '<input type="radio" name="memory-feedback" data-fb="' + id + '"' + (draft.category === id ? " checked" : "") + " /></label>"
      ).join("") +
      '<div class="field"><label class="fieldLabel" for="feedback-note">Anything else? (optional)</label>' +
      '<textarea id="feedback-note" class="textarea" rows="3" maxlength="2000" data-fbnote placeholder="What should she have remembered?">' + h(draft.note) + "</textarea></div></div>";
  }

  /* ---------------------------- 6f. settings sheet ------------------------- */
  function settingsBody() {
    const persona = activePersona(currentStory());
    return '<p class="memoryIntro">' + ic("settings", 15) +
      "This replica keeps everything in the page: nothing you type is sent anywhere, and reloading starts the stories over.</p>" +
      '<div class="stack">' +
        '<div class="toggleRow" data-active="' + (state.notifOn !== false) + '"><span><strong>Desktop-style notices</strong><small>A quiet toast when a reply finishes or a memory changes.</small></span>' +
        '<input type="checkbox" data-setting="notifOn"' + (state.notifOn !== false ? " checked" : "") + " /></div>" +
      "</div>" +
      '<div class="stack">' +
        choiceRow("users", "Active persona", persona.name, "persona-picker") +
        choiceRow("sparkles", "Engine", ENGINE_LABEL, "tool", ' data-tool="engine"') +
        choiceRow("globe", "Storage", "This page only", "tool", ' data-tool="storage"') +
      "</div>";
  }

  /* ================================================================
     7. CHAT BEHAVIOUR — send · typing · streaming · edits · stories
     ================================================================ */
  let uidCounter = 0;
  function uid() { uidCounter += 1; return "n" + Date.now().toString(36) + uidCounter; }

  function notice(text) {
    if (state.notifOn === false) return;
    const root = el("notice-root");
    const node = document.createElement("div");
    node.className = "demo-toast";
    node.setAttribute("role", "status");
    node.innerHTML = "<span>" + h(text) + '</span><button data-act="notice-close" aria-label="Dismiss">' + ic("x", 13) + "</button>";
    root.appendChild(node);
    setTimeout(() => { if (node.parentNode) node.remove(); }, 3600);
  }

  function nextReply(char) {
    const index = state.replyCursor[char.id] || 0;
    state.replyCursor[char.id] = index + 1;
    return char.replies[index % char.replies.length];
  }

  function sendMessage() {
    const char = character();
    const story = currentStory();
    const composer = el("composer");
    if (!story || !composer || state.streaming) return;
    const text = composer.value.trim();
    if (!text) return;
    story.messages.push({ id: uid(), role: "user", content: text, at: new Date().toISOString() });
    story.msgCount += 1;
    story.updated = new Date().toISOString();
    composer.value = "";
    state.draft = "";
    autoGrow(composer);
    render();
    streamNext(story);
  }

  /** The typing beat, then the word-by-word write the app performs. */
  function streamNext(story) {
    const char = character();
    const reply = nextReply(char);
    state.streaming = true;
    const message = { id: uid(), role: "assistant", content: "", at: new Date().toISOString(), memoryIds: [], arcIds: [] };
    story.messages.push(message);
    render();
    setTimeout(() => {
      const words = reply.text.split(" ");
      let count = 0;
      state.streamTimer = setInterval(() => {
        count += 1;
        message.content = words.slice(0, count).join(" ");
        const node = document.querySelector('[data-message="' + message.id + '"] .bubble');
        if (node) node.innerHTML = renderMessage(message.content);
        jumpToLatest();
        if (count >= words.length) {
          clearInterval(state.streamTimer);
          state.streamTimer = null;
          message.memoryIds = reply.uses.slice();
          message.arcIds = reply.arcs.slice();
          story.msgCount += 1;
          story.updated = new Date().toISOString();
          state.streaming = false;
          render();
          flashMemories(reply.uses);
          notice("Reply written from " + reply.uses.length + (reply.uses.length === 1 ? " memory" : " memories"));
        }
      }, 46);
    }, 650);
  }

  function stopStream() {
    if (state.streamTimer) { clearInterval(state.streamTimer); state.streamTimer = null; }
    state.streaming = false;
  }

  /** Which memories the last reply touched, for the library's flash. */
  function flashMemories(ids) {
    if (!ids || !ids.length) return;
    ids.forEach((id) => {
      const node = document.querySelector('[data-mem="' + id + '"]');
      if (node) { node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash"); }
    });
  }

  function regenerate() {
    const story = currentStory();
    if (!story || state.streaming) return;
    const last = story.messages[story.messages.length - 1];
    if (last && last.role === "assistant") {
      story.messages.pop();
      story.msgCount = Math.max(0, story.msgCount - 1);
    }
    streamNext(story);
  }

  function continueThread() {
    const story = currentStory();
    if (!story || state.streaming) return;
    streamNext(story);
  }

  function deleteFrom(messageId) {
    const story = currentStory();
    if (!story) return;
    const index = story.messages.findIndex((m) => m.id === messageId);
    if (index < 0) return;
    if (!window.confirm("Delete this message and every reply after it?")) return;
    story.msgCount = Math.max(0, story.msgCount - (story.messages.length - index));
    story.messages = story.messages.slice(0, index);
    render();
    notice("Message deleted");
  }

  function saveEdit(messageId) {
    const story = currentStory();
    const editor = el("inline-editor");
    if (!story || !editor) return;
    const message = story.messages.find((m) => m.id === messageId);
    if (message) {
      const value = editor.value.trim();
      if (value) message.content = value;
    }
    state.editingMessageId = null;
    renderTranscript();
    notice("Reply edited");
  }

  function loadEarlier() {
    const story = currentStory();
    if (!story || !story.hasEarlier) return;
    story.messages = story.earlier.concat(story.messages);
    story.msgCount += story.earlier.length;
    story.hasEarlier = false;
    render();
  }

  /** A brand-new story with the creation's greeting, as the app starts one. */
  function newConversation(charId, personaId) {
    const char = CHARACTERS.find((c) => c.id === charId);
    if (!char) return;
    const id = char.id + "-" + (char.stories.length + 1) + "-" + Math.random().toString(36).slice(2, 5);
    const now = new Date().toISOString();
    char.stories.unshift({
      id, title: "New story", msgCount: 1, personaId: personaId || null, updated: now,
      hasEarlier: false, earlier: [],
      messages: [{ id: uid(), role: "assistant", content: char.greeting, at: now, memoryIds: [char.memories[0].id], arcIds: [] }]
    });
    stopStream();
    selectChat(char.id, id);
    notice("New story ready");
  }

  /* ================================================================
     8. EVENTS
     ================================================================ */
  /* iOS never focuses plain buttons on tap — remember whether the composer was
     focused at pointerdown, before the tap moves focus onto the button itself. */
  let composerFocusedAtToolsDown = false;
  document.addEventListener("pointerdown", (event) => {
    const t = event.target && event.target.closest && event.target.closest("#tools-btn");
    const c = el("composer");
    composerFocusedAtToolsDown = !!(t && c && document.activeElement === c);
  }, true);
  document.addEventListener("click", (event) => {
    /* the send button carries no data-act; it just sends */
    if (event.target.closest("#send-btn")) { sendMessage(); return; }
    const target = event.target.closest("[data-act]");
    if (!target) return;
    const act = target.dataset.act;
    const char = character();
    const story = currentStory();

    /* The More menu is a popover: any press outside it (or on its own
       trigger) closes it before that press is handled. */
    if (state.profileMoreOpen && !target.closest(".s-menuPanel") && target.dataset.act !== "profile-more") {
      state.profileMoreOpen = false;
      render();
    }

    /* a click that merely STARTED on the backdrop does not close */
    if (act === "sheet-backdrop") {
      if (event.target === target) closeSheet();
      return;
    }

    switch (act) {
      case "go": navigate(target.dataset.hash); break;
      case "menu": toggleMenu(); break;
      case "close-menu": closeMenu(); break;
      case "sheet-close": closeSheet(); break;
      case "notice-close": { const t = target.closest(".demo-toast"); if (t) t.remove(); break; }
      case "sign-out": closeSheet(); notice("This replica has no account \u2014 nothing to sign out of."); break;
      case "settings-sheet": openSheet({ type: "settings" }); break;

      /* chat header */
      case "story-sheet": state.storyChoice = state.storyChoice || (PERSONAS.find((p) => p.isDefault) || PERSONAS[0]).id; openSheet({ type: "story" }); break;
      case "memory-sheet": openSheet({ type: "memories" }); break;

      /* composer */
      case "tools": {
        state.toolsOpen = !state.toolsOpen;
        render();
        /* The real app never focuses the composer on toggle — React keeps the
           same DOM node, so an already-focused field simply stays focused. */
        const composer = el("composer");
        if (composer && composerFocusedAtToolsDown) { composer.focus(); composer.selectionStart = composer.value.length; }
        break;
      }
      case "tool": {
        const tool = target.dataset.tool;
        if (tool === "persona") openSheet({ type: "persona" });
        else if (tool === "memories") openSheet({ type: "memories" });
        /* Worlds, Instructions, Engine and Storage are intentionally inert.
           They used to open a "left out of this replica" sheet; the press
           feedback stays, the overlay does not. */
        break;
      }
      case "jump": jumpToLatest(); break;
      /* The persona cards' New/Edit actions are intentionally inert — same
         rule as the story drawer's tool rows: press feedback, no overlay. */
      case "placeholder-sheet": break;

      /* messages */
      case "msg-edit": state.editingMessageId = target.dataset.id; renderTranscript(); break;
      case "msg-edit-cancel": state.editingMessageId = null; renderTranscript(); break;
      case "msg-edit-save": saveEdit(target.dataset.id); break;
      case "msg-delete": deleteFrom(target.dataset.id); break;
      case "msg-context": openSheet({ type: "context", messageId: target.dataset.id }); break;
      case "msg-feedback":
        state.feedbackDraft = { messageId: target.dataset.id, category: null, note: "" };
        openSheet({ type: "feedback", messageId: target.dataset.id });
        break;
      case "msg-regenerate": regenerate(); break;
      case "msg-continue": continueThread(); break;
      case "load-earlier": loadEarlier(); break;

      /* chats view */
      case "open-chat": {
        const charId = target.dataset.char;
        const convId = target.dataset.conv;
        if (convId) { stopStream(); selectChat(charId, convId); }
        else newConversation(charId, null);
        break;
      }
      case "expand": state.expanded[target.dataset.char] = !state.expanded[target.dataset.char]; render(); break;

      /* saved library */
      case "tab": state.libraryTab = target.dataset.tab; render(); break;
      case "toggle-save": {
        const id = target.dataset.char;
        SAVES[id] = !SAVES[id];
        render();
        notice(SAVES[id] ? "Saved to your library" : "Removed from your library");
        break;
      }

      /* discovery */
      case "feed-sort": state.feedSort = target.dataset.sort; render(); break;
      case "feed-search-clear": {
        state.feedSearch = "";
        render();
        const box = el("feed-search");
        if (box) box.focus();
        break;
      }
      case "feed-filters":
        state.filterDraft = { types: state.feedTypes.slice(), includeAdult: state.feedAdult };
        state.filterOpen = true;
        state.filterReady = false;
        render();
        break;
      case "feed-filter-close":
        /* A click that merely STARTED on the backdrop does not close. */
        if (target.classList.contains("f-sheetBackdrop") && event.target !== target) break;
        state.filterOpen = false;
        state.filterDraft = null;
        render();
        break;
      case "feed-filter-reset": state.filterDraft = { types: [], includeAdult: false }; render(); break;
      case "feed-filter-apply": {
        const draft = state.filterDraft;
        if (draft) { state.feedTypes = draft.types.slice(); state.feedAdult = draft.includeAdult; }
        state.filterOpen = false;
        state.filterDraft = null;
        render();
        break;
      }
      case "feed-chip": {
        const type = target.dataset.type;
        const draft = state.filterDraft;
        if (draft) draft.types = draft.types.includes(type) ? draft.types.filter((t) => t !== type) : draft.types.concat(type);
        render();
        break;
      }
      case "feed-chip-off": state.feedTypes = state.feedTypes.filter((t) => t !== target.dataset.type); render(); break;
      case "feed-adult-off": state.feedAdult = false; render(); break;
      case "feed-clear-filters":
        state.feedSearch = "";
        state.feedTypes = [];
        state.feedAdult = false;
        render();
        break;
      case "feed-browse": state.feedSort = "popular"; render(); break;
      case "feed-hashtag": {
        state.feedSearch = "#" + target.dataset.tag;
        /* The anchor carries the navigation; only a same-hash press needs the
           render itself. */
        if (location.hash === "#/discover") render();
        break;
      }

      /* character page */
      case "profile-back": navigate(state.profileBack || "#/discover"); break;
      case "profile-cta": {
        const pchar = CHARACTERS.find((c) => c.id === state.profileId);
        if (!pchar) break;
        const latestStory = pchar.stories.slice().sort((a, b) => new Date(b.updated) - new Date(a.updated))[0];
        selectChat(pchar.id, latestStory ? latestStory.id : null);
        break;
      }
      case "profile-share": copyProfileLink("Creation link copied."); break;
      case "profile-more": state.profileMoreOpen = !state.profileMoreOpen; render(); break;
      case "profile-copy-link":
        state.profileMoreOpen = false;
        copyProfileLink("Link copied.");
        render();
        break;
      case "profile-report":
        state.profileMoreOpen = false;
        state.reportOpen = true;
        state.reportSent = false;
        render();
        break;
      case "profile-notice-dismiss": state.profileNotice = null; render(); break;
      case "report-backdrop":
        if (event.target === target) { state.reportOpen = false; render(); }
        break;
      case "report-close": state.reportOpen = false; render(); break;
      case "report-submit": state.reportSent = true; render(); break;
      case "profile-follow": {
        const creator = target.dataset.creator;
        if (state.following[creator]) delete state.following[creator];
        else state.following[creator] = true;
        render();
        break;
      }
      case "profile-overview": state.profileOverviewOpen = !state.profileOverviewOpen; render(); break;
      case "profile-section": illuminateSection(target.dataset.id); break;
      case "comment-post": {
        const body = (state.profileDraft || "").trim();
        if (!body) break;
        const list = state.profileComments[state.profileId] || (state.profileComments[state.profileId] = []);
        list.unshift({ id: uid(), body: body, at: new Date().toISOString() });
        state.profileDraft = "";
        render();
        break;
      }

      /* story drawer */
      case "story-open": stopStream(); selectChat(char.id, target.dataset.conv); break;
      case "story-persona": state.storyChoice = target.dataset.persona; renderSheet(); break;
      case "story-start": {
        const choice = state.storyChoice || null;
        closeSheet();
        newConversation(char.id, choice);
        break;
      }
      case "story-rename": {
        const item = char.stories.find((s) => s.id === target.dataset.conv);
        if (!item) break;
        const title = window.prompt("Conversation title", item.title);
        if (title && title.trim() && title.trim() !== item.title) { item.title = title.trim(); renderSheet(); if (state.view === "chat") render(); notice("Story renamed"); }
        break;
      }
      case "story-delete": {
        const index = char.stories.findIndex((s) => s.id === target.dataset.conv);
        if (index < 0) break;
        const item = char.stories[index];
        if (char.stories.length === 1) { notice("A creation keeps at least one story"); break; }
        if (!window.confirm('Delete \u201c' + item.title + '\u201d and its chat-specific memories? All-chats journal entries will remain.')) break;
        char.stories.splice(index, 1);
        if (story && story.id === item.id) { stopStream(); selectChat(char.id, char.stories[0].id); }
        else { renderSheet(); if (state.view === "chat") render(); }
        notice("Story deleted");
        break;
      }

      /* persona picker */
      case "persona-picker": state.personaPending = activePersona(story).id; openSheet({ type: "persona" }); break;
      case "persona-pending": state.personaPending = target.dataset.persona; renderSheet(); break;
      case "persona-use": {
        const pending = state.personaPending;
        if (story && pending) story.personaId = pending;
        closeSheet();
        render();
        notice("Playing as " + personaName(pending));
        break;
      }

      /* memory library */
      case "mem-add-toggle": state.addingMemory = !state.addingMemory; state.memDraft = { content: "", kind: "event", status: "active", keywords: "", scope: "chat" }; renderSheet(); break;
      case "mem-add-cancel": state.addingMemory = false; state.memDraft = null; renderSheet(); break;
      case "mem-add-submit": {
        const draft = state.memDraft;
        if (!draft || !draft.content.trim()) break;
        char.memories.unshift({
          id: "u" + Math.random().toString(36).slice(2, 8),
          kind: draft.kind, content: draft.content.trim(),
          keywords: draft.keywords.split(",").map((v) => v.trim()).filter(Boolean).slice(0, 12),
          importance: 4, pinned: true, status: "active", scope: draft.scope === "creation" ? "every" : "chat"
        });
        state.addingMemory = false; state.memDraft = null;
        renderSheet(); render();
        notice("Memory added \u2014 she will carry it into the next reply");
        break;
      }
      case "mem-edit": {
        const memory = char.memories.find((m) => m.id === target.dataset.mem);
        if (!memory) break;
        state.editingMemId = memory.id;
        state.confirmingRemoveId = null;
        state.memDraft = { content: memory.content, kind: memory.kind, status: memory.status, keywords: (memory.keywords || []).join(", ") };
        renderSheet();
        break;
      }
      case "mem-edit-cancel": state.editingMemId = null; state.memDraft = null; renderSheet(); break;
      case "mem-edit-save": {
        const memory = char.memories.find((m) => m.id === state.editingMemId);
        if (memory && state.memDraft && state.memDraft.content.trim()) {
          memory.content = state.memDraft.content.trim();
          memory.kind = state.memDraft.kind;
          if (memory.kind === "promise" || memory.kind === "open_loop") memory.status = state.memDraft.status;
          notice("Memory updated \u2014 future replies will use the correction");
        }
        state.editingMemId = null; state.memDraft = null;
        renderSheet(); render();
        break;
      }
      case "mem-pin": {
        const memory = char.memories.find((m) => m.id === target.dataset.mem);
        if (memory) { memory.pinned = !memory.pinned; renderSheet(); }
        break;
      }
      case "mem-remove": state.confirmingRemoveId = target.dataset.mem; renderSheet(); break;
      case "mem-remove-cancel": state.confirmingRemoveId = null; renderSheet(); break;
      case "mem-remove-confirm": {
        const memory = char.memories.find((m) => m.id === target.dataset.mem);
        if (memory) memory.status = "superseded";
        state.confirmingRemoveId = null;
        renderSheet(); render();
        notice("She stops recalling that from now on");
        break;
      }

      /* feedback */
      case "feedback-send": {
        const draft = state.feedbackDraft;
        if (!draft || !draft.category) break;
        if (story) {
          const message = story.messages.find((m) => m.id === draft.messageId);
          if (message) message.feedbackSent = true;
        }
        closeSheet();
        render();
        notice("Thanks \u2014 noted");
        break;
      }
    }
  });

  /* inputs: composer draft, search, memory drafts, feedback, settings */
  document.addEventListener("input", (event) => {
    const target = event.target;
    if (target.id === "composer") {
      state.draft = target.value;
      onComposerInput(event);
      return;
    }
    if (target.id === "chat-search") {
      state.chatSearch = target.value;
      const caret = target.selectionStart;
      render();
      const box = el("chat-search");
      if (box) { box.focus(); try { box.setSelectionRange(caret, caret); } catch (_) {} }
      return;
    }
    if (target.id === "feed-search") {
      state.feedSearch = target.value;
      const caret = target.selectionStart;
      render();
      const box = el("feed-search");
      if (box) { box.focus(); try { box.setSelectionRange(caret, caret); } catch (_) {} }
      return;
    }
    if (target.id === "comment-draft") {
      state.profileDraft = target.value;
      /* The field keeps its own caret: only the Post button's state changes. */
      const post = document.querySelector('[data-act="comment-post"]');
      if (post) post.disabled = !state.profileDraft.trim();
      return;
    }
    if (target.id === "report-details") { state.reportDetails = target.value; return; }
    const field = target.dataset.memfield;
    if (field && state.memDraft) {
      state.memDraft[field.replace("new-", "").replace("edit-", "")] = target.value;
      const save = document.querySelector('[data-act="mem-edit-save"], [data-act="mem-add-submit"]');
      if (save) save.disabled = !state.memDraft.content.trim();
      return;
    }
    if (target.hasAttribute("data-fbnote") && state.feedbackDraft) state.feedbackDraft.note = target.value;
  });

  document.addEventListener("change", (event) => {
    const target = event.target;
    if (target.id === "feed-adult") {
      if (state.filterDraft) state.filterDraft.includeAdult = target.checked;
      render();
      return;
    }
    if (target.name === "report-reason") { state.reportReason = target.value; render(); return; }
    if (target.hasAttribute("data-memtoggle")) { state.showRemoved = target.checked; renderSheet(); return; }
    if (target.hasAttribute("data-setting")) { state[target.dataset.setting] = target.checked; notice(target.checked ? "Notices on" : "Notices off"); return; }
    if (target.name === "memory-feedback" && state.feedbackDraft) {
      state.feedbackDraft.category = target.dataset.fb;
      renderSheet();
      return;
    }
    const field = target.dataset.memfield;
    if (field && state.memDraft) {
      state.memDraft[field.replace("new-", "").replace("edit-", "")] = target.value;
      return;
    }
    if (target.dataset.storySelect === "Response length") state.storyLength = target.value;
    if (target.dataset.storySelect === "Creativity") state.storyHeat = target.value;
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      /* Innermost overlay first: the report dialog, then the filter sheet,
         then the More menu, then the app's own sheet. */
      if (state.reportOpen) { state.reportOpen = false; render(); return; }
      if (state.filterOpen) { state.filterOpen = false; state.filterDraft = null; render(); return; }
      if (state.profileMoreOpen) { state.profileMoreOpen = false; render(); return; }
      if (state.sheet) { closeSheet(); return; }
      if (state.editingMessageId) { state.editingMessageId = null; renderTranscript(); return; }
      if (state.sidebarOpen) closeMenu();
    }
    if (event.key === "Enter" && (event.metaKey || event.ctrlKey) && state.editingMessageId) {
      event.preventDefault();
      saveEdit(state.editingMessageId);
    }
  });

  /* stop a running stream when the story or view changes */
  window.addEventListener("hashchange", stopStream);

  /* ================================================================
     9. BOOT
     ================================================================ */
  state.draft = "";
  if (!location.hash) { try { history.replaceState(null, "", "#/discover"); } catch (_) { location.hash = "#/discover"; } }
  applyRoute();
  render();

</script>
</body>
</html>
