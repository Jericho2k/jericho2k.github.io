*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-sans),sans-serif}
/* The app shell is a fixed-height application surface, not a document. Without this the
   document around it still scrolls and rubber-bands, which is what revealed a band of
   bare background above and below the app. Scoped by a class the shell adds on mount, so
   the standalone creation, creator and world pages keep scrolling normally. */
html.shell-locked,html.shell-locked body{height:100%;max-height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
html.shell-locked body{position:relative} button,input,textarea,select{font:inherit} button{color:inherit} button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
body{background:radial-gradient(circle at 70% 0%,rgba(123,50,80,.16),transparent 32%),#100d11}/* THE CHAT WAS SLIGHTLY WIDER THAN THE PHONE.
   A `1fr` grid track has an automatic minimum of min-content, so any descendant
   that cannot shrink — a long unbroken word, a fixed-width control, a wide
   table — pushes the track past the viewport. `.app-shell` then clips it with
   `overflow:hidden`, and because a grid starts at its left edge the left side
   looks perfect while the right is cut off. That is the reported symptom
   exactly, and `overflow-x:hidden` on the body would have hidden it rather than
   fixed it. `minmax(0,1fr)` removes the min-content floor, so the track is the
   viewport and the content inside it is what has to fit. */

acter-copy small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status-dot{width:5px;height:5px;border-radius:50%;box-shadow:0 0 10px currentColor}.avatar{--accent:#e879a9;flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 36%,#352833),#181319);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:inset 0 0 18px rgba(255,255,255,.05);overflow:hidden}.avatar span{font-family:var(--font-serif);font-size:15px}.avatar img{width:100%;height:100%;object-fit:cover}.avatar.large{width:52px;height:52px}.avatar.large span{font-size:20px}.sidebar-footer{margin-top:auto;display:flex;align-items:center;gap:7px;border-top:1px solid var(--line);padding:15px 2px 0}.text-button{border:0;background:none;color:var(--faint);font-size:10px;padding:12px 0 0 23px;cursor:pointer}.text-button:hover{color:var(--ink)}

/* `clip`, not `hidden`, and the difference is load-bearing.

   every `position:sticky` descendant stops sticking to the viewport and starts
   sticking inside the body's scrollport — which is why the creation page's
   section navigation, sticky since the day it was written, scrolled away on

/* Administrator-only Scene State diagnostics. Never rendered for a reader. */
.scene-state-block {
  margin: 0.35rem 0 0.5rem;
  white-space: pre-wrap;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.76rem;
  line-height: 1.5;
  opacity: 0.92;
}

/*
 * Administrator-only background model selector.
 *
 * One block per background job, each with its two scopes and a line saying
 * which layer actually decided. Never rendered for a reader: which model
 * maintains continuity is an operator's question, and the panel that answers it
 * sits behind the same boundary as the Scene Ledger diagnostics above.
 */
.background-route {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  padding: 0.5rem 0;
  border-top: 1px solid var(--line);
}
.background-route:first-of-type { border-top: 0; }
.background-route strong { font-size: 0.72rem; letter-spacing: 0.02em; }
.background-route small { color: var(--faint); font-size: 0.66rem; line-height: 1.5; }
.error-text { color: var(--rose2); font-size: 0.68rem; }

/*
 * The one line an operator has to see.
 *
 * Loud on purpose and rare on purpose: it appears when memory extraction has
 * failed repeatedly or has stopped advancing while the story keeps growing —
 * the state in which a reader chats normally and quietly ends up with no
 * memories at all. A warning that is always on screen is a warning nobody
 * reads, so `memoryWarning` returns null for every healthy story.
 */
.background-warning {
  margin: 0 0 0.5rem;
  padding: 0.5rem 0.6rem;
  border: 1px solid var(--rose2);
  border-radius: 8px;
  background: rgba(232, 121, 169, 0.08);
  color: var(--rose2);
  font-size: 0.7rem;
  line-height: 1.5;
}

/*
 * The chat header's menu control.
 *
 * The header is the one surface still built from this stylesheet, so the
 * shared rounded-square button is placed rather than restyled here: the
 * geometry, the hover and the focus ring all come from
 * src/components/ui/ui.module.css, and this rule only decides when the control
 * is on screen. It replaces `.mobile-menu`, a bare ☰ glyph with no border,
 * background or hit area, and `.global-mobile-menu`, which floated over the
 * page and — having been declared only inside two media queries — rendered
 * inline in normal flow on every screen wider than 760px.
 */
.chat-menu-button{display:inline-grid;margin-right:4px;flex:0 0 auto}

/* A LONG TITLE WAS STILL DECIDING HOW WIDE THE CHAT IS.
   The previous fix capped the title, and capped it against the VIEWPORT:
   `max-width:min(52vw,520px)`, and `min(60vw,320px)` on a phone. A viewport is
   not the space the title actually has. On a 393px screen the header spends its
   width on 14+12px of padding, a 38px menu button, a 42px avatar, two gaps and
   a 38px action — leaving about 229px for the text, while 60vw allows 236px. So
   a title long enough to reach its cap overflowed by a few pixels, every time,
   and `.app-shell{overflow:hidden}` clipped the result: the left edge looked
   perfect and the right was cut off. That is exactly the report — some chats
   aligned, the ones with long names visibly pushed right — and it is why the
   symptom depended on the title rather than on the device.
   The cap is now the CONTAINER. Every link in the chain from the header to the
   text can shrink (`min-width:0` on a flex item removes its automatic
   min-content floor), the actions never shrink, and the title takes whatever is
   left and ellipsises. Nothing in the header can be wider than the header, so
   nothing in it can be wider than the phone. */
.chat-panel>*{min-width:0}
.chat-header{gap:12px}
.chat-header>.chat-identity{flex:1 1 auto;min-width:0}
.chat-header>.header-actions{flex:0 0 auto}

.identity-profile>.avatar{flex:0 0 auto}
.identity-profile>span{flex:1 1 auto;min-width:0;max-width:100%}
.identity-profile strong{display:block;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conversation-preview{max-width:100%}

/*
 * The shell's own failure and waiting states.

 * Both exist because their absence was a bug rather than a rough edge: a

 * chat's messages. A banner and a skeleton are the honest versions of both.

.chat-panel-loading .chat-header{pointer-events:none}
.skeleton-avatar{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.05);flex:0 0 auto}
.skeleton-identity{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0;max-width:220px}
.skeleton-identity i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.09),rgba(255,255,255,.05));background-size:200% 100%;animation:skeleton-sweep 1.4s ease-in-out infinite}
.skeleton-identity i:nth-child(1){width:56%}
.skeleton-identity i:nth-child(2){width:82%}
.skeleton-composer{min-height:52px;background:rgba(255,255,255,.03)}
@media (prefers-reduced-motion:reduce){
  .skeleton-identity i,.skeleton-message i{animation:none}
}

/*
 * The story world picker.
 *
 * Rows rather than checkboxes: attaching and detaching a world take effect
 * immediately on this story, so each row carries the one action it offers and
 * there is nothing to "save". The copy at the top of the sheet says which of
 * the two world sets is being changed, because confusing a story's canon with
 * a creation's is precisely what this replaced.
 */
.picker-group{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.picker-group>.field-label{margin-bottom:2px}
.picker-quiet{margin:0;color:var(--faint);font-size:9.5px;line-height:1.5}
.picker-error{margin:0 0 12px;color:#ef9bb1;font-size:9.5px}
.picker-search{width:100%;border:1px solid var(--line);border-radius:11px;background:#171318;color:var(--ink);padding:10px 12px;font-family:var(--font-sans);font-size:11px}
.picker-search:focus-visible{outline:2px solid var(--rose2);outline-offset:1px}
.picker-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;background:#1b161c;padding:11px 12px}
.picker-row>span{display:flex;min-width:0;flex-direction:column;gap:3px;flex:1}
.picker-row strong{font-family:var(--font-serif);font-size:15px;line-height:1.25}
.picker-row small{color:var(--muted);font-size:9px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.picker-row>button{flex:0 0 auto;min-height:36px;min-width:74px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.04);color:var(--ink);padding:0 12px;font-family:var(--font-sans);font-size:10px;cursor:pointer}
.picker-row>button:hover:not(:disabled){border-color:rgba(232,121,169,.4);color:var(--rose2)}
.picker-row>button:disabled{opacity:.5;cursor:progress}
.picker-row>button:focus-visible{outline:2px solid var(--rose2);outline-offset:2px}
.picker-footer{display:flex;justify-content:flex-end;gap:9px;border-top:1px solid var(--line);padding:13px 18px}
.picker-footer .primary{min-height:42px}

/* Shared icon behaviour, so a glyph never sets a control's height or drifts
   off the text baseline. */
.icon-button svg,.jump-latest svg,.send-button svg,.composer-plus svg,.sidebar-lock svg,.nav-icon svg,.nav-create svg{flex:none}
.jump-latest,.success-banner,.library-error,.verification-notice,.memory-explainer{display:flex;align-items:center;gap:8px}
.icon-button.labeled svg{flex:none}
/* One rotation for every disclosure chevron in the app. */
.flip{transform:rotate(180deg);transition:transform .18s ease}
.choice-trigger b,.advanced-model-toggle b{display:grid;place-items:center}
/* A spinner, wherever something is being created. */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.flip{transition:none}}

.sidebar-scrim{display:none}
@media(max-width:500px){.sidebar-scrim{display:block}}

/* On a phone the chat tools read as a list rather than a grid: the order in the
   markup is the order on screen, which is what puts Memories immediately above
   Engine, and a full-width row is a better touch target than a quarter tile. */
@media(max-width:560px){.composer-tools{grid-template-columns:1fr;gap:6px;max-height:min(58dvh,420px);overflow-y:auto;overscroll-behavior:contain}.composer-tools>button,.composer-tools>label{min-height:52px;flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap}.composer-tools>button svg{flex:none}.composer-tools strong{font-size:12px}.composer-tools small{margin-left:auto;text-align:right;font-size:10px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52%}}

.sidebar-spacer{flex:1;min-height:12px}

/* The rest of a long story, one tap above the window that was loaded with it. */
.load-earlier{display:flex;justify-content:center;margin:0 0 20px}
.load-earlier button{display:inline-flex;align-items:center;gap:6px;min-height:34px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03);color:var(--muted);font-family:var(--font-sans),sans-serif;font-size:10px;padding:0 14px;cursor:pointer}
.load-earlier button:hover:not(:disabled){color:var(--ink);border-color:rgba(232,121,169,.3)}
.load-earlier button:disabled{opacity:.6;cursor:progress}


/* The one control inside the mode strip: a link-weight button, because the
   strip is a status line and this must read as an offer rather than an
   interruption. */
.mode-enable{border:0;background:none;padding:0;font-size:9px;color:var(--rose2);text-decoration:underline;cursor:pointer}
.mode-enable:hover{color:var(--rose)}
.gate-actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;width:100%}
.gate-actions>button{flex:1 1 auto;min-width:150px}

/* ===== shell.module.css (.eyebrow/.avatar renamed) ===== */
/*
 * The surfaces that were still first-generation.
 *
 * Chats, Personas, Profile, Saved and Settings were the last pages built
 * against the original global stylesheet: document rows, 9px uppercase labels,
 * bordered boxes, and a floating hamburger that had no base rule and rendered
 * in normal flow above 760px. Everything newer — Discovery, the Studio, the
 * creation page, Worlds V2 — had moved on without them, so the product read as
 * two products depending on which tab you were in.
 *
 * This module is the shared material those five pages are rebuilt from, and it
 * is deliberately the SAME material the modern pages use: near-black ground,
 * thin light borders, an editorial serif for the page title, a clean sans for
 * every control, restrained rose, and artwork given room. Nothing here is a new
 * design language — it is the existing one, finally applied.
 */

.page {
  --surface: #141017;
  --surface-raised: #191320;
  --edge: rgba(255, 255, 255, .07);
  --ink: #f6eff4;
  --muted: #a99cab;
  --faint: #7b6f7e;
  --accent: #e879a9;

  min-height: 100dvh;
  overflow-y: auto;
  background:
    radial-gradient(90% 44% at 50% 0%, rgba(123, 50, 80, .13), transparent 62%),
    #0b080d;
  color: var(--ink);
  padding:
    max(20px, env(safe-area-inset-top))
    max(18px, env(safe-area-inset-right))
    max(52px, env(safe-area-inset-bottom))
    max(18px, env(safe-area-inset-left));
}

.inner { max-width: 1120px; margin: 0 auto; }

/* ----------------------------------------------------------- header --- */

.header {
  display: flex;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 12px;
  margin: 0 0 22px;
}

.headerCopy { flex: 1; min-width: 0; }
.title { overflow-wrap: anywhere; }

/*
 * On a phone the controls take their own row.
 *
 * Measured, not guessed: with a menu button, a bell and a "Mark all as read"
 * beside it, the heading was left 126px of a 375px screen for a word that needs
 * 159, and "Notifications" was cut off. Sharing one row only works while there
 * is one control on it. The controls keep the top line — they are what a thumb
 * reaches for — and the title gets the full width underneath.
 */
@media (max-width: 620px) {
  .menuButton { order: 0; }
  .headerActions { order: 1; margin-left: auto; }
  .headerCopy { order: 2; flex: 1 0 100%; }
}

.pageEyebrow {
  display: block;
  margin: 0 0 6px;
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--faint);
}

.title {
  margin: 0;
  font-family: var(--font-serif), Georgia, serif;
  font-size: clamp(30px, 8vw, 42px);
  line-height: 1.04;
  font-weight: 600;
  letter-spacing: -.01em;
}

.lede {
  margin: 8px 0 0;
  max-width: 56ch;
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.55;
}

.headerActions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; flex: none; }

/* ------------------------------------------------------------- tabs --- */

.tabs {
  display: flex;
  /* A scrolling tab strip must not widen its parent to fit its own tabs. */
  min-width: 0; max-width: 100%;
  gap: 6px;
  margin: 0 0 20px;
  padding: 4px;
  border: 1px solid var(--edge);
  border-radius: 14px;
  background: rgba(255, 255, 255, .022);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex: 1;
  min-width: max-content;
  min-height: 36px;
  padding: 0 14px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--faint);
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: background .18s ease, color .18s ease;
}
.tab:hover { color: var(--ink); }
.tabActive { background: rgba(232, 121, 169, .13); color: #f7c9de; }
.tab em { font-style: normal; opacity: .6; margin-left: 6px; font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ cards --- */

.card {
  width: 100%; min-width: 0; max-width: 100%;
  border: 1px solid var(--edge);
  border-radius: 18px;
  background: var(--surface);
  padding: 18px;
}

.cardHeader {
  display: flex; align-items: center; gap: 9px;
  margin: 0 0 14px;
  color: var(--accent);
}
.cardHeader h2 {
  flex: 1; min-width: 0; overflow-wrap: anywhere; margin: 0;
  font-size: 14px; font-weight: 620; color: var(--ink);
}
.cardHeader em {
  font-style: normal; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums;
}

.stack { display: grid; gap: 12px; min-width: 0; max-width: 100%; }
.stack > * { min-width: 0; }
/* Model slugs, provider ids and persona names are identifiers, and an
   identifier is exactly the kind of string that has no break opportunity. */
.stack strong, .stack small, .stack span { overflow-wrap: anywhere; }

/* ------------------------------------------------- conversation rows --- */

/*
 * Chats, grouped by creation.
 *
 * A flat list of every conversation buried the thing people actually scan for
 * — whose story is this — under a row of identical titles. So the artwork and
 * the creation's own title lead, and its stories nest beneath it. Nothing is
 * hidden: every conversation that existed before still has a row.
 */
.chatGroup {
  border: 1px solid var(--edge);
  border-radius: 18px;
  background: var(--surface);
  overflow: hidden;
  transition: border-color .18s ease;
}
.chatGroup:hover { border-color: rgba(232, 121, 169, .22); }

.chatHead {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px;
}

.chatArt {
  flex: none;
  width: 62px; height: 62px;
  border-radius: 15px;
  overflow: hidden;
  display: grid; place-items: center;
  border: 1px solid var(--edge);
  background: linear-gradient(150deg, var(--creation-accent-deep, #2b2028), #141115);
  font-family: var(--font-serif), Georgia, serif;
  font-size: 22px;
  color: rgba(255, 255, 255, .55);
}
.chatArt img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }

.chatIdentity {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 3px;
  border: 0; background: none; padding: 0;
  color: inherit; text-align: left; cursor: pointer;
}
.chatIdentity strong {
  font-family: var(--font-serif), Georgia, serif;
  font-size: 19px; font-weight: 600; line-height: 1.15;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chatIdentity:hover strong { color: #f7c9de; }
.chatMeta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--faint);
}
.chatMeta span { display: inline-flex; align-items: center; gap: 4px; }

.chatPreview {
  margin: 1px 0 0;
  font-size: 12.5px; line-height: 1.45; color: var(--muted);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; line-clamp: 1;
  overflow: hidden;
}

.chatStories {
  display: grid;
  border-top: 1px solid var(--edge);
}

.storyRow {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  border: 0; border-top: 1px solid var(--edge);
  background: transparent;
  padding: 11px 13px;
  color: inherit; text-align: left; cursor: pointer;
  transition: background .16s ease;
}
.storyRow:first-child { border-top: 0; }
.storyRow:hover { background: rgba(255, 255, 255, .035); }
.storyRow > span { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.storyRow strong {
  font-size: 13px; font-weight: 580;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.storyRow small { font-size: 11px; color: var(--faint); }
.storyRow time { flex: none; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }

.newStory {
  display: flex; align-items: center; gap: 8px;
  width: 100%;
  border: 0; border-top: 1px solid var(--edge);
  background: transparent;
  padding: 11px 13px;
  color: #f0aecb; font-size: 12.5px; font-weight: 580;
  cursor: pointer; text-align: left;
}
.newStory:hover { background: rgba(232, 121, 169, .07); }

/* ------------------------------------------------------ persona grid --- */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
  gap: 12px;
}

.personaCard {
  display: flex; align-items: flex-start; gap: 12px;
  border: 1px solid var(--edge);
  border-radius: 18px;
  background: var(--surface);
  padding: 15px;
  color: inherit; text-align: left; cursor: pointer;
  transition: border-color .18s ease, background .18s ease, transform .18s ease;
}
.personaCard:hover {
  transform: translateY(-2px);
  border-color: rgba(232, 121, 169, .28);
  background: var(--surface-raised);
}

.pageAvatar {
  flex: none;
  width: 52px; height: 52px;
  border-radius: 50%;
  overflow: hidden;
  display: grid; place-items: center;
  border: 1px solid var(--edge);
  background: rgba(232, 121, 169, .12);
  font-size: 16px; font-weight: 600; color: #f0d9e7;
}
.pageAvatar img { width: 100%; height: 100%; object-fit: cover; }

.personaBody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.personaBody strong { font-size: 14.5px; font-weight: 600; }
.personaBody small { font-size: 11px; color: var(--faint); }
.personaBody p {
  margin: 4px 0 0;
  font-size: 12.5px; line-height: 1.5; color: var(--muted);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3;
  overflow: hidden;
}

.defaultBadge {
  align-self: flex-start;
  border: 1px solid rgba(232, 121, 169, .3);
  border-radius: 999px;
  background: rgba(232, 121, 169, .1);
  padding: 2px 8px;
  font-size: 10px; font-weight: 640; color: #f0d9e7;
}

/* ----------------------------------------------------------- fields --- */

.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; max-width: 100%; }
.fieldLabel { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.fieldHint { min-width: 0; max-width: 100%; font-size: 11px; line-height: 1.5; color: var(--faint); overflow-wrap: anywhere; }

.input, .textarea, .select {
  /*
   * `width: 100%` is not enough inside a flex or grid parent: a form control
   * carries an intrinsic minimum from its `size` attribute, so it refuses to
   * shrink below roughly twenty characters and pushes the sheet wider than the
   * phone. `min-width: 0` is what actually lets it fit.
   */
  width: 100%; min-width: 0; max-width: 100%;
  border: 1px solid var(--edge);
  border-radius: 12px;
  background: #100c12;
  color: var(--ink);
  padding: 11px 12px;
  font-size: 14px;
  transition: border-color .18s ease, box-shadow .18s ease;
}
.textarea { resize: vertical; line-height: 1.6; min-height: 96px; }

.input:focus, .textarea:focus, .select:focus,
.input:focus-visible, .textarea:focus-visible, .select:focus-visible {
  outline: none;
  border-color: rgba(232, 121, 169, .5);
  box-shadow: 0 0 0 3px rgba(232, 121, 169, .1);
}

.counter { align-self: flex-end; font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }

.toggleRow {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  border: 1px solid var(--edge);
  border-radius: 14px;
  background: rgba(255, 255, 255, .022);
  padding: 13px 14px;
}
.toggleRow > span { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.toggleRow strong { font-size: 13px; font-weight: 600; }
.toggleRow small { font-size: 11px; line-height: 1.45; color: var(--faint); }
.toggleRow input { flex: none; width: 18px; height: 18px; accent-color: var(--accent); }

/* ------------------------------------------------------- statistics --- */

.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
  gap: 1px;
  border: 1px solid var(--edge);
  border-radius: 14px;
  background: var(--edge);
  overflow: hidden;
}
.metric { background: var(--surface); min-width: 0; padding: 14px 12px; display: grid; gap: 5px; }
.metric dt {
  font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint);
  overflow-wrap: anywhere;
}
.metric dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-size: 19px; font-weight: 640; font-variant-numeric: tabular-nums; line-height: 1.1; }
.metric small { min-width: 0; overflow-wrap: anywhere; font-size: 10.5px; color: var(--faint); font-weight: 500; }

/* --------------------------------------------------------- feedback --- */

.empty {
  display: grid; justify-items: center; gap: 10px;
  border: 1px dashed var(--edge);
  border-radius: 18px;
  background: rgba(255, 255, 255, .015);
  padding: 44px 22px;
  text-align: center;
}
.empty svg { color: rgba(232, 121, 169, .55); }
.empty h2 {
  margin: 0;
  font-family: var(--font-serif), Georgia, serif;
  font-size: 22px; font-weight: 600;
}
.empty p { margin: 0; max-width: 40ch; color: var(--muted); font-size: 13px; line-height: 1.55; }

.notice {
  border: 1px solid rgba(112, 201, 154, .24);
  border-radius: 12px;
  background: rgba(78, 167, 119, .08);
  padding: 10px 12px;
  color: #b7e4ca; font-size: 12.5px;
}

.error {
  border: 1px solid rgba(238, 104, 137, .3);
  border-radius: 12px;
  background: rgba(238, 104, 137, .09);
  padding: 10px 12px;
  color: #ffb4c6; font-size: 12.5px;
}

.quiet { margin: 0; color: var(--faint); font-size: 12.5px; }

/* ---------------------------------------------------------- dialogs --- */

/*
 * One sheet, used by everything that used to open its own modal.
 *
 * On a phone it is a bottom sheet with a safe-area-aware footer; on a desktop
 * it is a centred panel. Same radii, same borders, same button treatment as
 * the rest of the product.
 */
.sheetBackdrop {
  position: fixed; inset: 0; z-index: 40;
  display: grid; align-items: end;
  background: rgba(5, 4, 6, .72);
  backdrop-filter: blur(8px);
  animation: sheetFade .16s ease-out;
}

/*
 * `min-width: 0` and `max-width: 100%` are load-bearing, not tidiness.
 *
 * The sheet is a GRID ITEM, and a grid item's automatic minimum size is its
 * content — so `width: min(660px, 100%)` was a suggestion that a long
 * unbreakable string inside (a model slug, a provider id, a persona name typed
 * without spaces) could overrule, and Settings grew until the page scrolled
 * sideways. Every container between here and the text repeats this, because
 * one missing link is enough to bring the whole chain back.
 */
.sheet {
  display: flex; flex-direction: column;
  /* The panel is a SIBLING of `.sheetBackdrop`, not a child of it, and a
     positioned element with a z-index paints above static siblings however
     late it comes in the DOM — without this, the backdrop covered the panel
     and every press "inside" a sheet hit the backdrop and closed it. */
  position: relative;
  z-index: 41;
  width: 100%;
  min-width: 0; max-width: 100%;
  max-height: min(90dvh, 780px);
  border: 1px solid var(--edge);
  border-bottom: 0;
  border-radius: 22px 22px 0 0;
  background: #15111a;
  box-shadow: 0 -20px 60px rgba(0, 0, 0, .55);
  animation: sheetRise .22s ease-out;
  overflow: hidden;
}

.sheetHeader {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--edge);
}
.sheetHeader > div { flex: 1; min-width: 0; }
.sheetHeader h2 {
  margin: 2px 0 0;
  font-family: var(--font-serif), Georgia, serif;
  font-size: 23px; font-weight: 600; line-height: 1.1;
}

.sheetBody {
  flex: 1; min-width: 0; min-height: 0;
  width: 100%; max-width: 100%;
  /*
   * `clip` rather than `hidden`.
   *
   * `overflow-x: hidden` makes the element a scroll container in that axis:
   * programmatically scrollable, and it traps `position: sticky` descendants.
   * `clip` says what is meant — anything overhanging is not drawn — without any
   * of that. It is the right primitive for containment.
   */
  overflow-x: clip;
  overflow-y: auto;
  padding: 16px;
  display: grid; gap: 14px;
  align-content: start;
}
/* One rule, so nothing inside the sheet has to remember to be shrinkable. */
.sheetBody > * { min-width: 0; max-width: 100%; }
.sheetBody > * { min-width: 0; }

.sheetFooter {
  /* Two long button labels wrap onto a second row rather than overflowing. */
  display: flex; flex-wrap: wrap; gap: 9px;
  min-width: 0; max-width: 100%;
  padding: 12px 16px max(12px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--edge);
  background: rgba(12, 9, 14, .7);
}
.sheetFooter > *:last-child { margin-left: auto; }
.sheetFooter .grow { flex: 1; }

/*
 * A sheet that is a page.
 *
 * The memory library is long, editable and scrolled with a thumb, so on a phone
 * it takes the whole viewport: full height, its own scroll container, the page
 * behind locked by `Sheet`, and both safe areas respected. Above 700px it falls
 * back to the ordinary centred panel, where a modal is the right shape.
 */
.sheetFull {
  height: 100dvh;
  max-height: 100dvh;
  border-radius: 0;
  border-left: 0; border-right: 0; border-top: 0;
}
.sheetFull .sheetHeader { padding-top: max(16px, env(safe-area-inset-top)); }
.sheetFull .sheetBody { padding-bottom: max(16px, env(safe-area-inset-bottom)); overscroll-behavior: contain; }

@keyframes sheetFade { from { opacity: 0; } }
@keyframes sheetRise { from { transform: translateY(18px); opacity: 0; } }

@media (min-width: 700px) {
  .page { padding: 34px 30px max(56px, env(safe-area-inset-bottom)); }
  .header { margin-bottom: 26px; }
  .sheetBackdrop { align-items: center; justify-items: center; padding: 24px; }
  .sheetBackdrop > * { min-width: 0; }
  .sheet {
    width: min(660px, 100%);

    border-radius: 22px;

  }

    height: auto;
    max-height: min(90dvh, 860px);
    border: 1px solid var(--edge);
    border-radius: 22px;
  }

  .sheetFull .sheetBody { padding-bottom: 16px; }

}

@media (min-width: 1100px) {

}

@media (prefers-reduced-motion: reduce) {

/*
 * The menu control in a shell header.

 * Placement only — the button itself is the shared rounded-square primitive.
 * It is hidden once the sidebar is permanently visible, because a second way
 * to open navigation that is already on screen is clutter, not affordance.
 */
/* Visible at every width: below 500px it opens the drawer, above it collapses
   the sidebar column. One hamburger, two behaviours, chosen by the viewport. */
.menuButton { display: inline-grid; flex: none; margin-top: 2px; }

@media (max-width: 500px) {
}

/* A toggle row reads as chosen, not merely as ticked. */
.toggleRow[data-active="true"] {
  border-color: rgba(232, 121, 169, .3);
  background: rgba(232, 121, 169, .07);
}

/*
 * The usage report's period selector.

 * Chips rather than a dropdown: an operator comparing two windows switches
 * between them repeatedly, and a menu that has to be opened each time turns one
 * comparison into four interactions.
 */
.rangePicker { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.rangeChip {
  border: 1px solid var(--line); border-radius: 9px; padding: 6px 11px;
  background: rgba(255, 255, 255, .03); color: var(--muted);

  transition: background .15s, border-color .15s, color .15s;
}
.rangeChip:hover { color: var(--ink); background: rgba(255, 255, 255, .07); }
.rangeChipActive { border-color: rgba(232, 121, 169, .38); background: rgba(232, 121, 169, .1); color: var(--ink); }
.rangeCustom { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 12px; }
.rangeCustom label { display: flex; flex: 1 1 150px; flex-direction: column; gap: 5px; }

/* Writer-only OpenRouter funding. Secret input and saved metadata are separate
   surfaces so a connected state never needs to decrypt or repopulate a key. */
.byokIntro { min-width: 0; max-width: 100%; overflow-wrap: anywhere; margin: 0 0 13px; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
.byokPanel { display: grid; gap: 14px; min-width: 0; }
.byokStatusRow { display: flex; align-items: center; gap: 11px; min-width: 0; }
.byokProviderMark {
  display: grid; place-items: center; flex: none; width: 38px; height: 38px;
  border: 1px solid rgba(184, 146, 240, .3); border-radius: 12px;
  background: rgba(184, 146, 240, .09); color: #d9bdf7;
}
.byokStatusCopy { display: grid; gap: 2px; min-width: 0; }
.byokStatusCopy strong { font-size: 13px; }
.byokStatusCopy span { color: var(--muted); font-size: 12px; }
.byokStatusCopy small { color: var(--faint); overflow-wrap: anywhere; }
.byokConnect { display: grid; gap: 8px; min-width: 0; }
.byokActions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; min-width: 0; }
.byokActions > * { min-width: 0; max-width: 100%; }
.fundingChoices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; min-width: 0; max-width: 100%; }
.fundingChoices button {
  min-width: 0; min-height: 64px; display: grid; align-content: center; gap: 4px;
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;

}
.fundingChoices button[aria-checked="true"] { border-color: rgba(232,121,169,.42); background: rgba(232,121,169,.1); }
.fundingChoices button:focus-visible { outline: 2px solid #f0a6c6; outline-offset: 2px; }
.fundingChoices button[disabled] { opacity: .5; cursor: not-allowed; }
.fundingChoices strong { font-size: 12.5px; }
.fundingChoices small { min-width: 0; color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; }
.byokDisclosure { min-width: 0; max-width: 100%; margin: 14px 0 0; color: var(--faint); font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
.byokUnavailable { min-width: 0; max-width: 100%; overflow-wrap: anywhere; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; color: var(--muted); font-size: 12px; line-height: 1.45; }
.removeConfirm { display: grid; gap: 8px; min-width: 0; max-width: 100%; border: 1px solid rgba(238,104,137,.28); border-radius: 13px; background: rgba(238,104,137,.07); padding: 12px; }

/*
 * Profile — the creator's own view.
 *
 * The page is a form, so the new pieces stay form-shaped: a banner previewed
 * at the size it will occupy, a row of swatches, a row of chips. Nothing here
 * competes with the public profile; this is where a creator DECIDES what that
 * page shows.
 */
.profileStats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.profileRank {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px;
  margin: 16px 0 0; color: var(--muted); font-family: var(--font-sans); font-size: 11px;
}
.profileRank strong { font-family: var(--font-serif), Georgia, serif; font-size: 20px; color: var(--ink); }
.profileRank svg { color: #f0a6c6; align-self: center; }
.profileLink {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 42px; margin-top: 14px;
  border: 1px solid rgba(232, 121, 169, .26); border-radius: 12px;
  background: rgba(232, 121, 169, .08); color: #f2dcea; text-decoration: none;
  padding: 0 15px; font-size: 12px;
}
.profileLink:hover { background: rgba(232, 121, 169, .16); }
.profileLink:focus-visible { outline: 2px solid #f0a6c6; outline-offset: 2px; }

/* ---------------------------------------------------------------------------
 * The editable profile header
 *
 * There used to be two things here: a "preview" showing the banner with the
 * ringed avatar over it, and — separately, below — a plain circle that was the
 * control the file picker actually wrote to. One of them wore the cosmetic the
 * creator had earned and the other did not, and neither was labelled as the
 * real one.
 *
 * This is one object. It has the proportions of the public header, it draws the
 * same `CreatorAvatar` with the same ring, and both pictures are changed by
 * tapping the thing they are. Nothing on the page previews anything.
 * ------------------------------------------------------------------------ */
.editHeader { display: flex; flex-direction: column; }

.editCover {
  position: relative;
  height: 148px;
  border-radius: 16px 16px 0 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-bottom: 0;
  background: #16121a;
}
.editCover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.coverEmpty {
  display: block; width: 100%; height: 100%;
  background:
    radial-gradient(120% 140% at 18% 10%, rgba(232, 121, 169, .28), transparent 55%),
    radial-gradient(120% 140% at 82% 0%, rgba(138, 92, 246, .26), transparent 58%),
    linear-gradient(180deg, #1a1320, #100b14);
}
/* Keeps the control legible over a bright photograph without dimming the
   whole banner. */
.editCoverScrim {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(8, 6, 9, .45) 0%, transparent 38%, rgba(8, 6, 9, .55) 100%);
  pointer-events: none;
}

.editCoverButton, .editCoverRemove {
  position: absolute; top: 10px;
  display: inline-flex; align-items: center; gap: 7px;
  min-height: 34px; padding: 0 12px;
  border: 1px solid rgba(255, 255, 255, .18);
  border-radius: 10px;
  background: rgba(12, 9, 13, .62);
  backdrop-filter: blur(10px);
  color: #ece0e8;
  font-family: var(--font-sans); font-size: 11px; font-weight: 500;
  cursor: pointer;
}
.editCoverButton { right: 10px; }
.editCoverButton input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.editCoverRemove { right: 10px; top: auto; bottom: 10px; width: 34px; padding: 0; justify-content: center; }
.editCoverButton:hover, .editCoverRemove:hover { background: rgba(232, 121, 169, .28); border-color: rgba(232, 121, 169, .45); }
.editCoverButton:focus-within, .editCoverRemove:focus-visible { outline: 2px solid #f0a6c6; outline-offset: 2px; }

.editIdentity {
  display: flex; align-items: flex-end; gap: 14px;
  /* The avatar overlaps the banner exactly as it does on the public page. */
  margin-top: -34px;
  padding: 0 4px 0 18px;
  border: 1px solid var(--line);
  border-top: 0;
  border-radius: 0 0 16px 16px;
  background: linear-gradient(180deg, rgba(30, 22, 34, .55), transparent 70%);
  padding-bottom: 16px;
}

/* The avatar IS the picker. */
.editAvatar { position: relative; display: inline-flex; cursor: pointer; flex: 0 0 auto; }
.editAvatar input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.editAvatarBadge {
  position: absolute; right: -2px; bottom: -2px;
  display: grid; place-items: center;
  width: 30px; height: 30px; border-radius: 50%;

  color: #1a0f18;
  pointer-events: none;
}

.editAvatar:focus-within { outline: 2px solid #f0a6c6; outline-offset: 4px; border-radius: 50%; }

.editIdentityCopy { min-width: 0; display: flex; flex-direction: column; gap: 3px; padding-bottom: 4px; }

  font-size: 12.5px; line-height: 1.5; color: var(--muted);

  overflow: hidden;
}

.borderRow { display: flex; flex-wrap: wrap; gap: 12px; }
.borderSwatch {

.featureGrid { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0 0; padding: 0; list-style: none; }
.feature, .featureChosen {
  min-height: 36px; border-radius: 999px; padding: 0 13px;
  border: 1px solid var(--line); background: rgba(255, 255, 255, .03);
  color: var(--muted); font-family: var(--font-sans); font-size: 10.5px; cursor: pointer;
}

.featureChosen { border-color: rgba(232, 121, 169, .45); background: rgba(232, 121, 169, .12); color: #f6c5da; }
.feature:focus-visible, .featureChosen:focus-visible { outline: 2px solid #f0a6c6; outline-offset: 2px; }

.profileBadges {
