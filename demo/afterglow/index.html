/* Visually hidden, still announced. Used by icon-only and image-only controls. */
.srOnly {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------------------------------------------------------------------------
 * Notifications
 *
 * A list of one repeated thing, so the styling is almost entirely about making
 * each row a comfortable tap target with a picture worth recognising. The
 * unread state is a soft tint and a small mark rather than a bold row: these
 * are good news, not tasks.
 * ------------------------------------------------------------------------ */
.bell { position: relative; }
.bellDot {
  position: absolute; top: 8px; right: 8px;
  width: 8px; height: 8px; border-radius: 50%;
  background: linear-gradient(135deg, #ff5fa2, #e879a9);
  box-shadow: 0 0 0 2px var(--panel, #171319), 0 0 10px rgba(255, 95, 162, .7);
}

.notificationList { list-style: none; display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; }

.notification {
  position: relative;
  display: flex; align-items: stretch; gap: 4px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255, 255, 255, .015);
  transition: background .18s ease, border-color .18s ease;
}
.notification:hover { background: rgba(255, 255, 255, .05); border-color: rgba(232, 121, 169, .24); }
.notificationUnread {
  border-color: rgba(232, 121, 169, .26);
  background: linear-gradient(120deg, rgba(232, 121, 169, .09), rgba(138, 92, 246, .05));
}

.notificationMain {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 13px;
  padding: 11px 12px;
  color: inherit; text-decoration: none;
  border-radius: 13px;
}
.notificationMain:focus-visible { outline: 2px solid #f0a6c6; outline-offset: -2px; }

/* `flex: 0 0 52px` rather than `0 0 auto`: in a row with long copy the frame
   could otherwise be shrunk below its own width and the square went oval. */
.notificationArt {
  position: relative;
  flex: 0 0 52px; width: 52px; height: 52px; aspect-ratio: 1;
}
.notificationArtFrame {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  border-radius: 13px; overflow: hidden;
  background: rgba(232, 121, 169, .12);
  color: #f0d9e7;
  font-family: var(--font-serif), Georgia, serif; font-size: 17px;
}
.notificationArtFrame img {
  display: block;
  width: 100%; height: 100%;
  /* Centred. The old 25% bias was chosen for portraits and put every other
     kind of cover art visibly off-centre in its own rectangle. */
  object-fit: cover; object-position: center;
}
/* The creator, on the corner of their work: whose release this is, at a
   glance, without a second row of text saying so. */
.notificationActor {
  position: absolute; right: -5px; bottom: -5px;
  display: grid; place-items: center;
  width: 24px; height: 24px; border-radius: 50%;
  overflow: hidden;
  border: 2px solid var(--panel, #171319);
  background: rgba(138, 92, 246, .3);
  font-family: var(--font-sans); font-size: 8.5px; font-weight: 600; color: #f0d9e7;
}
.notificationActor img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

.notificationCopy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.notificationCopy strong {
  font-size: 13.5px; font-weight: 560; line-height: 1.35; color: var(--ink);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2;
  overflow: hidden;
}
.notificationCopy small { font-size: 11px; color: var(--faint); }

.notificationDot {
  flex: 0 0 auto;
  width: 8px; height: 8px; border-radius: 50%;
  background: linear-gradient(135deg, #ff5fa2, #e879a9);
}

.notificationCreator {
  flex: 0 0 auto;
  display: grid; place-items: center;
  width: 38px;
  border: 0; border-left: 1px solid var(--line);
  color: var(--faint); text-decoration: none;
  border-radius: 0 13px 13px 0;
}
.notificationCreator:hover { background: rgba(232, 121, 169, .14); color: #f0a6c6; }
.notificationCreator:focus-visible { outline: 2px solid #f0a6c6; outline-offset: -2px; }

.emptyPanel {
  display: flex; flex-direction: column; align-items: flex-start; gap: 9px;
  border: 1px solid var(--line); border-radius: 16px;
  background: rgba(255, 255, 255, .015);
  padding: 26px 22px;
}
.emptyPanel svg { color: #f0a6c6; }
.emptyPanel h2 { margin: 0; font-family: var(--font-serif), Georgia, serif; font-size: 20px; font-weight: 600; }
.emptyPanel p { margin: 0; max-width: 52ch; font-size: 13px; line-height: 1.6; color: var(--muted); }

@media (max-width: 520px) {
  .notificationArt { flex-basis: 46px; width: 46px; height: 46px; }
  .notificationCopy strong { font-size: 13px; }
}

/* ------------------------------------------------- memory library --- */

/*
 * A long, editable list read with a thumb.
 *
 * Everything here sizes from content rather than from a fixed width, and every
 * text node wraps: a memory can be one word or three hundred, and a durable
 * fact that arrives as an unbroken URL must not be able to widen the sheet.
 */
/*
 * THE MEMORY SURFACE, REBUILT IN THE CURRENT MATERIAL.
 *
 * This screen was still first-generation: flat white-alpha cards on a flat
 * ground, every memory identical to every other, uppercase text doing the work
 * that structure should do, and controls that read as a settings form rather
 * than as an archive. Everything around it — the chat, Settings, the Studio —
 * had moved to the near-black ground with its warm violet undertone, restrained
 * glass and rounded controls, so opening Memory felt like leaving the app.
 *
 * Nothing about what a memory MEANS changes here. The semantics — supersession
 * rather than deletion, atoms editable and derived layers not, pinning, kind,
 * importance, scope — are exactly as they were. What changes is that they are
 * now legible at a glance instead of being seven identical grey lines.
 *
 * The one structural idea: a memory's KIND is its identity, so it carries a
 * tinted pill and a matching left rail. Scanning for "what did it decide about
 * boundaries" stops being a reading exercise.
 */

.memoryIntro {
  display: flex; align-items: flex-start; gap: 10px;
  margin: 0;
  border: 1px solid rgba(232, 121, 169, .16);
  border-radius: 15px;
  background:
    linear-gradient(180deg, rgba(232, 121, 169, .07), rgba(138, 92, 246, .045)),
    rgba(255, 255, 255, .015);
  padding: 13px 14px;
  color: var(--muted); font-size: 12.5px; line-height: 1.6;
}
.memoryIntro svg { flex: none; margin-top: 2px; color: var(--rose2, var(--accent)); }

.memoryListHead {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-top: 4px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--edge);
}
.memoryListHead h3, .memoryDerived h3 {
  display: flex; align-items: center; gap: 8px;
  margin: 0;
  font-family: var(--font-serif), Georgia, serif;
  font-size: 17px; font-weight: 600; letter-spacing: -.01em;
}
.memoryListHead h3 svg, .memoryDerived h3 svg { color: var(--accent); opacity: .8; }

/* A real control rather than a bare checkbox floating beside a heading. */
.memoryToggle {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 32px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: rgba(255, 255, 255, .022);
  padding: 0 12px;
  color: var(--faint); font-size: 11px; white-space: nowrap; cursor: pointer;
  transition: color .15s ease, border-color .15s ease, background .15s ease;
}
.memoryToggle:hover { color: var(--ink); border-color: rgba(232, 121, 169, .28); }
.memoryToggle input { accent-color: var(--accent); margin: 0; }

.memoryList { list-style: none; display: grid; gap: 11px; margin: 0; padding: 0; }

.memoryItem {
  position: relative;
  min-width: 0;
  display: grid; gap: 9px;
  overflow: hidden;
  border: 1px solid var(--edge);
  border-radius: 16px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .028), rgba(255, 255, 255, .012)),
    var(--surface, #141017);
  padding: 13px 14px 13px 16px;
  transition: border-color .15s ease, transform .15s ease;
}
/* The kind rail. Coloured per kind below; neutral until one is named. */
.memoryItem::before {
  content: "";
  position: absolute; inset: 0 auto 0 0;
  width: 3px;
  background: var(--kind-tint, rgba(255, 255, 255, .07));
}
.memoryItem:hover { border-color: rgba(232, 121, 169, .2); }
.memoryItemRemoved { opacity: .5; }
.memoryItemRemoved::before { background: rgba(255, 255, 255, .06); }
/* A pinned memory is the reader's own instruction, so it says so structurally. */
.memoryItemPinned {
  border-color: rgba(232, 121, 169, .28);
  background:
    linear-gradient(180deg, rgba(232, 121, 169, .06), rgba(255, 255, 255, .012)),
    var(--surface, #141017);
}

.memoryMeta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  color: var(--faint); font-size: 10.5px;
}
/* The old rule joined these with typographic dots, which turned seven facts
   into one run-on line. They are discrete chips now. */
.memoryMeta > span {
  display: inline-flex; align-items: center; gap: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .04);
  padding: 3px 8px;
  letter-spacing: .01em;
}
.memoryKind {
  color: var(--kind-ink, var(--muted)) !important;
  background: var(--kind-wash, rgba(255, 255, 255, .05)) !important;
  font-weight: 600;
}
.memoryPinned { color: #22161d !important; background: var(--accent) !important; font-weight: 600; }
.memoryScope { color: var(--faint); }

/*
 * Kind tinting.
 *
 * Six hues across the app's own violet-to-rose range rather than a rainbow: the
 * point is to make kinds distinguishable at a glance, not to decorate. Anything
 * unrecognised keeps the neutral rail, which is why the fallbacks above exist.
 */
.kindIdentity { --kind-tint: #8a5cf6; --kind-ink: #c7b0fb; --kind-wash: rgba(138, 92, 246, .16); }
.kindRelationship { --kind-tint: #e879a9; --kind-ink: #f5a8c6; --kind-wash: rgba(232, 121, 169, .16); }
.kindEvent { --kind-tint: #5c9df6; --kind-ink: #a8c8f7; --kind-wash: rgba(92, 157, 246, .15); }
.kindPromise { --kind-tint: #f0a65c; --kind-ink: #f6c99a; --kind-wash: rgba(240, 166, 92, .15); }
.kindPreference { --kind-tint: #5fc9a8; --kind-ink: #9fdec9; --kind-wash: rgba(95, 201, 168, .15); }
.kindBoundary { --kind-tint: #ee6889; --kind-ink: #f4a2b6; --kind-wash: rgba(238, 104, 137, .16); }
.kindOpenLoop { --kind-tint: #b58cf0; --kind-ink: #d5bcf7; --kind-wash: rgba(181, 140, 240, .15); }

/* `overflow-wrap: anywhere` is what stops one long token widening the sheet. */
.memoryText, .memorySummary {
  margin: 0;
  color: var(--ink);
  font-size: 13.5px; line-height: 1.62;
  overflow-wrap: anywhere; word-break: break-word;
}
.memorySummary { color: var(--muted); }
.memoryKeywords {
  display: flex; flex-wrap: wrap; gap: 5px;
  margin: 0;
  color: var(--faint); font-size: 10.5px; overflow-wrap: anywhere;
}

.memoryActions { display: flex; flex-wrap: wrap; gap: 7px; }
.memoryActions button {
  display: inline-flex; align-items: center; gap: 6px;
  /* 34px keeps every control inside a comfortable touch target on a phone. */
  min-height: 34px;
  border: 1px solid var(--edge);
  border-radius: 10px;
  background: rgba(255, 255, 255, .028);
  color: var(--muted);
  padding: 0 11px;
  font-size: 11.5px; cursor: pointer;
  transition: color .15s ease, border-color .15s ease, background .15s ease;
}
.memoryActions button:hover:not(:disabled) { color: var(--ink); border-color: rgba(232, 121, 169, .32); background: rgba(232, 121, 169, .07); }
.memoryActions button:disabled { opacity: .5; cursor: not-allowed; }
.memoryDanger { color: #ef9bb1 !important; border-color: rgba(238, 104, 137, .25) !important; }
.memoryDanger:hover:not(:disabled) { background: rgba(238, 104, 137, .1) !important; border-color: rgba(238, 104, 137, .42) !important; }

.memoryEditor {
  display: grid; gap: 10px;
  border: 1px solid rgba(232, 121, 169, .28);
  border-radius: 16px;
  background:
    linear-gradient(180deg, rgba(232, 121, 169, .08), rgba(138, 92, 246, .04)),
    var(--surface-raised, #191320);
  padding: 14px;
}
.memoryTextarea {
  width: 100%; min-width: 0;
  resize: vertical;
  border: 1px solid var(--edge);
  border-radius: 12px;
  background: rgba(6, 5, 7, .4);
  color: var(--ink);
  padding: 11px 12px;
  font-size: 13.5px; line-height: 1.55;
}
.memoryTextarea:focus, .memoryTextarea:focus-visible { outline: none; border-color: rgba(232, 121, 169, .45); }
/* `minmax(0, 1fr)` rather than `1fr`: a select with a long label must shrink. */
.memoryEditorRow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr)); gap: 10px; }
.memoryEditorActions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

/*
 * Derived layers — canon, the rolling summary, chapters — read as reference
 * rather than as things to act on, so they sit on a quieter ground with no
 * hover state and no controls.
 */
.memoryDerived {
  min-width: 0;
  display: grid; gap: 9px;
  border: 1px solid var(--edge);
  border-radius: 16px;
  background: rgba(255, 255, 255, .016);
  padding: 14px;
}

@media (max-width: 480px) {
  /* One column of comfortable targets; nothing crowds at the narrow end. */
  .memoryItem { padding: 12px 12px 12px 15px; }
  .memoryActions { gap: 6px; }
  .memoryActions button { flex: 1 1 auto; justify-content: center; min-height: 38px; }
  .memoryListHead { flex-wrap: wrap; }
  .memoryEditorActions button { flex: 1 1 auto; justify-content: center; }
}

.memoryDerived ul { list-style: none; display: grid; gap: 8px; margin: 0; padding: 0; }
.memoryDerived li {
  min-width: 0;
  color: var(--muted); font-size: 12.5px; line-height: 1.58;
  overflow-wrap: anywhere; word-break: break-word;
}
.memoryDerived li b {
  display: inline-block; margin-right: 7px;
  color: var(--rose2); font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em;
}

/* Administrator diagnostics. Wide by nature, so it scrolls inside its own box
   rather than widening the sheet. */
.diagnosticBlock {
  margin: 0;
  max-height: 320px;
  overflow: auto;
  overscroll-behavior: contain;
  border: 1px solid var(--edge);
  border-radius: 11px;
  background: rgba(6, 5, 7, .5);
  padding: 10px;
  color: var(--muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10.5px; line-height: 1.5;
  white-space: pre;
}
.memoryDerived h3 { display: flex; align-items: center; gap: 7px; }
.memoryDerived h3 svg { color: var(--rose2); flex: none; }

/*
 * The exact transcript turns one generation was handed.
 *
 * Distinct from `.memoryDerived li` because these are quotations rather than
 * facts: a turn that has been edited since is shown AS IT WAS, and the note
 * saying so has to sit close enough to the text that the two are read together.
 */
.contextTurns { list-style: none; display: grid; gap: 6px; margin: 0; padding: 0; }
.contextTurns li {
  min-width: 0;
  display: grid; gap: 2px;
  border-left: 2px solid var(--edge);
  padding: 4px 0 4px 9px;
  color: var(--muted); font-size: 12px; line-height: 1.5;
  overflow-wrap: anywhere; word-break: break-word;
}
.contextTurns li b {
  color: var(--rose2); font-size: 9.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em;
}
/* A turn whose text has moved on since the writer read it. */
.contextTurns li[data-state="edited_since"] { border-left-color: var(--rose2); }
.contextTurns li[data-state="removed_since"] { opacity: .62; }
.contextTurns li em, .contextStateNote {
  display: block;
  color: var(--rose2); font-size: 10px; font-style: normal;
  letter-spacing: .04em; opacity: .85;
}
.contextStateNote { margin-top: 2px; }

/* ===== ui.module.css (.primary/.secondary/.srOnly renamed) ===== */
/*
 * Afterglow's shared control shapes.
 *
 * The app had drifted into two geometries for the same job: perfect circles on
 * the creation, cast and world pages, and rounded squares in the newer feed,
 * worlds and creations headers. Back and Menu are the same KIND of action, so
 * they should not be two different shapes depending on which sprint built the
 * page they sit on.
 *
 * This file settles it. An ordinary icon action is a rounded square. Circles
 * remain where the circle means something — an avatar, a floating create
 * control — and those are not built from these classes.
 */

:root {
  --ui-radius-control: 12px;
  --ui-radius-panel: 16px;
}

/* ------------------------------------------------------------ icon ---- */

.iconButton {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 38px;
  height: 38px;
  padding: 0;
  border: 1px solid var(--edge, rgba(255, 255, 255, .1));
  border-radius: var(--ui-radius-control);
  background: rgba(255, 255, 255, .035);
  color: var(--ink, #f6eff4);
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease, transform .12s ease;
}

.iconButton:hover {
  background: rgba(232, 121, 169, .14);
  border-color: rgba(232, 121, 169, .32);
}

.iconButton:active { transform: scale(.94); }

.iconButton:focus-visible {
  outline: 2px solid var(--creation-accent-readable, #f5a8c6);
  outline-offset: 2px;
}

.iconButton[disabled] { opacity: .45; cursor: not-allowed; }

/*
 * The variant that sits on top of artwork.
 *
 * Same shape, blurred so it stays legible over a bright cover — which is what
 * the old `.circleButton` on the hero bars was for.
 */
.onMedia {
  background: rgba(14, 10, 16, .58);
  backdrop-filter: blur(14px);
  border-color: rgba(255, 255, 255, .16);
}

.onMedia:hover {
  background: rgba(232, 121, 169, .18);
  border-color: rgba(232, 121, 169, .34);
}

/* Quieter, for a control inside a card rather than on a page header. */
.subtle {
  width: 32px;
  height: 32px;
  border-color: transparent;
  background: transparent;
  color: var(--muted, #a99cab);
}

.subtle:hover {
  background: rgba(255, 255, 255, .06);
  border-color: var(--edge, rgba(255, 255, 255, .1));
  color: var(--ink, #f6eff4);
}

/* Pressed state for a toggle drawn as an icon, e.g. Save. */
.iconButton[aria-pressed="true"] {
  background: rgba(232, 121, 169, .18);
  border-color: rgba(232, 121, 169, .38);
  color: #f7c9de;
}

/* ---------------------------------------------------------- buttons ---- */

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 16px;
  border: 1px solid transparent;
  border-radius: var(--ui-radius-control);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease, transform .12s ease, opacity .18s ease;
}

.button:active { transform: scale(.985); }
.button[disabled] { opacity: .5; cursor: not-allowed; }
.button:focus-visible { outline: 2px solid var(--creation-accent-readable, #f5a8c6); outline-offset: 2px; }

.uiPrimary {
  border-color: rgba(232, 121, 169, .4);
  background: linear-gradient(120deg, var(--creation-accent-bright, #f5a8c6), var(--creation-accent, #e879a9) 55%, var(--creation-accent-soft, #b892f0));
  color: #180f16;
}

.uiPrimary:hover { filter: brightness(1.06); }

.uiSecondary {
  border-color: var(--edge, rgba(255, 255, 255, .1));
  background: rgba(255, 255, 255, .04);
  color: var(--ink, #f6eff4);
}

.uiSecondary:hover { background: rgba(255, 255, 255, .08); }

.destructive {
  border-color: rgba(238, 104, 137, .38);
  background: rgba(238, 104, 137, .1);
  color: #ffb4c6;
}

.destructive:hover { background: rgba(238, 104, 137, .18); }

/* A selectable filter or option. Pill-shaped on purpose: a chip is a chip. */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 0 12px;
  border: 1px solid var(--edge, rgba(255, 255, 255, .1));
  border-radius: 999px;
  background: rgba(255, 255, 255, .03);
  color: var(--muted, #a99cab);
  font-size: 12px;
  font-weight: 560;
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease, color .18s ease;
}

.chip:hover { background: rgba(255, 255, 255, .07); color: var(--ink, #f6eff4); }

.chip[aria-pressed="true"], .chipActive {
  border-color: rgba(232, 121, 169, .38);
  background: rgba(232, 121, 169, .13);
  color: #f7c9de;
}

/* ------------------------------------------------------------ select ---- */

.selectField { display: flex; min-width: 0; flex-direction: column; gap: 7px; }
.selectLabel {
  color: var(--muted, #a99cab);
  font-size: 10px;
  font-weight: 600;
}
.selectTrigger {
  width: 100%;
  min-width: 0;
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 12px;
  border: 1px solid var(--edge, rgba(255, 255, 255, .1));
  border-radius: var(--ui-radius-control);
  background: rgba(18, 15, 19, .96);
  color: var(--ink, #f6eff4);
  text-align: left;
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease;
}
.selectTrigger:hover, .selectTrigger[aria-expanded="true"] {
  border-color: rgba(232, 121, 169, .35);
  background: rgba(31, 24, 31, .98);
}
.selectTrigger:focus-visible { outline: 2px solid #f0a6c6; outline-offset: 2px; }
.selectTrigger:disabled { opacity: .5; cursor: not-allowed; }
.selectTrigger > span { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 2px; }
.selectTrigger strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
.selectTrigger small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--faint, #776a73); font-size: 9px; }
.selectChevron, .selectChevronOpen { flex: none; color: #c49aad; transition: transform .18s ease; }
.selectChevronOpen { transform: rotate(180deg); }

.selectCompact { width: auto; }
.selectCompact .selectTrigger { min-height: 38px; padding: 7px 10px; }

.selectRow { width: 100%; gap: 0; }
.selectRow .selectTrigger {
  min-height: 66px;
  padding: 11px 13px;
  background: rgba(255, 255, 255, .025);
}
.selectRowIcon {
  display: grid !important;
  place-items: center;
  flex: 0 0 34px !important;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: rgba(232, 121, 169, .1);
  color: #f0a6c6;
}
.selectRowCopy { gap: 3px !important; }
.selectRowCopy em {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--faint, #776a73);
  font-size: 9px;
  font-style: normal;
  font-weight: 650;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.selectRowCopy strong { font-size: 11.5px; }

.selectMenu {
  position: fixed;
  z-index: 120;
  overflow: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 6px;
  border: 1px solid rgba(255, 255, 255, .13);
  border-radius: 14px;
  background: rgba(25, 20, 26, .98);
  box-shadow: 0 22px 64px rgba(0, 0, 0, .55);
  backdrop-filter: blur(18px);
}
.selectOption {
  display: flex;
  width: 100%;
  min-width: 0;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 11px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  color: var(--ink, #f6eff4);
  text-align: left;
  cursor: pointer;
}
.selectOption > span { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 3px; }
.selectOption strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
.selectOption small { color: var(--muted, #a99cab); font-size: 9px; line-height: 1.4; }
.selectOption > svg { flex: none; color: #f0a6c6; }
.selectOption:hover, .selectOptionActive {
  border-color: rgba(232, 121, 169, .2);
  background: rgba(232, 121, 169, .1);
}
.selectOption:focus-visible { outline: 2px solid #f0a6c6; outline-offset: -1px; }

/* ---------------------------------------------------- settings choice ---- */

.settingsChoiceRow {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) 16px;
  align-items: center;
  gap: 11px;
  width: 100%;
  min-width: 0;
  min-height: 66px;
  padding: 11px 13px;
  border: 1px solid var(--edge, rgba(255, 255, 255, .1));
  border-radius: var(--ui-radius-control);
  background: rgba(255, 255, 255, .025);
  color: var(--ink, #f6eff4);
  text-align: left;
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease;
}
.settingsChoiceRow:hover {
  border-color: rgba(232, 121, 169, .35);
  background: rgba(232, 121, 169, .08);
}
.settingsChoiceRow:focus-visible { outline: 2px solid #f0a6c6; outline-offset: 2px; }
.settingsChoiceRow > svg { flex: none; color: var(--faint, #776a73); }
.settingsChoiceIcon {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: rgba(232, 121, 169, .1);
  color: #f0a6c6;
}
.settingsChoiceCopy { display: flex; min-width: 0; flex-direction: column; gap: 4px; }
.settingsChoiceCopy strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--faint, #776a73);
  font-size: 9px;
  font-weight: 650;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.settingsChoiceCopy small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink, #f6eff4);
  font-size: 11.5px;
}

.uiSrOnly {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

@media (prefers-reduced-motion: reduce) {
  .iconButton, .button, .chip, .selectTrigger, .selectChevron, .selectChevronOpen, .settingsChoiceRow { transition: none; }
  .iconButton:active, .button:active { transform: none; }
}

/* ===== rich.module.css ===== */
/*
 * Rich content.
 *
 * Editorial rather than decorative: an image sits in the measure of the text
 * around it, at the text's own width, with a thin border and the same corner
 * radius as every other surface in the product. Mobile is the primary target,
 * so the default is full content width and nothing is ever wider than that.
 */

.content { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.paragraph {
  margin: 0;
  /* The creator's line breaks are theirs. Preserved by layout, never by
     turning their prose into markup. */
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.figure {
  margin: 2px 0;
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 0;
}
.figure img {
  display: block;
  width: 100%;
  /* Never wider than its column, and never taller than a screenful: a portrait
     image must not push the text that follows it off the page. */
  max-width: 100%;
  max-height: 72vh;
  height: auto;
  object-fit: contain;
  border-radius: 14px;
  border: 1px solid var(--line, rgba(255, 255, 255, .085));
  background: rgba(255, 255, 255, .02);
}
.figure figcaption {
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--muted, #a99cab);
  text-align: center;
  overflow-wrap: anywhere;
}

/* Inside an already-narrow column — a chat bubble — an image reads better
   inset than edge to edge. */
.inset img { max-height: 52vh; }

@media (min-width: 900px) {
  .figure img { max-height: 60vh; }
}

/*
 * An image inside a chat message.
 *
 * Narrower and tighter than one in a page: a message bubble is already a
 * column inside a column, and a full-bleed image would break the rhythm of
 * the conversation around it.
 */
.messageFigure { margin: 10px 0 4px; }
.messageFigure img { max-height: 44vh; border-radius: 12px; }

/* ===== feed.module.css (f- prefixed) ===== */
/*
 * Discovery feed.
 *
 * Same design language as the public creation page: near-black ground with a
 * warm undertone, faint white edges, one pink→violet accent used sparingly,
 * serif for titles and sans for everything dense. The artwork supplies the
 * colour; the chrome stays quiet so a wall of covers does not fight itself.
 *
 * The mobile grid is two columns by construction rather than by an auto-fill
 * minimum, because two cards per row is the composition, not a side effect of
 * however wide the phone happens to be.
 */

.f-feed {
  --surface: #17131a;
  --surface-raised: #1c1620;
  --edge: rgba(255, 255, 255, .07);
  --edge-strong: rgba(255, 255, 255, .12);
  --ink: #f6eff4;
  --muted: #a99cab;
  --faint: #7b6f7e;
  --accent: #e879a9;
  --accent-soft: #b892f0;
  height: 100dvh;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  background: radial-gradient(circle at 72% -6%, rgba(123, 50, 80, .16), transparent 38%), #100d11;
  color: var(--ink);
  /* The phone's home indicator and Safari's chrome both live down there. */
  padding-bottom: calc(28px + env(safe-area-inset-bottom));
}

/* --------------------------------------------------------------- header --- */

.f-head {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: calc(16px + env(safe-area-inset-top)) var(--gutter, 16px) 10px;
}
.f-eyebrow {
  text-transform: uppercase;
  letter-spacing: .14em;
  font-size: 9.5px;
  color: var(--faint);
}
.f-title {
  margin: 0;
  font-family: var(--font-serif), Georgia, serif;
  font-size: clamp(30px, 8vw, 40px);
  font-weight: 600;
  letter-spacing: -.01em;
  line-height: 1.05;
  display: flex;
  align-items: center;
  gap: 8px;
}
.f-titleSpark { color: var(--accent); flex: none; }
.f-lede { display: none; margin: 4px 0 0; max-width: 58ch; color: var(--muted); font-size: 11.5px; line-height: 1.55; }

/*
 * The controls stay reachable while the grid scrolls under them. Only the
 * search row and the tabs are sticky — roughly 80px — so the feed keeps the
 * screen it needs on a phone.
 */
.f-controls {
  position: sticky;
  top: 0;
  z-index: 4;
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 8px var(--gutter, 16px) 10px;
  background: linear-gradient(#100d11 62%, rgba(16, 13, 17, .82));
  backdrop-filter: blur(14px);
  border-bottom: 1px solid transparent;
}
.f-controlsStuck { border-bottom-color: var(--edge); }

.f-controlRow { display: flex; align-items: center; gap: 8px; }

/*
 * Placement only. The control itself is the shared rounded-square icon button
 * (src/components/ui) — this rule decides where it sits and when it shows,
 * because on a wide screen the sidebar is already visible and a menu control
 * would be a second way to reach the same thing.
 */
.f-menuButton { display: none; }

.f-search {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  height: 40px;
  padding: 0 12px;
  border: 1px solid var(--edge);
  border-radius: 12px;
  background: var(--surface);
  color: var(--faint);
  transition: border-color .18s, background .18s;
}
/*
 * One focus treatment, on the control the reader sees.
 *
 * The search field is a rounded pill with an input inside it, and the global
 * `input:focus-visible` rule drew a second, square, 2px rose outline around
 * that inner input — the rectangle inside the control. It won on source order,
 * not on intent: a CSS module and globals.f-css have identical specificity here
 * (0,1,1), and Next emits the module chunk first.
 *
 * So the reset below is pinned to `:focus-visible` as well, which makes it
 * (0,2,1) and settles the question by specificity rather than by whatever
 * order the bundler happens to emit. The focus state itself moves to the pill,
 * where it follows the pill's own radius: a lit border for any focus, plus a
 * ring for keyboard focus, so the state is never removed — only relocated.
 */
.f-search:focus-within { border-color: rgba(232, 121, 169, .42); background: var(--surface-raised); }
.f-search:has(:focus-visible) {
  border-color: var(--accent, #e879a9);
  box-shadow: 0 0 0 3px rgba(232, 121, 169, .22);
}
.f-search input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  outline: none;
}
.f-search input:focus,
.f-search input:focus-visible { outline: none; box-shadow: none; }
.f-search input::placeholder { color: var(--faint); }
/* WebKit decorates type="search" with its own control. This field already has
   a real Clear button beside it, so the native one is a second, unstyled copy. */
.f-search input::-webkit-search-decoration,
.f-search input::-webkit-search-cancel-button,
.f-search input::-webkit-search-results-button,
.f-search input::-webkit-search-results-decoration { -webkit-appearance: none; appearance: none; }
.f-clearSearch {
  flex: none;
  display: grid; place-items: center;
  width: 26px; height: 26px;
  border: 0; border-radius: 8px;
  background: transparent; color: var(--muted); cursor: pointer;
}
.f-clearSearch:hover { background: rgba(255, 255, 255, .06); color: var(--ink); }

.f-filterButton {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 40px;
  padding: 0 13px;
  border: 1px solid var(--edge);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink);
  font-size: 12px;
  cursor: pointer;
  transition: border-color .18s, background .18s;
}
.f-filterButton:hover { border-color: var(--edge-strong); background: var(--surface-raised); }
.f-filterButtonActive { border-color: rgba(232, 121, 169, .42); background: rgba(232, 121, 169, .1); color: #ffd9ea; }
.f-filterCount {
  display: grid; place-items: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 999px;
  background: var(--accent); color: #2a1020;
  font-size: 10px; font-weight: 700;
}
.f-filterButtonLabel { display: none; }

/* The tab strip scrolls sideways rather than wrapping onto a second line. */
.f-tabs {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 calc(var(--gutter, 16px) * -1);
  padding: 0 var(--gutter, 16px);
}
.f-tabs::-webkit-scrollbar { display: none; }
.f-tab {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 33px;
  padding: 0 14px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  cursor: pointer;
  transition: color .18s, border-color .18s, background .18s;
}
.f-tab:hover { color: var(--ink); border-color: var(--edge-strong); }
.f-tabActive {
  color: #ffe2ef;
  border-color: rgba(232, 121, 169, .4);
  background: linear-gradient(96deg, rgba(232, 121, 169, .18), rgba(168, 116, 240, .16));
}

/* Chips summarising what the filter sheet is currently doing. */
.f-activeFilters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 var(--gutter, 16px) 12px; }
.f-activeChip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 30px; padding: 0 6px 0 11px;
  border: 1px solid rgba(232, 121, 169, .3);
  border-radius: 999px;
  background: rgba(232, 121, 169, .09);
  color: #f3d5e4;
  font-size: 11px;
  cursor: pointer;
}
.f-activeChip:hover { background: rgba(232, 121, 169, .16); }
.f-clearAll {
  min-height: 30px; padding: 0 11px;
  border: 1px solid var(--edge); border-radius: 999px;
  background: transparent; color: var(--muted); font-size: 11px; cursor: pointer;
}
.f-clearAll:hover { color: var(--ink); border-color: var(--edge-strong); }

/* ----------------------------------------------------------------- grid --- */

.f-grid {
  display: grid;
  /* Two per row on a phone. Not negotiable by viewport width. */
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  padding: 2px var(--gutter, 16px) 0;
  align-items: stretch;
}

/* ----------------------------------------------------------------- card --- */

.f-card {
  --accent-card: var(--accent);
  position: relative;
  display: flex;
  min-width: 0;
  border: 1px solid var(--edge);
  border-radius: 16px;
  background: var(--surface);
  overflow: hidden;
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
/*
 * The creation's accent, at rest and on hover.
 *
 * The rule that keeps the feed from becoming a rainbow: artwork stays
 * dominant and the accent is an edge, a faint wash under the copy and a glow
 * that appears when the card is reached for. A grid of cards in eight
 * different colours still reads as one grid, because the surface underneath
 * every one of them is the same near-black.
 */
.f-card {
  border-color: color-mix(in srgb, var(--creation-accent-border, transparent) 45%, var(--edge));
  background:
    linear-gradient(to top, var(--creation-accent-surface, var(--surface)) 0%, var(--surface) 46%);
}
.f-card:hover {
  transform: translateY(-3px);
  border-color: var(--creation-accent-border, rgba(232, 121, 169, .3));
  box-shadow: 0 18px 40px rgba(0, 0, 0, .38), 0 6px 26px var(--creation-accent-glow, transparent);
}
.f-card:focus-within { border-color: var(--creation-accent-border, rgba(232, 121, 169, .4)); }

/*
 * The card body, and the link that covers it.
 *
 * The body is a plain element so the byline inside it can be a link to the
 * creator; the title's anchor stretches over the whole card with a
 * pseudo-element, which keeps "tap anywhere to open the creation" true while
 * leaving exactly one anchor in the accessibility tree for it.
 */
.f-cardBody {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  color: inherit;
}
.f-cardLink { color: inherit; text-decoration: none; }
.f-cardLink::after { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: 15px; }
.f-cardLink:focus-visible::after { outline: 2px solid var(--creation-accent-readable, var(--accent)); outline-offset: -2px; }

.f-cover {
  position: relative;
  /* Portrait, but not a poster: two of these still leave room for the copy. */
  aspect-ratio: 3 / 4;
  overflow: hidden;
  background: linear-gradient(150deg, var(--creation-accent-deep, #2b2028), var(--creation-accent-surface, #141115) 72%, #141115);
}
.f-cover img {
  width: 100%;
  height: 100%;
  /* Uploaded art is never cropped on disk; the frame crops it, biased upward
     the way the creation page's hero does, so faces survive a 3:4 window. */
  object-fit: cover;
  object-position: 50% 25%;
  display: block;
  transition: transform .35s ease;
}
.f-card:hover .f-cover img { transform: scale(1.035); }
.f-coverFallback {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-family: var(--font-serif), Georgia, serif;
  font-size: 44px;
  color: color-mix(in srgb, var(--accent-card) 70%, #ffffff);
  opacity: .5;
}
/* A gradient, not a panel: the badges stay legible and the art stays vivid. */
.f-coverScrim {
  position: absolute; inset: 0;
  background:
    /* The accent enters where the art meets the copy, so the two halves of the
       card belong to each other instead of being a picture above a panel. */
    linear-gradient(to bottom, transparent 58%, var(--creation-accent-glow, transparent) 100%),
    linear-gradient(to bottom, rgba(8, 6, 9, .5) 0%, transparent 32%, transparent 62%, rgba(20, 16, 21, .72) 100%);
  pointer-events: none;
}

.f-coverBadges { position: absolute; top: 8px; left: 8px; display: flex; gap: 5px; max-width: calc(100% - 60px); }
.f-badge {
  display: inline-flex; align-items: center; gap: 4px;
  height: 21px; padding: 0 7px;
  border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 7px;
  background: rgba(12, 9, 13, .62);
  backdrop-filter: blur(10px);
  font-size: 9.5px; font-style: normal; font-weight: 600; letter-spacing: .04em;
  color: #e7dbe4;
  white-space: nowrap;
  overflow: hidden;
}
.f-badgeAdult { color: #ffc4dd; border-color: rgba(232, 121, 169, .4); background: rgba(48, 14, 31, .66); }

.f-saveButton {
  position: absolute;
  top: 6px; right: 6px;
  /* Above the title's stretched link, which covers the whole card. */
  z-index: 3;
  display: grid; place-items: center;
  width: 38px; height: 38px;
  border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 11px;
  background: rgba(12, 9, 13, .58);
  backdrop-filter: blur(10px);
  color: #ece0e8;
  cursor: pointer;
  transition: background .18s, border-color .18s, color .18s, transform .18s;
}
.f-saveButton:hover { background: rgba(232, 121, 169, .2); border-color: rgba(232, 121, 169, .42); color: #ffd9ea; }
.f-saveButton:active { transform: scale(.92); }
.f-saveButton:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.f-saveButtonSaved {
  color: #ffd9ea;
  border-color: rgba(232, 121, 169, .55);
  background: linear-gradient(140deg, rgba(232, 121, 169, .34), rgba(168, 116, 240, .28));
}
.f-saveButton svg { transition: transform .18s ease; }
.f-saveButtonSaved svg { transform: translateY(-1px); }

.f-copy {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 10px 11px 11px;
}

.f-byline {
  display: flex; align-items: center; gap: 5px;
  min-width: 0;
  font-size: 9.5px; color: var(--faint);
}
/* Above the stretched link, so the creator's name is reachable on a card
   whose whole surface opens the creation. */
.f-bylineLink {
  position: relative; z-index: 2;
  align-self: flex-start; max-width: 100%;
  text-decoration: none; border-radius: 8px;
}
.f-bylineLink:hover { color: #f0a6c6; }
.f-bylineLink:focus-visible { outline: 2px solid var(--creation-accent-readable, var(--accent)); outline-offset: 2px; }
.f-bylineAvatar {
  flex: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  object-fit: cover;
  background: rgba(255, 255, 255, .08);
}
.f-bylineName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.f-cardTitle {
  margin: 0;
  /* The anchor is the title, so it inherits the title's type rather than
     bringing an anchor's own. */
  font-family: var(--font-serif), Georgia, serif;
  font-size: 16.5px;
  font-weight: 600;
  line-height: 1.22;
  letter-spacing: -.005em;
  color: var(--ink);
  /* Two lines, then an ellipsis: one long title can never push its neighbour
     out of alignment. */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}

.f-tagline {
  margin: 0;
  font-size: 11px;
  line-height: 1.45;
  color: var(--muted);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}

/*
 * A single row of platform tags, never a wall. The row cannot wrap, so however
 * many tags a creation carries the card is exactly as tall as it would be with
 * one.
 */
.f-tags {
  display: flex;
  flex-wrap: nowrap;
  gap: 4px;
  margin: 1px 0 0;
  padding: 0;
  list-style: none;
  min-width: 0;
}
.f-tags li {
  /* The first tag keeps its full word; a second one gives way to it rather
     than both being cut in half. */
  flex: 0 1 auto;
  min-width: 0;
  padding: 3px 7px;
  border: 1px solid rgba(232, 121, 169, .24);
  border-radius: 999px;
  background: rgba(232, 121, 169, .09);
  color: #e5b9cf;
  font-size: 9.5px;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.f-tags li:first-child { flex-shrink: 0; max-width: 64%; }
.f-tagMore { flex: none; border-color: var(--edge) !important; background: rgba(255, 255, 255, .04) !important; color: var(--faint) !important; }

.f-metrics {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: auto;
  padding-top: 8px;
  color: var(--faint);
  font-size: 10.5px;
}
.f-metric { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
.f-metric svg { flex: none; opacity: .85; }
.f-metricSaved { color: var(--accent); }
/* Visible only to assistive technology: "12.5K" alone says nothing about what
   was counted, and the icon beside it is decorative. */
.f-srOnly {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* ------------------------------------------------------------- skeleton --- */

.f-skeleton { border: 1px solid var(--edge); border-radius: 16px; background: var(--surface); overflow: hidden; }
.f-skeletonCover { aspect-ratio: 3 / 4; background: linear-gradient(150deg, #221b26, #17131a); }
.f-skeletonCopy { display: flex; flex-direction: column; gap: 7px; padding: 12px 11px 14px; }
.f-skeletonLine { height: 10px; border-radius: 5px; background: rgba(255, 255, 255, .06); }
.f-skeletonLineShort { width: 55%; }
.f-skeletonLineTall { height: 14px; width: 78%; }
.f-shimmer { position: relative; overflow: hidden; }
.f-shimmer::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, .05) 50%, transparent 80%);
  animation: sweep 1.5s linear infinite;
}
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* --------------------------------------------------------------- states --- */

.f-state {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  padding: 46px 22px;
  border: 1px dashed var(--edge);
  border-radius: 16px;
  text-align: center;
}
.f-stateIcon { color: var(--accent); opacity: .8; }
.f-state h2 { margin: 0; font-family: var(--font-serif), Georgia, serif; font-size: 22px; font-weight: 600; }
.f-state p { margin: 0; max-width: 44ch; color: var(--muted); font-size: 12px; line-height: 1.55; }
.f-stateAction {
  margin-top: 4px;
  min-height: 38px; padding: 0 16px;
  border: 1px solid rgba(232, 121, 169, .34);
  border-radius: 11px;
  background: rgba(232, 121, 169, .1);
  color: #ffd9ea; font-size: 12px; cursor: pointer;
}
.f-stateAction:hover { background: rgba(232, 121, 169, .17); }

.f-toast {
  position: fixed;
  left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom));
  z-index: 40;
  display: flex; align-items: center; gap: 10px;
  max-width: min(440px, calc(100vw - 32px));
  padding: 11px 12px 11px 15px;
  border: 1px solid rgba(232, 121, 169, .28);
  border-radius: 13px;
  background: rgba(31, 22, 30, .96);
  box-shadow: 0 20px 50px rgba(0, 0, 0, .5);
  color: var(--ink); font-size: 12px;
}
.f-toast button { border: 0; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; }

.f-loadMore {
  display: block;
  margin: 20px auto 6px;
  min-height: 42px; padding: 0 22px;
  border: 1px solid var(--edge); border-radius: 12px;
  background: var(--surface); color: var(--ink); font-size: 12.5px; cursor: pointer;
}
.f-loadMore:hover { border-color: rgba(232, 121, 169, .34); background: var(--surface-raised); }
.f-sentinel { height: 1px; }
.f-endNote { margin: 22px 0 4px; text-align: center; color: var(--faint); font-size: 10.5px; }

/* --------------------------------------------------------------- sheet --- */

.f-sheetBackdrop {
  position: fixed; inset: 0; z-index: 60;
  display: grid; align-items: end; justify-items: stretch;
  background: rgba(6, 4, 7, .72);
  backdrop-filter: blur(6px);
}
.f-sheet {
  display: flex; flex-direction: column;
  max-height: 84dvh;
  border: 1px solid var(--edge); border-bottom: 0;
  border-radius: 20px 20px 0 0;
  background: #171319;
  color: var(--ink);
  box-shadow: 0 -20px 60px rgba(0, 0, 0, .5);
  animation: rise .22s ease-out;
}
@keyframes rise { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }
.f-sheetHead {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--edge);
}
.f-sheetHead h2 { margin: 0; font-family: var(--font-serif), Georgia, serif; font-size: 23px; font-weight: 600; }
.f-sheetClose {
  display: grid; place-items: center;
  width: 36px; height: 36px;
  border: 1px solid var(--edge); border-radius: 10px;
  background: transparent; color: var(--muted); cursor: pointer;
}
.f-sheetClose:hover { color: var(--ink); border-color: var(--edge-strong); }
/* The adult groups made this list long enough to scroll properly, so the body
   owns its own momentum and keeps a gap under the last row that the sticky
   footer would otherwise sit on top of. */
.f-sheetBody {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 18px;
}
.f-sheetGroup { display: flex; flex-direction: column; gap: 8px; }
.f-sheetGroup > h3 {
  display: flex; align-items: center; gap: 7px;
  margin: 0; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.f-sheetGroup > p { margin: -3px 0 2px; font-size: 11px; line-height: 1.5; color: var(--faint); }
.f-chipRow { display: flex; flex-wrap: wrap; gap: 7px; }
.f-chip {
  min-height: 34px; padding: 7px 12px;
  border: 1px solid var(--edge); border-radius: 999px;
  background: transparent; color: var(--muted);
  font-size: 12px; cursor: pointer;
  transition: color .16s, border-color .16s, background .16s;
}
.f-chip:hover { color: var(--ink); border-color: var(--edge-strong); }
.f-chipSelected { color: #ffe2ef; border-color: rgba(232, 121, 169, .45); background: rgba(232, 121, 169, .13); }
.f-sheetToggle {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 12px 13px;
  border: 1px solid var(--edge); border-radius: 13px;
  background: var(--surface);
  cursor: pointer;
}
.f-sheetToggle strong { display: block; font-size: 12.5px; font-weight: 600; }
.f-sheetToggle small { display: block; margin-top: 3px; color: var(--faint); font-size: 10.5px; line-height: 1.45; }
.f-sheetToggle input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.f-sheetHelp, .f-sheetWarning {
  margin: 0; padding: 9px 11px;
  border-radius: 11px; font-size: 11px; line-height: 1.5;
}
.f-sheetHelp { border: 1px solid rgba(232, 121, 169, .22); background: rgba(232, 121, 169, .08); color: #f0d3e2; }
.f-sheetWarning { border: 1px solid rgba(232, 121, 169, .38); background: rgba(232, 121, 169, .13); color: #ffe2ef; }
.f-sheetWarning strong { font-weight: 650; }

/* Adult marking. A word rather than a colour, so the restriction survives a
   monochrome display and reaches a screen reader through the chip's label. */
.f-adultBadge {
  padding: 2px 6px;
  border: 1px solid rgba(232, 121, 169, .4); border-radius: 999px;
  background: rgba(232, 121, 169, .12); color: var(--accent);
  font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: none;
}
.f-chipAdult { display: inline-flex; align-items: center; gap: 6px; text-align: left; }
/* Long labels such as "CNC / Non-consent Fantasy" wrap inside the chip rather
   than shrinking the text or pushing the sheet sideways. */
.f-chipAdult, .f-chip { max-width: 100%; white-space: normal; }
.f-chipAdultMark {
  flex: none;
  padding: 1px 5px;
  border-radius: 999px; background: rgba(232, 121, 169, .16); color: var(--accent);
  font-size: 9px; font-weight: 700; letter-spacing: .03em;
}
.f-chipSelected .f-chipAdultMark { background: rgba(255, 226, 239, .2); color: #ffe2ef; }
.f-sheetFoot {
  display: flex; gap: 10px;
  padding: 14px 18px calc(16px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--edge);
  background: rgba(23, 19, 25, .96);
}
.f-sheetFoot button { flex: 1; min-height: 44px; border-radius: 13px; font-size: 13px; cursor: pointer; }
.f-sheetReset { border: 1px solid var(--edge); background: transparent; color: var(--muted); }
.f-sheetReset:hover { color: var(--ink); border-color: var(--edge-strong); }
.f-sheetApply {
  border: 0;
  background: linear-gradient(96deg, #ff5fa2 0%, #e879a9 45%, #a874f0 100%);
  color: #2a1020; font-weight: 650;
}

/* ---------------------------------------------------------- breakpoints --- */

@media (min-width: 501px) {
  .f-feed { --gutter: 22px; }
}

@media (min-width: 560px) {
  .f-lede { display: block; }
  .f-grid {
    /* Above a phone the density follows the container, so the desktop shell's
       sidebar decides the column count rather than a hard-coded sequence. */
    grid-template-columns: repeat(auto-fill, minmax(186px, 1fr));
    gap: 16px;
  }
  .f-cardTitle { font-size: 17.5px; }
  .f-tagline { font-size: 11.5px; }
  .f-copy { padding: 12px 13px 13px; }
  .f-filterButtonLabel { display: inline; }
}

@media (min-width: 900px) {
  .f-feed { --gutter: clamp(24px, 4vw, 56px); }
  .f-head { padding-top: 34px; padding-bottom: 6px; }
  .f-controls { padding-top: 12px; padding-bottom: 14px; }
  .f-sheetBackdrop { place-items: center; padding: 24px; }
  .f-sheet { width: min(560px, 100%); border: 1px solid var(--edge); border-radius: 20px; max-height: min(720px, calc(100dvh - 48px)); }
  .f-sheetFoot { padding-bottom: 16px; }
}

/* The drawer trigger belongs to the phone layout, where the shell hides its
   sidebar. It is the app's existing drawer, not a new navigation. */
@media (max-width: 500px) {
  .f-menuButton { display: inline-grid; }
}

@media (prefers-reduced-motion: reduce) {
  .f-card, .f-cover img, .f-saveButton, .f-saveButton svg { transition: none; }
  .f-card:hover { transform: none; }
  .f-card:hover .f-cover img { transform: none; }
  .f-shimmer::after { animation: none; }
  .f-sheet { animation: none; }
}


/* ===========================================================================
   Demo fixups — the one global namespace the app never had to share.
   =========================================================================== */
html, body { height: 100%; overflow: hidden; }
#view { min-width: 0; min-height: 0; }

/* The fixed badge that says what this page is. */
.demo-chip {
  position: fixed; right: 14px; bottom: 12px; z-index: 60;
  padding: 6px 11px;
  border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 999px;
  background: rgba(21, 17, 26, .82);
  backdrop-filter: blur(8px);
  color: #8d8290;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 10px; font-weight: 600; line-height: 1.2; letter-spacing: .04em;
  pointer-events: none;
}

/* ui.module's .srOnly under its renamed key, for the one plain use. */
.srOnly {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Composer plus keeps the send-button geometry at every width. */
.composer-plus { flex: 0 0 39px; width: 39px; height: 39px; }

/* A memory the last reply touched, flashing where it lives in the library. */
.memoryItem.flash { animation: memoryFlash 1.15s ease-out; }
@keyframes memoryFlash {
  0% { box-shadow: 0 0 0 2px rgba(232, 121, 169, .65); background: rgba(232, 121, 169, .14); }
  100% { box-shadow: none; background: transparent; }
}

/* Quiet toasts for demo-side confirmations. */
.demo-toast {
  position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
  z-index: 70;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 12px;
  background: #241c26;
  color: #e8dfe6;
  font-size: 11.5px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, .4);
  animation: fade .15s ease-out;
}
.demo-toast button {
  display: grid; place-items: center;
  border: 0; background: none; padding: 0;
  color: inherit; opacity: .6; cursor: pointer;
}
.demo-toast button:hover { opacity: 1; }

/* ===========================================================================
   Character page (src/app/characters/[id]/profile.module.css, s- prefixed).
   Same tokens, same composition: hero over the artwork, a sticky section nav,
   a card column with the creator lifted into a right rail on wide screens,
   and the two-action bar on phones.
   =========================================================================== */
.s-page {
  --surface: #141017;
  --surface-raised: #191320;
  --edge: rgba(255, 255, 255, .07);
  --ink: #f6eff4;
  --muted: #a99cab;
  --faint: #7b6f7e;
  --accent: var(--creation-accent-readable, #e879a9);
  --accent-soft: var(--creation-accent-soft, #b892f0);
  min-height: 100dvh;
  /* Same contract as `.page`: the page is its own scroll container, so the
     shell around it never scrolls. */
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  background: #0b080d;
  color: var(--ink);
  padding-bottom: max(64px, env(safe-area-inset-bottom));
}

/* ---------------------------------------------------------------- hero --- */
.s-hero { position: relative; isolation: isolate; }
.s-heroMedia { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
.s-heroMedia img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
.s-heroGlow {
  position: absolute; inset: 0; z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(70% 34% at 50% 100%, var(--creation-accent-glow-strong, transparent), transparent 70%),
    radial-gradient(120% 58% at 50% 100%, var(--creation-accent-glow, transparent), transparent 74%);
}
.s-heroFallback {
  display: grid; place-items: center; width: 100%; height: 100%;
  padding-bottom: 44vh;
  font-family: var(--font-serif), Georgia, serif; font-size: 84px;
  color: color-mix(in srgb, var(--creation-accent, #e879a9) 34%, #ffffff);
  opacity: .34;
  background: radial-gradient(circle at 50% 32%, color-mix(in srgb, var(--creation-accent, #e879a9) 26%, #1a1220), #0b080d 70%);
}
.s-heroScrim {
  position: absolute; inset: 0;
  background:
    linear-gradient(to top, #0b080d 2%, rgba(11, 8, 13, .82) 26%, rgba(11, 8, 13, .18) 62%, rgba(11, 8, 13, .45) 100%),
    radial-gradient(120% 80% at 50% 100%, rgba(11, 8, 13, .9), transparent 60%);
}
.s-heroBar {
  position: relative; z-index: 8;
  display: flex; align-items: center; justify-content: space-between;
  padding: max(14px, env(safe-area-inset-top)) 16px 0;
}
.s-heroBarActions { display: flex; gap: 8px; position: relative; }

/* The three-dot panel, anchored to its trigger (the app portals it to the
   body and measures the same rectangle; here the bar is the anchor). */
.s-menuPanel {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 40;
  min-width: 208px; max-width: min(280px, calc(100vw - 24px));
  display: flex; flex-direction: column; gap: 2px;
  padding: 6px; border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, .1);
  background: #16111b;
  background-image: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, 0));
  backdrop-filter: blur(18px) saturate(130%);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .62), 0 0 0 1px rgba(0, 0, 0, .4);
  animation: s-menu-in .14s ease;
}
@keyframes s-menu-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.s-menuItem {
  display: flex; align-items: center; gap: 10px;
  width: 100%; min-height: 44px; padding: 0 12px;
  border: 0; border-radius: 10px; background: none;
  color: var(--ink); font-size: 13.5px; font-weight: 500; text-align: left; cursor: pointer;
  transition: background .15s;
}
.s-menuItem:hover, .s-menuItem:focus-visible { background: rgba(232, 121, 169, .13); }
.s-menuItem svg { flex: 0 0 auto; color: var(--muted); }

.s-heroCopy {
  position: relative; z-index: 2;
  min-width: 0; max-width: 100%;
  padding: 46vh 20px 26px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
}
.s-heroCopy > * { min-width: 0; max-width: 100%; }

.s-name {
  margin: 0;
  font-family: var(--font-serif), Georgia, serif;
  font-size: clamp(38px, 12vw, 60px); line-height: 1.02; font-weight: 600; letter-spacing: -.01em;
  background: linear-gradient(102deg, var(--creation-accent-bright, #ffd9ea) 4%, var(--creation-accent-readable, #e879a9) 38%, var(--creation-accent-soft, var(--accent-soft)) 96%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  min-width: 0; max-width: 100%;
  overflow-wrap: anywhere; word-break: break-word; hyphens: auto;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4;
  overflow: hidden;
}
.s-tagline {
  margin: 0; max-width: 30ch; color: #ded2dc; font-size: 15px; line-height: 1.5;
  overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden;
}
.s-heroTags { display: flex; flex-wrap: wrap; gap: 7px; margin: 2px 0 0; padding: 0; list-style: none; }
.s-heroTags li {
  border: 1px solid var(--edge); border-radius: 999px; padding: 5px 11px;
  font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: #cbbdc9;
  background: rgba(255, 255, 255, .04);
  max-width: 100%; overflow-wrap: anywhere;
}
.s-byline { margin: 2px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
.s-byline strong { color: var(--ink); font-weight: 600; }

.s-ctaRow { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 100%; margin-top: 6px; }
.s-primaryCta {
  flex: 1; min-width: 0; max-width: 100%; min-height: 52px;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  border: 0; border-radius: 15px;
  background: linear-gradient(96deg,
    var(--creation-accent-bright, #ff5fa2) 0%,
    var(--creation-accent, #e879a9) 45%,
    var(--creation-accent-soft, #a874f0) 100%);
  color: var(--creation-accent-ink, #2a1020); font-size: 15px; font-weight: 650; cursor: pointer;
  box-shadow: 0 14px 36px var(--creation-accent-glow-strong, rgba(214, 92, 158, .32));
  transition: transform .18s, box-shadow .18s, filter .18s;
}
.s-primaryCta:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 20px 50px var(--creation-accent-glow-strong, rgba(214, 92, 158, .42)); }
.s-primaryCta:active:not(:disabled) { transform: translateY(0) scale(.99); }
.s-primaryCta:disabled { filter: saturate(.55) brightness(.86); cursor: progress; }
.s-primaryCta > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-primaryCta > svg { flex: 0 0 auto; }

.s-ghostButton {
  display: grid; place-items: center; width: 52px; height: 52px; flex: 0 0 auto;
  border: 1px solid var(--edge); border-radius: 15px;
  background: rgba(255, 255, 255, .035); color: var(--ink); cursor: pointer;
  transition: background .18s, border-color .18s;
}
.s-ghostButton:hover { background: var(--creation-accent-glow, rgba(232, 121, 169, .12)); border-color: var(--creation-accent-border, rgba(232, 121, 169, .3)); }

/* Messages, saves and chats. */
.s-stats {
  display: grid;
  grid-template-columns: repeat(var(--stat-count, 3), minmax(0, 1fr));
  gap: 0;
  width: 100%; margin: 14px 0 0;
  border: 1px solid var(--edge); border-radius: 16px;
  background: rgba(20, 15, 22, .72); backdrop-filter: blur(16px);
  overflow: hidden;
}
.s-stat {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 5px;
  min-width: 0;
  padding: 13px 6px 14px;
  text-align: center;
  border-left: 1px solid var(--edge);
}
.s-stat:first-child { border-left: 0; }
.s-statLabel {
  display: flex; align-items: center; justify-content: center; gap: 5px;
  margin: 0;
  font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
  min-width: 0; overflow-wrap: anywhere;
}
.s-statLabel svg { flex: none; color: var(--creation-accent-readable, var(--accent)); opacity: .85; }
.s-stat dd {
  margin: 0;
  font-size: 18px; font-weight: 640; font-variant-numeric: tabular-nums;
  line-height: 1.1;
  color: var(--ink);
}
@media (max-width: 359px) {
  .s-statLabel span { display: none; }
  .s-stat { padding-left: 4px; padding-right: 4px; }
}

/* ------------------------------------------------------------ sections --- */
.s-sectionNav {
  position: sticky; top: 0; z-index: 6;
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  padding: 10px 16px; margin-top: 6px;
  background: rgba(11, 8, 13, .86); backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--edge);
}
.s-sectionNav::-webkit-scrollbar { display: none; }
@media (max-width: 899px) {
  .s-sectionNav {
    mask-image: linear-gradient(to right, #000 calc(100% - 34px), transparent);
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 34px), transparent);
  }
}
.s-sectionNav button {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  min-height: 40px;
  border: 0; background: none; cursor: pointer;
  padding: 8px 12px; border-radius: 10px;
  color: var(--faint); font-size: 12.5px; font-weight: 550;
  transition: color .18s, background .18s;
}
.s-sectionNav button:hover { color: var(--ink); }
.s-navActive { color: var(--ink) !important; background: rgba(232, 121, 169, .12); }

.s-body { padding: 20px 16px 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.s-body > * { min-width: 0; }

.s-card {
  border: 1px solid var(--edge); border-radius: 18px;
  background: linear-gradient(180deg, var(--surface-raised), var(--surface));
  padding: 18px; scroll-margin-top: 74px;
  min-width: 0; max-width: 100%;
  transition: box-shadow .5s ease, border-color .5s ease;
}
.s-illuminate {
  border-color: var(--creation-accent-border, rgba(232, 121, 169, .5));
  box-shadow: 0 0 0 1px var(--creation-accent-border, rgba(232, 121, 169, .3)), 0 0 34px var(--creation-accent-glow, rgba(232, 121, 169, .2));
}
.s-card > header { display: flex; align-items: center; gap: 9px; margin: 0 0 14px; color: var(--creation-accent-readable, var(--accent)); }
.s-card > header h2 { margin: 0; flex: 1; font-size: 14px; font-weight: 620; letter-spacing: .01em; color: var(--ink); }
.s-count { font-style: normal; font-size: 11px; color: var(--faint); }

/* -------------------------------------------------------------- pieces --- */
.s-prose {
  margin: 0; color: #d6c9d4; font-size: 14.5px; line-height: 1.72; white-space: pre-wrap;
  min-width: 0; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; line-clamp: 6; overflow: hidden;
}
.s-proseOpen { -webkit-line-clamp: unset; line-clamp: unset; overflow: visible; }
.s-showMore {
  display: inline-flex; align-items: center; gap: 5px; margin-top: 10px;
  border: 0; background: none; padding: 0; cursor: pointer;
  color: var(--accent); font-size: 12.5px; font-weight: 560;
}
.s-flip { transform: rotate(180deg); }

.s-tagList { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.s-tagList li {
  border: 1px solid var(--creation-accent-border, rgba(232, 121, 169, .26)); border-radius: 999px;
  background: var(--creation-accent-glow, rgba(232, 121, 169, .08));
  padding: 7px 13px; font-size: 12px; color: #f0d9e7;
  max-width: 100%; overflow-wrap: anywhere;
}
.s-hashtagList { display: flex; flex-wrap: wrap; gap: 7px 12px; margin: 12px 0 0; padding: 0; list-style: none; }
.s-hashtagList li { font-size: 12.5px; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.s-hashtagList a {
  display: inline-block; padding: 3px 2px;
  color: var(--muted); text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: color .16s, border-color .16s;
}
.s-hashtagList a:hover { color: var(--accent); border-bottom-color: rgba(232, 121, 169, .4); }
.s-hashtagList a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Creator card (components/creator/creator.module.css, s- prefixed). */
.s-creator { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.s-creatorHead { display: flex; align-items: center; gap: 13px; min-width: 0; }
.s-creatorIdentity { flex: 1; min-width: 0; display: flex; align-items: center; gap: 13px; color: inherit; }
.s-creatorAvatarRing {
  display: inline-grid; place-items: center; padding: 3px; flex: 0 0 auto;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--creation-accent-readable, #e879a9), #8a5cf6);
  box-shadow: 0 0 0 1px rgba(10, 8, 11, .8), 0 6px 22px var(--creation-accent-glow, rgba(232, 121, 169, .28));
}
.s-creatorAvatarInner {
  display: grid; place-items: center;
  width: 54px; height: 54px;
  border-radius: 50%; overflow: hidden;
  background: #1b1620; border: 2px solid #0b080d;
  font-family: var(--font-serif), Georgia, serif; font-size: 19px; color: #efe2ea; letter-spacing: .02em;
}
.s-creatorCopy { display: flex; flex-direction: column; gap: 3px; min-width: 0; align-items: flex-start; }
.s-creatorCopy strong {
  font-family: var(--font-serif), Georgia, serif;
  font-size: 17px; line-height: 1.2; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
}
.s-creatorCopy small {
  font-size: 11px; color: #9b8fa0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
}
.s-creatorAction {
  flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 0 15px;
  border: 1px solid rgba(232, 121, 169, .34);
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(232, 121, 169, .2), rgba(138, 92, 246, .16));
  color: #ffd9ea; text-decoration: none;
  font-size: 11.5px; font-weight: 600;
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease;
}
.s-creatorAction:hover { background: linear-gradient(135deg, rgba(232, 121, 169, .3), rgba(138, 92, 246, .24)); }
.s-creatorAction:focus-visible { outline: 2px solid #f0a6c6; outline-offset: 2px; }
.s-creatorActionOn { background: rgba(255, 255, 255, .05); border-color: var(--edge, rgba(255, 255, 255, .12)); color: #cbbcc6; }
.s-creatorStats {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px; margin: 0;
  padding: 12px 4px;
  border-block: 1px solid var(--edge, rgba(255, 255, 255, .08));
}
.s-creatorStats > div { display: flex; flex-direction: column-reverse; gap: 3px; min-width: 0; text-align: center; }
.s-creatorStats dt {
  font-size: 9px; letter-spacing: .05em; text-transform: uppercase; color: #9b8fa0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.s-creatorStats dd {
  margin: 0;
  font-family: var(--font-serif), Georgia, serif;
  font-size: 19px; line-height: 1.1; color: var(--ink);
  white-space: nowrap;
}
@media (max-width: 420px) {
  .s-creatorHead { flex-wrap: wrap; }
  .s-creatorAction { width: 100%; }
  .s-creatorCopy strong { font-size: 16px; }
  .s-creatorStats dd { font-size: 17px; }
}

/* Comments. */
.s-composer { display: grid; gap: 8px; margin-bottom: 16px; }
.s-composer textarea {
  width: 100%; resize: vertical; min-height: 62px;
  border: 1px solid var(--edge); border-radius: 13px;
  background: #100c13; color: var(--ink);
  padding: 12px 13px; font: inherit; font-size: 13.5px; line-height: 1.55;
}
.s-composer textarea:focus { outline: none; border-color: rgba(232, 121, 169, .4); }
.s-postButton {
  justify-self: end; border: 0; border-radius: 11px; cursor: pointer;
  background: linear-gradient(96deg, #e879a9, #a874f0);
  color: #2a1020; font-size: 12.5px; font-weight: 620; padding: 9px 18px;
}
.s-postButton:disabled { opacity: .4; cursor: not-allowed; }
.s-comments { display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
.s-comments li { display: flex; gap: 11px; }
.s-commentAvatar {
  display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 auto;
  border-radius: 50%; overflow: hidden;
  background: rgba(232, 121, 169, .12); border: 1px solid rgba(232, 121, 169, .22);
  color: var(--accent); font-size: 11px; font-weight: 600;
}
.s-commentMeta { display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px; }
.s-commentMeta strong { font-size: 12.5px; }
.s-commentMeta time { font-size: 11px; color: var(--faint); }
.s-commentBody { margin: 0; font-size: 13.5px; line-height: 1.6; color: #d3c6d1; white-space: pre-wrap; min-width: 0; overflow-wrap: anywhere; }
.s-comments li > div { min-width: 0; flex: 1; }
.s-quiet { margin: 0; font-size: 12.5px; color: var(--faint); }

/* --------------------------------------------------------------- toast --- */
.s-toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: max(20px, env(safe-area-inset-bottom)); z-index: 75;
  display: flex; align-items: center; gap: 14px;
  border: 1px solid rgba(238, 104, 137, .38); border-radius: 12px;
  background: #3a2028; color: #f6dbe3; padding: 11px 15px; font-size: 12.5px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, .5);
}
.s-toast button { border: 0; background: none; color: inherit; font-size: 16px; cursor: pointer; }

/* -------------------------------------------------------------- report --- */
.s-reportBackdrop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 18px; background: rgba(8, 5, 9, .78); backdrop-filter: blur(8px); }
.s-reportModal { position: relative; width: min(520px, 100%); max-height: calc(100dvh - 36px); overflow: auto; padding: 28px; border: 1px solid rgba(255, 255, 255, .12); border-radius: 22px; background: #211920; box-shadow: 0 30px 90px rgba(0, 0, 0, .55); }
.s-reportClose { position: absolute; right: 16px; top: 16px; display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .06); color: var(--muted); cursor: pointer; }
.s-reportEyebrow { color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.s-reportModal h2 { margin: 7px 38px 7px 0; font-family: var(--font-serif), Georgia, serif; font-size: 25px; font-weight: 600; }
.s-reportIntro, .s-reportSuccess p { color: var(--muted); font-size: 13px; line-height: 1.55; margin: 0; }
.s-reportReasons { display: grid; gap: 7px; margin: 20px 0; padding: 0; border: 0; }

      { id: "rla2", start: 15, end: 31, summary: "Ordinary life: the market, the neighbours, and the locked box in the wardrobe." }
    ],
    replies: [
      { uses: ["rl3", "rl4"], arcs: ["rla1"], text: "*Priya doesn't look up from the glass she's drying.* \u201cCorner's free. It's always free \u2014 that's what makes it yours.\u201d *The dog by the radiator opens one eye, judges you, and closes it again.* \u201cSam saved you a seat. Said you looked like somebody counting their last week before you even got off the bus.\u201d" },
      { uses: ["rl5"], arcs: [], text: "*Your phone has been face-down on the windowsill for nine days, which is a record, and the town seems to know it.* \u201cMonth's the deal you made with yourself,\u201d *says Sam, sliding into the booth uninvited.* \u201cFourteen days is a fortnight. A fortnight is a habit forming. Don't break it over something that didn't even come to the station to see you off.\u201d" },
      { uses: ["rl6", "rl2"], arcs: ["rla2"], text: "*Mr. Odell waits until you mention the box, then takes a long time to pretend the kettle is broken.* \u201cLandlord's shortcut is to lose the key and call it character in the property,\u201d *he says at last.* \u201cBut that one came with the flat, and the last tenant\u2026 she left in a hurry. Paid up, though. Paid up to the quarter.\u201d" },
      { uses: ["rl1"], arcs: ["rla1"], text: "*The high street at five in the afternoon is just people going home, and you are one of them now, which was rather the point.* \u201cYou get used to it,\u201d *Priya said once, of being new.* \u201cAshcombe forgets where you came from faster than you do. That's either the nice thing about it or the frightening thing. Depends on what you came from.\u201d" }
    ],
    stories: [
      { id: "mill-lane", title: "Number four, Mill Lane", msgCount: 34, personaId: null, updated: hours(4), hasEarlier: true,
        earlier: [
          { id: "ml-pre1", role: "user", content: "Does the bus really run past eleven?", at: hours(6) },
          { id: "ml-pre2", role: "assistant", content: "\u201cIf you ask nicely and tip well,\u201d Sam says. \u201cThe 14 doesn't run. Sam runs. Different service.\u201d", at: hours(6) }
        ],
        messages: [
          { id: "ml1", role: "assistant", content: "*The tenancy office smells of carpet cleaner and instant coffee, and the man behind the desk slides a set of keys across it without looking up from his screen.* \u201cNumber four, Mill Lane. Water's hot, bins are Tuesdays, and the neighbours will have already decided about you by Friday.\u201d *Outside, the bus that brought you here pulls away, and with it goes the version of your life you came here to leave.* \u201cOne more thing \u2014 nobody here needs to know why you moved. Plenty of us came for reasons. Most are better left in the last town.\u201d", at: hours(7), memoryIds: ["rl1"], arcIds: ["rla1"] },
          { id: "ml2", role: "user", content: "Two suitcases and a set of keys. That's the whole inventory.", at: hours(7) },
          { id: "ml3", role: "assistant", content: "*Mr. Odell finally looks up.* \u201cInventory of the flat, or of you?\u201d *He does not wait for the answer.* \u201cFlat's got a wardrobe, a kettle that works, and a box I'm not allowed to open either. You've got a fortnight's grace on the rent and a face I haven't seen before \u2014 in Ashcombe that makes you practically family.\u201d", at: hours(7), memoryIds: ["rl2"], arcIds: [] },
          { id: "ml4", role: "user", content: "What's the town like, honestly?", at: hours(6) },
          { id: "ml5", role: "assistant", content: "*The Ferryman's Rest is four tables, one dartboard and a dog of unknown ownership.* \u201cHonestly?\u201d *Priya sets down a glass that wasn't ordered.* \u201cIt's a river town. The river goes one way, the gossip goes the other, and everyone under forty leaves at least once. The ones who come back\u2026 they're the ones worth knowing. Sit wherever.\u201d", at: hours(6), memoryIds: ["rl3"], arcIds: [] },
          { id: "ml6", role: "user", content: "And the box in the wardrobe?", at: hours(5) },
          { id: "ml7", role: "assistant", content: "*You could swear the kettle in the office chose that exact moment to work.* \u201cTenants' things stay ninety days,\u201d *Mr. Odell says, which is not an answer.* \u201cAfter that it's the landlord's problem, and the landlord is being very patient about his problem. Ask me again in March.\u201d", at: hours(5), memoryIds: ["rl6"], arcIds: ["rla2"] }
        ] },
      { id: "ferryman", title: "Last orders at the Ferryman's Rest", msgCount: 12, personaId: "juniper", updated: days(6), hasEarlier: false, earlier: [], messages: [
          { id: "fs1", role: "assistant", content: "*Last orders is a suggestion in the Ferryman's Rest; Priya pours anyway.* \u201cYou'll want the corner,\u201d *she says, already reaching for the glass you haven't asked for.* \u201cSam's told everyone you moved in. Nobody's called. That's Ashcombe for you \u2014 suspense with a fortnight's grace.\u201d", at: days(6), memoryIds: ["rl4"], arcIds: [] },
          { id: "fs2", role: "user", content: "Called about what?", at: days(6) },
          { id: "fs3", role: "assistant", content: "\u201cThe box, presumably.\u201d *She wipes a ring off the bar that was not there.* \u201cOld tenants leave things, new tenants ask about them, and the landlord develops a very selective kettle problem. You'll get an answer. March, if he keeps to his schedule.\u201d", at: days(6), memoryIds: ["rl6"], arcIds: ["rla2"] }
      ] }
    ]
  },
